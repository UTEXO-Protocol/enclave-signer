// Listener -> Parent Adapter -> Enclave (vsock:5000). Proto: listener-enclave.proto (Go -> Rust).
// Parent Adapter proxies TCP gRPC <-> vsock wire protocol. Enclave is passive (inbound only).
// Sign/PublicKey reuse signer/signer.proto; Initialize/Clone are enclave lifecycle only.
syntax = "proto3";

package tricorn;

import "signer/signer.proto";

// EnclaveService — Parent Adapter gRPC interface.
// Go Listener connects here; Parent Adapter translates to enclave wire protocol.
service EnclaveService {
  // Signs data inside TEE after cross-checking amounts.
  // data field contains enriched payload from Listener (validation results).
  rpc Sign(SignRequest) returns (Signature);

  // Returns HD-derived public key for specific network.
  rpc PublicKey(PublicKeyRequest) returns (PublicKeyResponse);

  // Generates new HD seed (BIP-39) and derives all keys. First start only.
  rpc Initialize(InitializeRequest) returns (InitializeResponse);

  // Requests HD seed from peer enclave (cluster cloning with attestation).
  rpc Clone(CloneRequest) returns (CloneResponse);

  // Returns the last block header stored in enclave's in-memory cache.
  // Listener calls this to know from where to resume header sync.
  rpc GetLastSavedBlock(GetLastSavedBlockRequest) returns (GetLastSavedBlockResponse);

  // Pushes a batch of Bitcoin block headers into the enclave's cache.
  // Listener fetches from Esplora and feeds them in ascending-height batches.
  rpc SubmitHeaders(SubmitHeadersRequest) returns (SubmitHeadersResponse);

  // Returns the bridge's public-key bundle along with an NSM attestation
  // document binding the EVM signing pubkey (in `public_key` field) and a
  // sha256 commitment over the full bundle (in `user_data` field) to the
  // running enclave's PCRs. The caller-supplied 32-byte `nonce` is echoed
  // in the doc and MUST be checked for equality on verify (replay defence).
  rpc AttestedPublicKey(AttestedPublicKeyRequest) returns (AttestedPublicKeyResponse);
}

message InitializeRequest {
  string cloning_secret = 1;
}

message InitializeResponse {
  bytes attestation = 1;
  bytes public_key = 2;
}

message CloneRequest {
  bytes attestation = 1;
  bytes encryption_pubkey = 2;
}

message CloneResponse {
  bytes encrypted_seed = 1;
}

// --- SPV: Bitcoin header sync ---
// Mirrors enclave.proto SubmitHeaders / GetLastSavedBlock. The Parent Adapter
// forwards these unchanged to the enclave wire protocol.

message GetLastSavedBlockRequest {}

message GetLastSavedBlockResponse {
  uint32 block_height = 1;
  bytes  block_hash   = 2;   // 32 bytes
}

message SubmitHeadersRequest {
  repeated bytes headers      = 1;   // raw 80-byte Bitcoin headers (batch of up to ~500)
  uint32         start_height = 2;   // block number of the first header in this batch
}

message SubmitHeadersResponse {
  uint32 last_block_height = 1;      // enclave's latest block after processing
  bytes  last_block_hash   = 2;      // 32 bytes
  uint32 headers_accepted  = 3;      // how many from the batch were valid
}

// --- Attested public key ---

message AttestedPublicKeyRequest {
  bytes nonce = 1;                   // MUST be 32 bytes; embedded in NSM doc
}

message AttestedPublicKeyResponse {
  bytes  evm_address           = 1;  // 20 bytes
  bytes  evm_uncompressed_pub  = 2;  // 64 bytes (X||Y) — ALSO present in attestation_doc.public_key
  bytes  btc_compressed_pub    = 3;  // 33 bytes
  string btc_xpub              = 4;
  bytes  master_fingerprint    = 5;  // 4 bytes
  string account_xpub_vanilla  = 6;
  string account_xpub_colored  = 7;
  bytes  attestation_doc       = 8;  // COSE_Sign1 NSM doc (real) or raw CBOR (mock)
}
