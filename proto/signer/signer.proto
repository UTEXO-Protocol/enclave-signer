// signer/signer.proto — shared messages for all Tricorn signing services (unchanged contract).
// Used by bridge-orchestrator, orchestrator-listener, listener-enclave, and upstream BridgeSigner /
// SignerNode / ConnectorBridge patterns.
syntax = "proto3";

package tricorn;

enum DataType {
  TRANSACTION = 0;
  SIGNATURE = 1;
  COMMISSION = 2;
  SWAP = 3;
  UNSPENDABLE = 4;
  OWNER_MULTIPLE_SIGNATURE = 5;
  EVM_GAS_TX = 6;
}

message SignRequest {
  uint32 network_id = 1;
  DataType data_type = 2;
  bytes data = 3;
  repeated int64 inputs = 4;
  optional string algorithm = 5;
}

message Signature {
  uint32 network_id = 1;
  bytes signature = 2;
  // For EVM fundsOut signing: the exact calldata the signature commits to.
  // The TEE derives the OpId-bound fields (burnId, fundsInIds) from the
  // validated consignment and rewrites them, so the caller MUST submit THIS
  // calldata on-chain rather than the one it sent. Empty for PSBT / raw-digest
  // responses and for non-fundsOut EVM paths (caller falls back to its own).
  bytes call_data = 3;
}

message PublicKeyRequest {
  uint32 network_id = 1;
  DataType data_type = 2;
  optional string algorithm = 3;
}

message PublicKeyResponse {
  bytes public_key = 1;
}
