// enriched-payload.proto — message-only (no gRPC). Listener serializes into SignRequest.data;
// Enclave deserializes using network_id + data_type dispatch (see EnrichedPsbtPayload /
// EnrichedEvmPayload). Bootstrap messages define Orchestrator -> Listener bytes before enrichment.
syntax = "proto3";

package tricorn.enriched;

// --- Orchestrator -> Listener (minimal routing; Listener validates and enriches) ---

message SignPsbtBootstrap {
  string tx_hash = 1;
  uint64 operation_idx = 2;
  bytes consignment_hash = 3;
  bytes consignment = 4;
}

message SignEvmBootstrap {
  bytes call_data = 1;
  bytes consignment_hash = 2;
  bytes consignment = 3;
  uint64 nonce = 4;
  uint64 deadline = 5;
}

// --- Listener -> Enclave (EVM -> RGB: PSBT signing) ---
// Dispatch: SignRequest with data_type TRANSACTION (see service comments).

message EnrichedPsbtPayload {
  bytes evm_tx_hash = 1;
  uint64 operation_idx = 2;

  bool evm_event_valid = 3;
  bool evm_event_finalized = 4;
  bytes evm_token = 5;
  uint64 evm_amount = 6;
  bytes evm_recipient = 7;
  uint64 evm_commission = 8;

  bytes psbt_bytes = 9;
  uint64 psbt_output_amount = 10;
  string rgb_asset_id = 11;

  // Raw RGB consignment + keccak256 integrity hash for in-enclave validation
  // of the send-RGB direction (see SignPsbtRequest fields 12/13).
  bytes consignment = 12;
  bytes consignment_hash = 13;
}

// --- Listener -> Enclave (RGB -> EVM: EVM signing) ---
// Dispatch: SignRequest with data_type SWAP.

message EnrichedEvmPayload {
  bytes call_data = 1;
  uint64 nonce = 2;
  uint64 deadline = 3;

  bool consignment_valid = 4;
  uint64 rgb_amount = 5;
  string rgb_asset_id = 6;

  uint64 chain_id = 7;
  bytes proxy_contract = 8;
  uint64 calldata_amount = 9;
  uint64 calldata_commission = 10;

  bytes consignment = 11;
  // keccak256(consignment) — 32 bytes; Enclave integrity check (see SignEvmRequest).
  bytes consignment_hash = 12;

  // SPV proofs for consignment anchor txids (one entry per witness tx in the consignment).
  // Listener fetches each from Esplora; Enclave verifies each against its cached header chain
  // before signing. See proto/enclave.proto MerkleProofEntry for the wire format.
  repeated MerkleProofEntry merkle_proofs = 13;

  // RGB OpId of the transition this EVM action is bound to (audit TEE-SE-02 /
  // spec §6). Mirrors SignEvmRequest.op_id — the Parent Adapter passes it
  // straight through; the Enclave cross-checks it against the validated
  // consignment's OpIds. Same string form the consignment parser yields.
  string op_id = 14;
}

// Proof that a Bitcoin transaction is included in a specific block.
// Listener fetches these from Esplora and passes to Enclave inside EnrichedEvmPayload.
message MerkleProofEntry {
  bytes  txid         = 1;  // 32 bytes — transaction being proven
  uint32 block_height = 2;  // block number where the tx was included
  uint32 tx_position  = 3;  // position of tx in the block's tx list
  repeated bytes merkle_path = 4;  // sibling hashes from leaf to root (each 32 bytes)
}
