syntax = "proto3";
package utexo_bridge.enclave;

// Top-level envelopes. One connection = one request/response pair.
// Adding a new operation = add variant here + match arm in server.rs.

message EnclaveRequest {
  oneof request {
    InitializeKeyRequest   initialize_key    = 1;
    GetPublicKeyRequest    get_public_key    = 2;
    SignEvmRequest         sign_evm          = 3;
    SignPsbtRequest        sign_psbt         = 4;
    SignRawMessageRequest  sign_raw_message  = 5;
    ProxyFederationRequest proxy_federation  = 6;
    InitiateCloningRequest initiate_cloning  = 7;
    GetCloneRequest        get_clone         = 8;
    SetCloneRequest        set_clone         = 9;
    SubmitHeadersRequest      submit_headers        = 11;
    GetLastSavedBlockRequest  get_last_saved_block  = 12;
    GetAttestedPublicKeyRequest get_attested_public_key = 13;
    // Reserved for future:
    // HealthCheckRequest  health_check     = 10;
  }
}

message EnclaveResponse {
  oneof response {
    InitializeKeyResponse   initialize_key   = 1;
    PublicKeysResponse      public_keys      = 2;
    EvmSignatureResponse    evm_signature    = 3;
    SignedPsbtResponse      signed_psbt      = 4;
    RawSignatureResponse    raw_signature    = 5;
    FederationSignatureResponse federation_sig = 6;
    InitiateCloningResponse initiate_cloning = 7;
    GetCloneResponse        get_clone        = 8;
    SetCloneResponse        set_clone        = 9;
    SubmitHeadersResponse      submit_headers       = 11;
    GetLastSavedBlockResponse  get_last_saved_block = 12;
    GetAttestedPublicKeyResponse get_attested_public_key = 13;
    // Reserved for future:
    // HealthCheckResponse  health_check     = 10;
    ErrorResponse           error            = 15;
  }
}

// === Key Management ===

message InitializeKeyRequest {
  // Empty = generate new mnemonic from OS entropy (production path).
  // Non-empty = import raw 64-byte seed (requires `allow-seed-import` feature, testing only).
  bytes seed = 1;
  // BIP-39 mnemonic phrase (requires `allow-seed-import` feature, testing only).
  // If non-empty, takes precedence over seed.
  string mnemonic = 2;
}

message InitializeKeyResponse {
  bytes evm_address             = 1;  // 20 bytes — keccak256(uncompressed_pubkey[1..])[12..]
  bytes btc_compressed_pub      = 2;  // 33 bytes — compressed secp256k1 public key (BIP-84 legacy, kept for compat)
  string btc_xpub               = 3;  // Base58 xpub string (BIP-84 legacy, kept for compat)
  bytes master_fingerprint      = 4;  // 4 bytes — BIP-32 master key fingerprint for cosigner identification
  string account_xpub_vanilla   = 5;  // BIP-86 account xpub for vanilla (BTC) operations: m/86'/<coin>'/0'
  string account_xpub_colored   = 6;  // BIP-86 account xpub for colored (RGB) operations: m/86'/827167'/0'
  bytes evm_uncompressed_pub    = 7;  // 64 bytes — secp256k1 X||Y (no 04 prefix), needed by EVM connectors
}

message GetPublicKeyRequest {
  // Empty — returns all public keys. In the future the team's proto has
  // a network_id field for per-network queries, but for now we return all.
}

message PublicKeysResponse {
  bytes evm_address             = 1;
  bytes btc_compressed_pub      = 2;
  string btc_xpub               = 3;
  bytes master_fingerprint      = 4;
  string account_xpub_vanilla   = 5;
  string account_xpub_colored   = 6;
  bytes evm_uncompressed_pub    = 7;  // 64 bytes — secp256k1 X||Y (no 04 prefix)
}

// Returns the public-key bundle along with an NSM attestation document
// that cryptographically binds the keys to this enclave's PCRs at the time
// of the call. Lets external verifiers (bridge contract operator, auditors)
// confirm "the EVM address signing my bridge txs was produced by code with
// PCR0=X" without any trust in the parent process.
//
// `nonce` MUST be a fresh 32 bytes from the verifier — the enclave embeds
// it in the NSM doc, and the verifier checks equality on response to defeat
// replay. The NSM doc binds:
//     public_key field -> evm_uncompressed_pub (64 bytes, primary signing key)
//     user_data  field -> sha256(canonical_bundle)
// where canonical_bundle is the length-prefixed concatenation of every key
// in PublicKeysResponse. A lightweight verifier may stop at the public_key
// field; a thorough one rebuilds the bundle and checks user_data.
message GetAttestedPublicKeyRequest {
  bytes nonce = 1;  // MUST be 32 bytes
}

message GetAttestedPublicKeyResponse {
  PublicKeysResponse public_keys     = 1;
  bytes              attestation_doc = 2;  // COSE_Sign1 NSM attestation (real) or raw CBOR (mock)
}

// === EVM Signing (RGB→EVM direction) ===

message SignEvmRequest {
  // Original fields (sent by Orchestrator → Listener → Parent → Enclave)
  bytes call_data       = 1;  // Raw ABI-encoded function call (e.g., fundsOut selector + params)
  uint64 nonce          = 2;  // Per-selector sequential nonce (matches on-chain MultisigProxy nonce)
  uint64 deadline       = 3;  // Unix timestamp — signature invalid after this time

  // Enriched by Listener (validation results)
  bool consignment_valid    = 4;   // Listener validated the RGB consignment
  uint64 rgb_amount         = 5;   // Amount from validated consignment (smallest unit)
  string rgb_asset_id       = 6;   // RGB asset identifier from consignment

  // For EIP-712 domain (Listener reads from config/chain)
  uint64 chain_id           = 7;
  bytes proxy_contract      = 8;   // 20 bytes — verifying contract address

  // Pre-extracted from call_data by Listener (avoids ABI parsing in enclave)
  uint64 calldata_amount    = 9;
  uint64 calldata_commission = 10;

  // Raw RGB consignment for in-enclave validation (PR2 will add full rgb-lib validation).
  // For now the enclave verifies keccak256(consignment) == consignment_hash as integrity check.
  bytes consignment         = 11;  // Raw RGB consignment bytes (from Go Listener via Parent Adapter)
  bytes consignment_hash    = 12;  // keccak256(consignment) — integrity check

  // SPV proofs that each consignment-anchor Bitcoin tx is included in the
  // accepted Bitcoin chain. Forwarded by the Parent Adapter from the
  // listener-side EnrichedEvmPayload.merkle_proofs (same shape, same field
  // numbers — see proto/enriched-payload.proto).
  repeated MerkleProofEntry merkle_proofs = 13;
}

// Mirrors enriched-payload.proto's MerkleProofEntry. Defined here too so
// the enclave wire protocol is self-contained — no cross-package import.
// txid + each entry of merkle_path are 32-byte hashes in DISPLAY (big-endian)
// order (as Esplora returns them); the SPV verifier reverses to internal
// order at the boundary.
message MerkleProofEntry {
  bytes  txid         = 1;
  uint32 block_height = 2;
  uint32 tx_position  = 3;
  repeated bytes merkle_path = 4;
}

message EvmSignatureResponse {
  bytes signature = 1;      // 65 bytes: r(32) + s(32) + v(1), Ethereum ECDSA convention
}

// === PSBT Signing (EVM→RGB direction) ===

message SignPsbtRequest {
  // Original fields
  bytes evm_tx_hash       = 1;   // 32 bytes — for Listener validation
  uint64 operation_idx    = 2;   // For Listener query

  // Enriched by Listener (EVM event validation)
  bool evm_event_valid       = 3;
  bool evm_event_finalized   = 4;
  bytes evm_token            = 5;   // 20 bytes — ERC-20 address (empty for native)
  uint64 evm_amount          = 6;   // Deposit amount from FundsIn event
  bytes evm_recipient        = 7;   // 20 bytes
  uint64 evm_commission      = 8;

  // Enriched by Listener (PSBT data from rgb-multisig-bridge)
  bytes psbt_bytes           = 9;   // Raw PSBT fetched by Listener
  uint64 psbt_output_amount  = 10;  // Total non-change output amount from PSBT
  string rgb_asset_id        = 11;
}

message SignedPsbtResponse {
  bytes signed_psbt    = 1; // Serialized PSBT with our partial signature(s) added
  uint32 inputs_signed = 2; // Number of inputs we signed
}

// === Raw Message Signing (fundsIn authorization) ===
// Single TEE signature (1-of-n) to prove the smart contract was called
// through the Tricorn backend. Used for fundsIn parameter authorization.

message SignRawMessageRequest {
  bytes message = 1;  // Arbitrary message bytes to sign (will be keccak256-hashed then signed)
}

message RawSignatureResponse {
  bytes signature = 1;  // 65 bytes: r(32) + s(32) + v(1), Ethereum ECDSA convention
}

// === Federation Proxy ===

message ProxyFederationRequest {
  bytes message_hash = 1;     // 32 bytes — keccak256 of published message
}

message FederationSignatureResponse {
  bytes signature = 1;        // 65-byte ECDSA from Listener's federation key
}

// === Cloning Handshake ===
//
// Internal three-message protocol for enclave-to-enclave seed cloning:
//
//   1. Parent -> new (requester) enclave: InitiateCloningRequest.
//      Requester generates an X25519 ephemeral keypair, HMACs the pubkey
//      with the cloning secret, asks NSM to attest the pubkey (embedded in
//      the public_key field) and the digest (embedded in user_data).
//      Returns attestation + pubkey + digest so the parent can relay to
//      a donor.
//
//   2. Parent -> donor enclave (relayed): GetCloneRequest.
//      Donor verifies the attestation chain, PCRs, that the pubkey inside
//      the attestation equals the one claimed on the wire, that the digest
//      inside user_data equals the one on the wire, that the digest verifies
//      against its configured cloning secret, and that cluster_public_key
//      matches its own EVM address. It then seals its seed via X25519 +
//      HKDF + ChaCha20Poly1305 and returns (ciphertext, its own ephemeral
//      pubkey, its own attestation).
//
//   3. Parent -> requester enclave (relayed): SetCloneRequest.
//      Requester verifies the donor attestation, unseals the ciphertext,
//      derives a KeyManager from the seed, and checks the derived EVM
//      address matches the cluster_public_key it was told to clone.
//      Transitions to Active. Response is empty — the parent infers
//      success by calling GetPublicKey afterwards.
//
// The Go `listener-enclave.proto` contract at the gRPC boundary only has
// `Initialize(cloning_secret)` and `Clone(attestation, encryption_pubkey)`.
// The parent adapter translates: Initialize -> InitiateCloning,
// Clone -> GetClone, and drives SetClone over vsock internally.
// The cloning_digest never crosses the gRPC boundary — it is bound into
// the attestation's user_data and extracted by the donor post-verify.

message InitiateCloningRequest {
  string cloning_secret       = 1;  // Pre-shared operator secret (never sent to donor)
  bytes  cluster_public_key   = 2;  // 20-byte EVM address of the donor we intend to clone
}

message InitiateCloningResponse {
  bytes  requester_attestation = 1;  // NSM doc binding the X25519 pubkey + digest
  bytes  encryption_pubkey     = 2;  // 32-byte X25519 public key
  bytes  cloning_digest        = 3;  // 32-byte HMAC-SHA256(secret, encryption_pubkey)
}

message GetCloneRequest {
  bytes  cluster_public_key    = 1;  // 20 bytes — must match donor's EVM address
  bytes  cloning_digest        = 2;  // 32 bytes — verified against donor's own cloning secret
  bytes  encryption_pubkey     = 3;  // 32 bytes — requester's X25519 pubkey
  bytes  requester_attestation = 4;  // Signed doc binding both of the above
}

message GetCloneResponse {
  bytes  encrypted_seed        = 1;  // ChaCha20Poly1305(HKDF(X25519(donor_eph, requester_pub)), seed)
  bytes  donor_pubkey          = 2;  // 32-byte donor ephemeral X25519 pubkey
  bytes  donor_attestation     = 3;  // Signed doc binding donor_pubkey
}

message SetCloneRequest {
  bytes  encrypted_seed        = 1;
  bytes  donor_pubkey          = 2;
  bytes  donor_attestation     = 3;
}

// SetClone has a response purely so the envelope oneof stays non-empty on
// the wire (matching every other request). The body is intentionally empty
// — a successful SetClone is silent and the caller probes GetPublicKey.
message SetCloneResponse {
}

// === SPV — Bitcoin header sync ===
//
// Listener pushes block headers into the enclave's in-memory chain so the
// enclave can verify Merkle inclusion proofs (delivered alongside
// EnrichedEvmPayload.merkle_proofs) before signing. The enclave is passive:
// the Listener drives sync, the enclave validates and stores.
//
// PR 1 wires up the proto + grpc surface only; the handlers return
// ErrorResponse(NOT_READY). Header validation, in-memory chain, and Merkle
// proof verification land in subsequent PRs (see docs/spv-review.md).

message SubmitHeadersRequest {
  // Raw 80-byte Bitcoin headers (batch, contiguous, in ascending height order).
  // Listener typically batches up to ~500 to keep gRPC messages small.
  repeated bytes headers      = 1;
  // Block height of headers[0]. Headers must connect to the enclave's stored
  // chain (i.e. start_height == last_saved_height + 1) — except for the very
  // first batch which connects to the compiled-in checkpoint.
  uint32         start_height = 2;
}

message SubmitHeadersResponse {
  uint32 last_block_height = 1;  // enclave's tip after applying this batch
  bytes  last_block_hash   = 2;  // 32 bytes
  uint32 headers_accepted  = 3;  // number of headers from the batch that validated
}

message GetLastSavedBlockRequest {}

message GetLastSavedBlockResponse {
  uint32 block_height = 1;       // height of the latest header the enclave has
  bytes  block_hash   = 2;       // 32 bytes
}

// === Error ===

message ErrorResponse {
  uint32 code    = 1;
  string message = 2;
}
