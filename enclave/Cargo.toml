[package]
name = "utexo-bridge-enclave"
version = "0.1.0"
edition = "2021"

[lib]
name = "utexo_bridge_enclave"
path = "src/lib.rs"

[[bin]]
name = "utexo-bridge-enclave"
path = "src/main.rs"

[dependencies]
# Protobuf
prost = "0.14.3"
federated-signer-proto = { git = "ssh://git@github.com/UTEXO-Protocol/federated-signer-proto.git", rev = "08ab48be2f42ec1ae11d93672f630dc2035245c5", package = "federated-signer-proto" }
# Crypto — ECDSA on secp256k1 (EVM address derivation + signing later)
k256 = { version = "0.13", features = ["ecdsa"] }

# Crypto — BTC (BIP-32 HD derivation, xpub serialization, SegWit later)
bitcoin = { version = "0.32", features = ["std"] }

# Crypto — BIP-39 mnemonic
bip39 = { version = "2.1", features = ["zeroize"] }

# Crypto — Ed25519 (Concordium governance account signatures). Key derived from
# the seed via SLIP-0010 (HMAC-SHA512), signed over the 32-byte tx hash.
ed25519-dalek = { version = "2", features = ["zeroize"] }

# Secret handling (zeroize-on-drop, redacted Debug)
secrecy = "0.10"
zeroize = { version = "1.8", features = ["derive"] }

# Hashing
sha3 = "0.10"

# Entropy
getrandom = "0.4.2"

# Error handling
thiserror = "2"

# Encoding
hex = "0.4"
alloy-primitives = "1"
alloy-sol-types = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# RGB consignment validation (optional, behind rgb-validation feature)
rgb-ops = { version = "0.11.1-rc.7", features = ["esplora_blocking", "electrum_blocking"], optional = true }
# Flat-shape parser for RGB consignments. Used by rgb-validation to walk
# transitions (op_id / transition_type / fungible_allocations) without
# hand-rolling another rgbstd walk. `default-features = false` skips the
# CLI deps (clap / env_logger / log / serde_json) we don't need inside
# the enclave.
#
# SSH-style URL so cargo authenticates via the build environment's SSH
# agent / deploy key (no PAT/insteadOf juggling in CI). Tracks the
# parser's `main` branch directly; Cargo.lock pins the exact rev for
# reproducible builds.
rgb-consignment = { git = "ssh://git@github.com/UTEXO-Protocol/rgb-consignment-parser.git", branch = "main", default-features = false, optional = true }
# Canonical RGB schema definitions (NIA/UDA/CFA/IFA). Source of the trusted
# strict type-system the validator pins consignments against — the same crate
# rgb-lib uses (`AssetSchema::types()` -> `InflatableFungibleAsset::types()`).
# Pins per schema_id so a consignment cannot self-validate its own types
# (audit 4th W-01 / #92). `default-features = false` skips the CLI bin deps.
rgb-schemas = { version = "=0.11.1-rc.10", default-features = false, optional = true }

# Attestation verification (COSE_Sign1 + AWS Nitro cert chain) lives in
# the workspace `attestation-verify` crate so the parent CLI binary and
# the enclave share a single verifier.
attestation-verify = { path = "../attestation-verify" }
serde = { version = "1", features = ["derive"] }

# Cloning handshake crypto (X25519 DH + HKDF + ChaCha20Poly1305 + HMAC-SHA256)
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
rand_core = { version = "0.6", features = ["getrandom"] }
# rustls (not native-tls) to match the enclave's existing TLS stack (minreq
# rustls) and keep OpenSSL out of the TEE. The enclave->forwarder hop is plain
# loopback HTTP; TLS to the real RPC (if any) terminates at the host proxy.
alloy = { version = "2.1.0", default-features = false, features = ["provider-http", "rpc-types-eth", "reqwest-rustls-tls"], optional = true }
tokio = { version = "1.52.3", default-features = false, features = ["rt", "rt-multi-thread", "time"], optional = true }
# Helios Ethereum light client for trustless in-enclave EVM event verification
# (#77), behind the default-OFF `helios` feature. Depend on the `helios-ethereum`
# member crate (NOT the `helios` umbrella) to avoid pulling helios-opstack ->
# libp2p and its heavy/yanked transitive deps. Git dep (crates.io copies are
# stale); Cargo.lock pins the exact rev. HEAVY: brings a second alloy major
# (1.x, vs our 2.x), revm, BLS, reqwest, and vendored OpenSSL.
#
# OpenSSL note: it comes only from Helios's own manifests (an unused
# `openssl = {vendored}` dep in helios-core/ethereum + reqwest's default
# native-tls) - not removable from here (cargo feature unification is additive).
# To drop it, fork Helios and (1) set reqwest `default-features = false` +
# `rustls-tls`, (2) delete the `openssl` workspace dep + the `openssl.workspace`
# lines, then pin this to the fork. Deferred (helios is experimental/default-off).
helios-ethereum = { git = "https://github.com/a16z/helios", tag = "0.11.1", optional = true }
# NOTE: the `helios` module hands `B256`/`U256` to/from the Helios API using the
# always-on `alloy-primitives = "1"` declared above (dev-ng's new-arch EVM
# validation already depends on it non-optionally). Helios also uses the alloy 1.x
# major, so cargo unifies to the same crate instance; no separate optional
# alloy-primitives dep is needed here.

[target.'cfg(target_os = "linux")'.dependencies]
vsock = "0.5"
nix = { version = "0.31.2", features = ["socket", "time"] }
aws-nitro-enclaves-nsm-api = "0.4"

[features]
# Production posture: a plain `cargo build` produces the SPV path (which pulls
# in `rgb-validation`), so the default binary is the one shipped in the EIF. A
# minimal build is still available via `--no-default-features` and is covered
# explicitly in CI.
default = ["spv"]
vsock = []
# DANGER: allows importing a raw seed over the wire. Testing only.
allow-seed-import = []
# Skips cross-check validation on signing requests. Development/testing only.
dev-mode = []
# In-enclave RGB consignment validation via rgbstd + Esplora. REQUIRES `spv`
# (enforced by a `compile_error!` in lib.rs — audit M-01 / #61): without SPV the
# only anchor for a consignment's witness txs is the host-controlled Esplora
# resolver, so a malicious host could have the enclave sign a release against a
# fabricated Bitcoin anchor. Kept as a separate feature (rather than adding
# `spv` to this list) to avoid a feature cycle with `spv` below.
rgb-validation = ["rgb-ops", "rgb-consignment", "rgb-schemas"]
# Bitcoin SPV verification of consignment witness txids before signing EVM
# transactions. Implies `rgb-validation` because SPV needs the consignment
# parsed to extract witness txids. When the feature is OFF, handle_sign_evm
# refuses to sign ANY `fundsOut` release — regardless of whether the request
# carries merkle_proofs — and additionally rejects any request that does carry
# merkle_proofs it cannot verify (fail-closed against listener/enclave build
# mismatches).
spv = ["rgb-validation"]
# Mock attestation path: skip NSM / COSE / cert-chain checks and use raw CBOR docs.
# Testing only — never enable in production builds.
mock-attestation = ["attestation-verify/mock"]
# Independent in-enclave EVM `FundsIn` event verification for signPsbt (#60).
# Default-OFF. When ON, bridge-mode signPsbt fetches the deposit receipt via an
# in-enclave alloy JSON-RPC client (loopback -> vsock forwarder -> host EVM RPC)
# and fails closed on a missing/invalid receipt or unmet confirmation depth.
# Implies `rgb-validation`: the bridge path this augments (`psbt_consignment_crosscheck`)
# is already gated there, and the amount/asset context the predicate reconciles
# lives behind it. NOTE: RPC responses are relayed by the UNTRUSTED host, so this
# is the predicate + plumbing layer and only becomes trustless once Helios (#77)
# verifies the RPC.
evm-rpc = ["rgb-validation", "dep:alloy", "dep:tokio"]
# Trustless variant of `evm-rpc` (#77): the Helios light client verifies the EVM
# RPC against a pinned weak-subjectivity checkpoint before accepting a FundsIn
# receipt. Runtime-selectable: with HELIOS_EXECUTION_RPC set the enclave uses the
# verified path, else the raw alloy path - which a release rgb-validation build
# rejects at boot (production policy requires the trustless source). Shipped in
# the production EIF. HEAVY build (2 alloy majors, revm, BLS, vendored OpenSSL).
helios = ["evm-rpc", "dep:helios-ethereum"]

[dev-dependencies]
rand = "0.10.0"
