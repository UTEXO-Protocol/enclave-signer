[package]
name = "utexo-bridge-enclave"
version = "0.1.0"
edition = "2021"

[lib]
name = "utexo_bridge_enclave"
path = "src/lib.rs"

[[bin]]
name = "utexo-bridge-enclave"
path = "src/main.rs"

[dependencies]
bip39 = { version = "3", features = ["zeroize"] }
bitcoin = { version = "0.32", features = ["std"] }
chacha20poly1305 = "0.11"
ed25519-dalek = { version = "3", features = ["zeroize"] }
enclave-proto = { path = "../enclave-proto" }
getrandom = "0.4.2"
hkdf = "0.13"
hmac = "0.13"
k256 = { version = "0.14", features = ["ecdsa"] }
prost = "0.14.3"
secrecy = "0.10"
sha2 = "0.11"
sha3 = "0.12"
subtle = "2"
thiserror = "2"
x25519-dalek = { version = "3", features = ["getrandom", "static_secrets", "zeroize"] }
zeroize = { version = "1.8", features = ["derive"] }

# Encoding
hex = "0.4"
alloy-primitives = "1"
alloy-sol-types = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# RGB consignment validation (optional, behind rgb-validation feature)
rgb-ops = { version = "0.11.1-rc.7", features = ["esplora_blocking", "electrum_blocking"], optional = true }
rgb-consignment = { git = "https://github.com/UTEXO-Protocol/consignment-utils.git", rev = "a6c2e4913bfe3b682270bc747311a2cf7160982b", default-features = false, optional = true }
rgb-schemas = { version = "=0.11.1-rc.10", default-features = false, optional = true }
# Invoice parsing for the send-RGB recipient bind. Same repo and rev as
# `rgb-ops`, so it adds no new third-party code. Pinned to rc.10 like
# `rgb-schemas`: the BFA mirrors in the workspace `[patch]` are cut from rc.10.
# An rc.11 requirement makes cargo ignore the patch.
rgb-invoicing = { version = "=0.11.1-rc.10", default-features = false, optional = true }
attestation-verify = { path = "../attestation-verify" }
serde = { version = "1", features = ["derive"] }

# Optional seed custody. The AWS SDK for KMS does transport, SigV4 and the
# request model. `aws-nitro-enclaves-nsm-api` supplies the attestation document.
# RustCrypto opens the Recipient envelope (CMS, RFC 5652).
base64 = { version = "0.23", optional = true }
serde_json = { version = "1", optional = true }
aws-sdk-kms = { version = "1.121", default-features = false, features = ["rt-tokio", "behavior-version-latest"], optional = true }
aws-credential-types = { version = "1.3", optional = true }
aws-smithy-http-client = { version = "1.4", default-features = false, features = ["rustls-aws-lc"], optional = true }
aws-smithy-types = { version = "1.8", optional = true }
aws-smithy-runtime-api = { version = "1.18", optional = true }
aws-smithy-async = { version = "1.3", features = ["rt-tokio"], optional = true }
cms = { version = "0.2", optional = true }
rsa = { version = "0.9", features = ["sha2", "getrandom"], optional = true }
aes = { version = "0.9", optional = true }
cbc = { version = "0.2", features = ["alloc"], optional = true }

alloy = { version = "2.1.0", default-features = false, features = ["provider-http", "rpc-types-eth", "reqwest-rustls-tls"], optional = true }
tokio = { version = "1.52.3", default-features = false, features = ["rt", "rt-multi-thread", "time"], optional = true }
# Check the launch endpoints: host names and the EVM RPC CA. Both crates are
# already in the lock under reqwest.
rustls-pki-types = { version = "1.15", optional = true }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
vsock = "0.5"
nix = { version = "0.31.2", features = ["socket", "time"] }
aws-nitro-enclaves-nsm-api = "0.5"

[features]
# A plain `cargo build` is the combined bridge: rgb + ccd. Production images
# add `vsock` and `evm-rpc` (see build/Dockerfile.enclave*).
#
# Single-network EIFs, one flow each:
#   RGB send/receive: `--no-default-features --features vsock,rgb,rgb-swap,evm-rpc`
#   RGB mint:         `--no-default-features --features vsock,rgb,mint-signer`
#   RGB burn:         `--no-default-features --features vsock,rgb,burn-signer`
#   Concordium:       `--no-default-features --features vsock,ccd` (no
#                     bridge-signing path).
# CI builds all of them. A `compile_error!` pair in lib.rs requires exactly one
# RGB flow.
default = ["rgb", "rgb-swap", "ccd"]

# Network-selection umbrellas. Enable one for a single-network EIF, or both
# for the combined build. They gate only request handling (dispatch arms,
# validators, SPV). Key derivation and the attestation pubkey bundle are the
# same in every build, so the parent verifier does not change.
#
# `rgb` = the RGB/BTC bridge stack. `spv` implies `rgb-validation`, so this
# pulls the RGB deps and the SPV header chain. `evm-rpc` is a separate opt-in.
rgb = ["spv"]
# `ccd` = the Concordium bridge stack. No extra deps: ed25519 is always on to
# keep key derivation and the attestation bundle the same in every build.
ccd = []

# RGB flow selection. EXACTLY ONE is required when `rgb-validation` is on.
# A `compile_error!` pair in lib.rs enforces it. Each flow ships as its own
# enclave image with its own PCR0, so a send/receive enclave has no mint rule.
#
# The default set carries `rgb-swap`, so a mint/burn image MUST use
# `--no-default-features`.
#
# The per-flow rules are in `enclave/src/networks/rgb/flow/{swap,mint_burn}.rs`.
# The rest of consignment validation is shared.
#
# `rgb-swap` = pools/send-receive: the bridge holds an allocation and moves it
# with BFA `Transfer` in both directions. Retired flow: production is mint/burn.
rgb-swap = ["rgb"]
# `rgb-mint-burn` = the bridge owns the contract's mint right: deposits mint
# with BFA `Bridge`, withdrawals destroy with BFA `Burn`.
rgb-mint-burn = ["rgb"]

# Seed custody is a separate capability, enabled only by the mint signer.
kms-persistence = [
    "dep:base64",
    "dep:serde_json",
    "nix/poll",
    "dep:tokio",
    "dep:aws-sdk-kms",
    "dep:aws-credential-types",
    "dep:aws-smithy-http-client",
    "dep:aws-smithy-types",
    "dep:aws-smithy-runtime-api",
    "dep:aws-smithy-async",
    "dep:cms",
    "dep:rsa",
    "dep:aes",
    "dep:cbc",
]

vsock = []
# DANGER: allows importing a raw seed over the wire. Testing only.
allow-seed-import = []
# In-enclave RGB consignment validation via rgbstd + Esplora. REQUIRES `spv`
# (a `compile_error!` in lib.rs). Without SPV, the host-controlled Esplora is the
# only anchor for witness txs. A malicious host can then fake a Bitcoin anchor.
# `spv` is not in this list because that makes a feature cycle.
rgb-validation = ["rgb-ops", "rgb-consignment", "rgb-schemas", "rgb-invoicing", "dep:rustls-pki-types"]
# Bitcoin SPV verification of consignment witness txids before EVM signing.
# Implies `rgb-validation`: SPV reads the witness txids from the consignment.
# When OFF, handle_sign_evm refuses every `fundsOut` release (fail-closed).
spv = ["rgb-validation"]
# Mock attestation: skip NSM / COSE / cert-chain checks and use raw CBOR docs.
# Testing only. Never enable in production builds.
mock-attestation = ["attestation-verify/mock"]
# Accept all-zero peer PCRs for debug clone tests (F03-AF-12).
# Never enable in production builds.
allow-debug-pcrs = ["attestation-verify/allow-debug-pcrs"]
# In-enclave EVM `FundsIn` event verification for signPsbt. Default OFF.
# signPsbt fetches the deposit receipt with an in-enclave alloy JSON-RPC client.
# It fails closed on a missing or invalid receipt or too few confirmations.
# TLS to the pinned RPC host and CA ends inside the enclave. The host relays
# only ciphertext through the vsock forwarder.
# Implies `rgb-validation`: the bridge path and amount/asset context are there.
evm-rpc = ["rgb-validation", "dep:alloy", "dep:tokio", "dep:rustls-pki-types", "dep:webpki"]
# Ether-extension validation of BFA mints, in either RGB flow. BFA is the only
# schema the enclave admits. A BFA mint script ends in `cea`, which the default
# validator decodes as `Fail`. Without this feature, every mint and every
# consignment with mint ancestry fails on that opcode.
# Needs `evm-rpc`: the opcode checks events from the enclave's own `FundsIn` read.
bfa-validation = ["evm-rpc"]
# `rgb-mint-burn`, not plain `rgb`: a BFA `Bridge` transition is a mint, so
# its rules belong to that flow only. lib.rs rejects both flows at once, so
# `--features bfa-mint` on the default set does not compile.
bfa-mint = ["rgb-mint-burn", "bfa-validation"]

# Mint/burn signer role. EXACTLY ONE is required when `rgb-mint-burn` is on
# (lib.rs `compile_error!`). Each role ships as its own image with its own PCR0
# and seed. A mint signer has no release rule; a burn signer has no mint rule.
# The role is attested (`SignerRole`).
#
# Both keep `bfa-mint`: a burn consignment carries mint ancestry.
# `build.rs` turns the role into the `evm_to_rgb` / `rgb_to_evm` cfgs.
#
# `mint-signer` = EVM -> RGB: co-signs the RGB mint PSBT (and create_utxo).
mint-signer = ["bfa-mint", "kms-persistence"]
# `burn-signer` = RGB -> EVM: signs the `fundsOut` release (and its gas tx).
burn-signer = ["bfa-mint"]

[dev-dependencies]
rand = "0.10.0"
# Canned KMS HTTP exchanges for the `kms` unit tests.
aws-smithy-http-client = { version = "1.4", default-features = false, features = ["rustls-aws-lc", "test-util"] }
http = "1"
# The in-test TLS server of `tests/test_evm_rpc_tls.rs`. Already in the lock.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
# `StrictDumb`, for the synthetic burn transition in the consensus tests of
# `networks/rgb/validation/tests.rs`. Already in the lock.
strict_encoding = { package = "rgb-strict-encoding", version = "1.0.2" }
