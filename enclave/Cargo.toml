[package]
name = "utexo-bridge-enclave"
version = "0.1.0"
edition = "2021"

[lib]
name = "utexo_bridge_enclave"
path = "src/lib.rs"

[[bin]]
name = "utexo-bridge-enclave"
path = "src/main.rs"

[dependencies]
bip39 = { version = "3", features = ["zeroize"] }
bitcoin = { version = "0.32", features = ["std"] }
chacha20poly1305 = "0.11"
ed25519-dalek = { version = "3", features = ["zeroize"] }
enclave-proto = { path = "../enclave-proto" }
getrandom = "0.4.2"
hkdf = "0.13"
hmac = "0.13"
k256 = { version = "0.14", features = ["ecdsa"] }
prost = "0.14.3"
secrecy = "0.10"
sha2 = "0.11"
sha3 = "0.12"
subtle = "2"
thiserror = "2"
x25519-dalek = { version = "3", features = ["getrandom", "static_secrets", "zeroize"] }
zeroize = { version = "1.8", features = ["derive"] }

# Encoding
hex = "0.4"
alloy-primitives = "1"
alloy-sol-types = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# RGB consignment validation (optional, behind rgb-validation feature). The
# sources are the root [patch.crates-io] (rgb-lib's protocol crates): a rev bump
# there can change the BFA schema id. Exact pins keep a newer prerelease out.
rgb-ops = { version = "=0.11.2-rc.1", default-features = false, features = ["esplora_blocking", "electrum_blocking"], optional = true }
rgb-schemas = { version = "=0.11.2-rc.1", default-features = false, optional = true }
# Invoice parsing for the recipient bind of a deposit that names an RGB invoice.
rgb-invoicing = { version = "=0.11.2-rc.1", default-features = false, optional = true }
# Not used directly: pins the consensus and VM crates that rgb-ops pulls with a
# caret requirement.
rgb-consensus = { version = "=0.11.2-rc.1", default-features = false, optional = true }
rgb-aluvm = { version = "=0.11.2-rc.1", default-features = false, optional = true }
# Byte views of RGB ids. The version rgb-ops pins.
amplify = { version = "=4.8.1", optional = true }
# Decodes the fascia rgb-lib writes for a mint or refill tx, which carries its
# RGB data (rgb-lib strips it from the PSBT). The version rgb-ops pins.
strict_encoding = { package = "rgb-strict-encoding", version = "=1.0.5", optional = true }
# Our private mirror of RGB-Tools bfa 66bae096 (tag v0.3.0-beta.7-upstream-dev-bfa.6),
# without the wallet. It validates a consignment and reads its flat summary
# (`inspect_consignment`). The root [patch.crates-io] copies its protocol crate revs.
rgb-lib = { git = "ssh://git@github-rgb-lib/UTEXO-Protocol/rgb-lib-bfa.git", rev = "5010eefa355beb9c42a4c1b69883f7651241a111", default-features = false, optional = true }
attestation-verify = { path = "../attestation-verify" }
serde = { version = "1", features = ["derive"] }

# Optional seed custody. The AWS SDK for KMS does transport, SigV4 and the
# request model. `aws-nitro-enclaves-nsm-api` supplies the attestation document.
# RustCrypto opens the Recipient envelope (CMS, RFC 5652).
base64 = { version = "0.23", optional = true }
serde_json = { version = "1", optional = true }
aws-sdk-kms = { version = "1.121", default-features = false, features = ["rt-tokio", "behavior-version-latest"], optional = true }
aws-credential-types = { version = "1.3", optional = true }
aws-smithy-http-client = { version = "1.4", default-features = false, features = ["rustls-aws-lc"], optional = true }
aws-smithy-types = { version = "1.8", optional = true }
aws-smithy-runtime-api = { version = "1.18", optional = true }
aws-smithy-async = { version = "1.3", features = ["rt-tokio"], optional = true }
cms = { version = "0.2", optional = true }
rsa = { version = "0.9", features = ["sha2", "getrandom"], optional = true }
aes = { version = "0.9", optional = true }
cbc = { version = "0.2", features = ["alloc"], optional = true }

alloy = { version = "2.1.0", default-features = false, features = ["provider-http", "rpc-types-eth", "reqwest-rustls-tls"], optional = true }
tokio = { version = "1.52.3", default-features = false, features = ["rt", "rt-multi-thread", "time"], optional = true }
# Check the launch endpoints: host names and the EVM RPC CA. Both crates are
# already in the lock under reqwest.
rustls-pki-types = { version = "1.15", optional = true }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
vsock = "0.5"
nix = { version = "0.31.2", features = ["socket", "time"] }
aws-nitro-enclaves-nsm-api = "0.5"

[features]
# A plain `cargo build` is the Concordium-only dev build. RGB needs a signer
# role. Production images are the mint and burn signers below, with `vsock`.
#
# Single-network EIFs, one flow each:
#   RGB mint:         `--no-default-features --features vsock,spv,mint-signer`
#   RGB burn:         `--no-default-features --features vsock,spv,burn-signer`
#   Concordium:       `--no-default-features --features vsock,ccd` (CCD -> EVM
#                     release and SignCcd; a release build refuses EVM signing
#                     until EVM_CHAIN_ID and the proxy address are pinned).
# CI builds all of them. A `compile_error!` in lib.rs requires exactly one
# signer role whenever `rgb-validation` is on. Another refuses `ccd` with a
# signer role in a release build.
default = ["ccd"]

# Network selection gates only request handling (dispatch arms, validators,
# SPV). Key derivation and the attestation pubkey bundle are the same in every
# build, so the parent verifier does not change.
#
# A signer role turns on the RGB/BTC bridge stack (`rgb-validation`). `spv` adds
# the SPV header chain to it. Only a debug build, such as the dev image, can
# enable `ccd` together with a signer role.
#
# `ccd` = the Concordium bridge stack. No extra deps: ed25519 is always on to
# keep key derivation and the attestation bundle the same in every build.
ccd = []

# Seed custody is a separate capability, enabled only by the mint signer.
kms-persistence = [
    "dep:base64",
    "dep:serde_json",
    "nix/poll",
    "dep:tokio",
    "dep:aws-sdk-kms",
    "dep:aws-credential-types",
    "dep:aws-smithy-http-client",
    "dep:aws-smithy-types",
    "dep:aws-smithy-runtime-api",
    "dep:aws-smithy-async",
    "dep:cms",
    "dep:rsa",
    "dep:aes",
    "dep:cbc",
]

vsock = []
# DANGER: allows importing a raw seed over the wire. Testing only.
allow-seed-import = []
# The RGB bridge stack that a signer role turns on. In the enclave it validates
# RGB consignments with rgbstd and binds BFA mints to EVM locks. BFA is the only
# schema the enclave admits. Each BFA `mint` leaves an EVM lock claim that RGB
# consensus cannot finalize alone.
#
# The enclave reads `FundsIn` logs with its own alloy JSON-RPC client. It fails
# closed on a missing or invalid receipt, or an unsafe/noncanonical block. TLS to
# the pinned RPC host and CA ends inside the enclave. The host relays only
# ciphertext through the vsock forwarder.
#
# Without `spv`, only public-signet mint/burn builds are allowed
# (lib.rs/policy.rs); Bitcoin confirmations are trusted from the TLS indexer.
rgb-validation = ["rgb-ops", "rgb-lib", "rgb-schemas", "rgb-invoicing", "rgb-consensus", "rgb-aluvm", "dep:amplify", "dep:alloy", "dep:tokio", "dep:rustls-pki-types", "dep:webpki"]
# Bitcoin SPV verification of consignment witness txids before EVM signing.
# Implies `rgb-validation`: SPV reads the witness txids from the consignment.
# Only a public-signet image can omit it (`build/build-enclave.sh`).
# Builds without RGB validation refuse RGB sources; CCD release signing
# still requires EVM domain pins (networks/evm/validation.rs).
spv = ["rgb-validation"]
# Mock attestation: skip NSM / COSE / cert-chain checks and use raw CBOR docs.
# Testing only. Never enable in production builds.
mock-attestation = ["attestation-verify/mock"]
# Accept all-zero peer PCRs for debug clone tests. A release build refuses it.
# Never enable in production builds. Does not compile in a release build.
allow-debug-pcrs = ["attestation-verify/allow-debug-pcrs"]

# Mint/burn signer role. EXACTLY ONE is required when `rgb-validation` is on
# (lib.rs `compile_error!`). Each role ships as its own image with its own PCR0
# and seed. A mint signer has no release rule; a burn signer has no mint rule.
# The role is attested (`SignerRole`).
#
# Both need `rgb-validation`: a burn consignment carries mint ancestry.
# `build.rs` turns the role into the `evm_to_rgb` / `rgb_to_evm` cfgs.
#
# `mint-signer` = EVM -> RGB: co-signs the RGB mint PSBT (and create_utxo). It
# reads each mint and refill from its fascia, so it needs `strict_encoding`.
mint-signer = ["rgb-validation", "kms-persistence", "dep:strict_encoding"]
# `burn-signer` = RGB -> EVM: signs the `fundsOut` release (and its gas tx).
burn-signer = ["rgb-validation"]

[dev-dependencies]
rand = "0.10.0"
# Canned KMS HTTP exchanges for the `kms` unit tests.
aws-smithy-http-client = { version = "1.4", default-features = false, features = ["rustls-aws-lc", "test-util"] }
http = "1"
# The in-test TLS server of `tests/test_evm_rpc_tls.rs`. Already in the lock.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
# Reads the shared vectors `docs/burn-destination-vectors.json`. Already in the lock.
serde_json = "1"
# The in-process BFA consignment generator (`src/test_support/bfa_consignment.rs`)
# builds strict types. Already in the lock.
strict_encoding = { package = "rgb-strict-encoding", version = "=1.0.5" }
# The generator commits its PSBTs with psbtu's `rgb_commit` and strips their
# RGB keys, as rgb-lib does.
rgb-psbt-utils = { version = "=0.11.2-rc.1", default-features = false }
# The parser the bridge and fsn read burns with. The parity tests compare the
# enclave's summary with it.
rgb-consignment = { git = "https://github.com/UTEXO-Protocol/consignment-utils.git", rev = "5a4a3df812deb6b8c06028950132f8496d450f49", default-features = false }
