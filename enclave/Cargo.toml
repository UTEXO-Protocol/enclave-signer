[package]
name = "utexo-bridge-enclave"
version = "0.1.0"
edition = "2021"

[lib]
name = "utexo_bridge_enclave"
path = "src/lib.rs"

[[bin]]
name = "utexo-bridge-enclave"
path = "src/main.rs"

[dependencies]
# Protobuf
prost = "0.14.3"

# Crypto — ECDSA on secp256k1 (EVM address derivation + signing later)
k256 = { version = "0.13", features = ["ecdsa"] }

# Crypto — BTC (BIP-32 HD derivation, xpub serialization, SegWit later)
bitcoin = { version = "0.32", features = ["std"] }

# Crypto — BIP-39 mnemonic
bip39 = { version = "2.1", features = ["zeroize"] }

# Secret handling (zeroize-on-drop, redacted Debug)
secrecy = "0.10"
zeroize = { version = "1.8", features = ["derive"] }

# Hashing
sha3 = "0.10"

# Entropy
getrandom = "0.4.2"

# Error handling
thiserror = "2"

# Encoding
hex = "0.4"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# RGB consignment validation (optional, behind rgb-validation feature)
rgb-ops = { version = "0.11.1-rc.7", features = ["esplora_blocking"], optional = true }

# Attestation verification (NSM COSE_Sign1 + AWS Nitro cert chain)
ciborium = "0.2"
p384 = { version = "0.13", features = ["ecdsa", "pem"] }
x509-cert = { version = "0.2", features = ["pem", "builder"] }
der = { version = "0.7", features = ["alloc"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }

# Cloning handshake crypto (X25519 DH + HKDF + ChaCha20Poly1305 + HMAC-SHA256)
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
rand_core = { version = "0.6", features = ["getrandom"] }

[target.'cfg(target_os = "linux")'.dependencies]
vsock = "0.5"
nix = { version = "0.31.2", features = ["socket"] }
aws-nitro-enclaves-nsm-api = "0.4"

[build-dependencies]
prost-build = "0.14.3"

[features]
default = []
vsock = []
# DANGER: allows importing a raw seed over the wire. Testing only.
allow-seed-import = []
# Skips cross-check validation on signing requests. Development/testing only.
dev-mode = []
# In-enclave RGB consignment validation via rgbstd + Esplora.
rgb-validation = ["rgb-ops"]
# Bitcoin SPV verification of consignment witness txids before signing EVM
# transactions. Implies `rgb-validation` because SPV needs the consignment
# parsed to extract witness txids. When the feature is OFF, handle_sign_evm
# additionally REJECTS any request that carries non-empty merkle_proofs —
# fail-closed against build mismatches between listener and enclave.
spv = ["rgb-validation"]
# Mock attestation path: skip NSM / COSE / cert-chain checks and use raw CBOR docs.
# Testing only — never enable in production builds.
mock-attestation = []

[dev-dependencies]
rand = "0.10.0"
