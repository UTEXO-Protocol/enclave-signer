# Enclave workspace: every crate measured into the EIF, plus the attestation
# verifier it shares with the parent.
#
# `parent/` is a separate workspace. Cargo resolves every git source of a
# workspace, also for a `-p` build. As a member, the private parent proto dep
# needs credentials for every enclave build, which defeats the vendored
# `enclave-proto/`. Keep `parent` out of `members`.
[workspace]
members = [
    "attestation-verify",
    "enclave",
    "enclave-proto",
]
exclude = ["parent"]
resolver = "2"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1

# rgb-lib 5010eefa's root [patch.crates-io]: a dependency's patch does not apply.
# parent/Cargo.toml carries a copy; build/tests/test_private_deps.py checks they match.
[patch.crates-io]
rgb-aluvm = { git = "https://github.com/rgb-protocol/rgb-aluvm", rev = "eb956ccaadf64930990e2ed08f6c4232caee24f9" }
rgb-ascii-armor = { git = "https://github.com/rgb-protocol/rgb-ascii-armor", rev = "40cdea632fd6d0527494893e83b99cea60ace310" }
rgb-consensus = { git = "https://github.com/rgb-protocol/rgb-consensus", rev = "d4bbbce212e4d9967e10cc3c6a7db2f664d52bd2" }
rgb-invoicing = { git = "https://github.com/rgb-protocol/rgb-ops", rev = "00f8d62e6107767cca085d9f9b3183c35ad6d71f" }
rgb-ops = { git = "https://github.com/rgb-protocol/rgb-ops", rev = "00f8d62e6107767cca085d9f9b3183c35ad6d71f" }
rgb-psbt-utils = { git = "https://github.com/rgb-protocol/rgb-api", rev = "4922e50734ab456d086546ab2befd5fa0aec99cc" }
rgb-schemas = { git = "https://github.com/rgb-protocol/rgb-schemas", rev = "b3f88f28c83aa8c73cf9ed2bb40ad6890142d675" }
rgb-strict-encoding = { git = "https://github.com/rgb-protocol/rgb-strict-encoding", rev = "e12b9944b30171950de03778d6666b24bc33d994" }
rgb-strict-encoding-derive = { git = "https://github.com/rgb-protocol/rgb-strict-encoding", rev = "e12b9944b30171950de03778d6666b24bc33d994" }
