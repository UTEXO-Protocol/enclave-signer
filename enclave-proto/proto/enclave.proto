// Parent Adapter -> Nitro Enclave internal wire protocol.
//
// This is not a gRPC service. The parent writes one length-prefixed
// EnclaveRequest over TCP/vsock and reads one EnclaveResponse.
syntax = "proto3";

package enclave;

option go_package = "github.com/UTEXO-Protocol/federated-signer-proto/go-gen/enclave;enclavepb";

message EnclaveRequest {
  reserved 4, 6, 15;
  reserved "proxy_federation", "sign_ccd";

  oneof request {
    InitializeKeyRequest initialize_key = 1;
    GetPublicKeyRequest get_public_key = 2;
    SignRequest sign = 3;
    SignRawMessageRequest sign_raw_message = 5;
    InitiateCloningRequest initiate_cloning = 7;
    GetCloneRequest get_clone = 8;
    SetCloneRequest set_clone = 9;
    SignRawDigestRequest sign_raw_digest = 10;
    SubmitHeadersRequest submit_headers = 11;
    GetLastSavedBlockRequest get_last_saved_block = 12;
    GetAttestedPublicKeyRequest get_attested_public_key = 13;
    SignBtcRequest sign_btc = 14;
    HealthRequest health = 16;
    SetEndpointsRequest set_endpoints = 17;
    SignRightsRefillRequest sign_rights_refill = 18;
    SetLimitsRequest set_limits = 19;
    GetLimitsRequest get_limits = 20;
  }
}

message EnclaveResponse {
  reserved 6, 14;
  reserved "federation_sig", "ccd_signature";

  oneof response {
    InitializeKeyResponse initialize_key = 1;
    PublicKeysResponse public_keys = 2;
    EvmSignatureResponse evm_signature = 3;
    SignedPsbtResponse signed_psbt = 4;
    RawSignatureResponse raw_signature = 5;
    InitiateCloningResponse initiate_cloning = 7;
    GetCloneResponse get_clone = 8;
    SetCloneResponse set_clone = 9;
    RawDigestSignatureResponse raw_digest_sig = 10;
    SubmitHeadersResponse submit_headers = 11;
    GetLastSavedBlockResponse get_last_saved_block = 12;
    GetAttestedPublicKeyResponse get_attested_public_key = 13;
    ErrorResponse error = 15;
    HealthResponse health = 16;
    SetEndpointsResponse set_endpoints = 17;
    LimitsResponse limits = 18;
  }
}

message InitializeKeyRequest {
  // Both empty: a KMS build (the mint signer) loads or creates its seed through KMS; other builds
  // generate a new mnemonic from enclave entropy. Non-empty = import a raw 64-byte seed (`allow-seed-import`, testing only).
  bytes seed = 1;
  // BIP-39 mnemonic phrase (requires `allow-seed-import` feature, testing only).
  // If non-empty, takes precedence over seed.
  string mnemonic = 2;
  // Donor-side cloning secret, delivered at runtime (not in the EIF, so it stays
  // out of the PCRs). Set it only on an enclave that serves GetClone. Empty keeps
  // any secret loaded at boot. A KMS build refuses a non-empty value.
  string cloning_secret = 3;
}

message InitializeKeyResponse {
  // 2, 3 and 13 are reserved. Do not use them.
  reserved 2, 3, 13;
  reserved "btc_compressed_pub", "btc_xpub", "ccd_ed25519_pub";

  bytes evm_address = 1; // 20 bytes: keccak256(uncompressed_pubkey[1..])[12..].
  bytes master_fingerprint = 4; // 4-byte BIP-32 master key fingerprint.
  string account_xpub_vanilla = 5; // BIP-86 account xpub: m/86'/<coin>'/0'.
  string account_xpub_colored = 6; // RGB BIP-86 account xpub: m/86'/827166'/0' on mainnet, m/86'/827167'/0' on other networks.
  bytes evm_uncompressed_pub = 7; // 64-byte secp256k1 X || Y, without 0x04 prefix.
  uint64 chain_id = 8; // EVM chain ID pinned at enclave boot.
  bytes bridge_contract = 9; // 20-byte MultisigProxy address (the EIP-712 verifying contract) pinned at enclave boot.
  string rgb_asset_id = 10; // RGB asset identifier pinned at enclave boot.
  bytes evm_gas_tx_uncompressed_pub = 11; // 64-byte gas transaction public key.
  bytes evm_gas_tx_address = 12; // 20-byte Ethereum address of the gas transaction key.
}

message GetPublicKeyRequest {
  // Empty request returns the full public-key bundle.
}

message PublicKeysResponse {
  // 2, 3 and 13 are reserved. Do not use them.
  reserved 2, 3, 13;
  reserved "btc_compressed_pub", "btc_xpub", "ccd_ed25519_pub";

  bytes evm_address = 1; // 20-byte Ethereum address of the primary signing key.
  bytes master_fingerprint = 4; // 4-byte BIP-32 master key fingerprint.
  string account_xpub_vanilla = 5; // BIP-86 account xpub: m/86'/<coin>'/0'.
  string account_xpub_colored = 6; // RGB BIP-86 account xpub: m/86'/827166'/0' on mainnet, m/86'/827167'/0' on other networks.
  bytes evm_uncompressed_pub = 7; // 64-byte secp256k1 X || Y, without 0x04 prefix.
  uint64 chain_id = 8; // EVM chain ID pinned at enclave boot.
  bytes bridge_contract = 9; // 20-byte MultisigProxy address (the EIP-712 verifying contract) pinned at enclave boot.
  string rgb_asset_id = 10; // RGB asset identifier pinned at enclave boot.
  bytes evm_gas_tx_uncompressed_pub = 11; // 64-byte gas transaction public key.
  bytes evm_gas_tx_address = 12; // 20-byte Ethereum address of the gas transaction key.
}

message GetAttestedPublicKeyRequest {
  bytes nonce = 1; // Fresh 32-byte nonce embedded in the attestation document.
}

message GetAttestedPublicKeyResponse {
  PublicKeysResponse public_keys = 1; // Public-key bundle bound by the attestation. Unset until the keys exist.
  bytes attestation_doc = 2; // COSE_Sign1 NSM document, or raw CBOR in mock mode. No public key until the keys exist.
  bytes attested_policy = 3; // Policy bytes that attestation user_data commits, with the key bundle once the keys exist.
}

message SignRequest {
  // 6 is reserved. Do not use it.
  reserved 6;
  reserved "ccd_source";

  uint64 amount = 1;

  oneof source_network {
    EvmSource evm_source = 2;
    RgbSource rgb_source = 3;
  }

  oneof destination_network {
    EvmDestination evm_destination = 4;
    RgbDestination rgb_destination = 5;
  }
}

message EvmSource {
  bytes tx_hash = 1; // 32-byte source EVM transaction hash.
  bool event_valid = 2; // Listener result. The enclave ignores it and reads the deposit log itself.
  bool event_finalized = 3; // Listener result. The enclave ignores it and applies its own finality rule.
  bytes token = 4; // 20-byte ERC-20 address; empty for native currency. The enclave does not read it.
  bytes recipient = 5; // 20-byte recipient address. The enclave does not read it.
  uint64 commission = 6; // Commission reported by the source event. It must equal the deposit's tokenCommission.
  // On-chain BridgeFundsIn.operationId of the source deposit, exactly 32 bytes.
  // Required: the enclave binds the FundsIn log to it and refuses to sign
  // without it. Not RgbDestination.operation_idx, which is a different id-space.
  bytes funds_in_operation_id = 7;
}

message RgbSource {
  bool consignment_valid = 1; // Listener result. The enclave ignores it and validates the consignment itself.
  string asset_id = 3; // RGB asset identifier derived from the consignment.
  bytes consignment = 4; // Raw RGB consignment bytes.
  bytes consignment_hash = 5; // keccak256(consignment).
  repeated MerkleProofEntry merkle_proofs = 6; // SPV proofs for witness transactions.
  uint64 commission = 7; // Commission reported by the source event. The enclave does not use it.
  // 8 is reserved. Do not use it.
  reserved 8;
  reserved "mint_ancestors";
}

message EvmDestination {
  bytes call_data = 1; // Raw ABI-encoded EVM function call.
  uint64 nonce = 2; // Sequential MultisigProxy nonce.
  uint64 deadline = 3; // Unix timestamp after which the signature is invalid.
  uint64 chain_id = 4; // EVM chain ID used by the EIP-712 domain.
  bytes proxy_contract = 5; // 20-byte EIP-712 verifying contract address.
  uint64 calldata_amount = 6; // Amount pre-extracted from call_data.
  uint64 calldata_commission = 7; // Commission pre-extracted from call_data. The enclave does not read it.
  // lz_release, if set, signals that this is an lzFundsOutCall release and
  // carries the LZ-specific fields for TeeLzFundsOut digest derivation and
  // crosscheck. Absent for direct fundsOutCall releases.
  optional LzReleaseParams lz_release = 8;
  // burn_destination is the preimage of the hash in the burn's burnReason
  // global (GS_BURN_REASON). Required for a V1+ burn. Absent for a V0 burn,
  // whose burnReason holds the EVM address itself. Transport only: the enclave
  // hashes the typed fields, never these protobuf bytes.
  optional BurnDestination burn_destination = 9;
}

// BurnDestination carries the fields of a versioned burn destination record.
// The hash rules per version are in enclave-signer docs/burn-destination.md.
// A new version adds new fields; existing field numbers never change.
message BurnDestination {
  // version selects the record type. 1 = UtexoBurnDestinationV1.
  uint32 version = 1;
  // destination_chain_id is the Bridge route chain id (fundsOut destinationChainId).
  uint64 destination_chain_id = 2;
  // dst_eid is the LayerZero endpoint id. 0 means a direct fundsOut.
  uint32 dst_eid = 3;
  // recipient is the chain-native payee address: 20 bytes for a direct fundsOut, 1 to 32 bytes for LayerZero.
  bytes recipient = 4;
}

// LzReleaseParams carries the LayerZero-specific crosscheck fields for an
// lzFundsOutCall release. Absent means a direct fundsOutCall release.
message LzReleaseParams {
  // dst_eid is the LayerZero endpoint ID of the destination chain
  // (e.g. ETH mainnet = 30101, ETH Sepolia = 40161).
  uint32 dst_eid = 1;
  // min_amount_ld is the minimum acceptable amount after LZ slippage.
  uint64 min_amount_ld = 2;
  // recipient is the 32-byte padded destination address on the target chain.
  bytes recipient = 3;
}

message RgbDestination {
  uint64 operation_idx = 1; // Destination operation index. The enclave does not read it.
  bytes psbt_bytes = 2; // Serialized PSBT to sign.
  uint64 psbt_output_amount = 3; // Total non-change output amount. The enclave does not read it: the fascia gives the amount.
  string asset_id = 4; // RGB asset identifier associated with the transfer.
  bytes consignment = 5; // Raw destination RGB consignment bytes. The enclave does not read it.
  bytes consignment_hash = 6; // keccak256(consignment). The enclave does not read it.
  // 7 is reserved. Do not use it.
  reserved 7;
  reserved "mint_ancestors";
  // 8 is reserved. Do not use it.
  reserved 8;
  reserved "parent_psbt";
  // Strict-encoded rgb-lib fascia of psbt_bytes' tx: its bundles and MPC merkle block with the entropy.
  bytes fascia = 9;
  // Strict-encoded rgb-lib fascia of the tx that created the spent right; it pins that UTXO.
  bytes parent_fascia = 10;
}

message MerkleProofEntry {
  bytes txid = 1; // 32-byte transaction ID in display byte order.
  uint32 block_height = 2; // Height of the block containing the transaction.
  uint32 tx_position = 3; // Transaction position in the block.
  repeated bytes merkle_path = 4; // 32-byte sibling hashes from leaf to Merkle root, in display byte order.
}

message EvmSignatureResponse {
  // 65-byte signature: r (32) || s (32) || v (1). v is the raw recovery id,
  // 0 or 1, not 27 or 28.
  bytes signature = 1;
  // The request's call_data, unchanged. The enclave validates it as canonical
  // ABI and signs the EIP-712 digest built from the validated fields: TeeFundsOut
  // on the direct route, TeeLzFundsOut when lz_release is set. It never rewrites
  // the calldata or signs its keccak256. The caller submits it with the signature.
  bytes call_data = 2;
}

message SignedPsbtResponse {
  bytes signed_psbt = 1; // Serialized PSBT with enclave partial signatures.
  uint32 inputs_signed = 2; // Number of inputs signed by the enclave.
}

// Plain-BTC PSBT signing (create_utxo / plain withdrawals). Only the mint signer
// signs it. Unlike SignRequest, it carries no RGB consignment and no EVM
// correlation. The enclave authorises it from the PSBT, never from a listener
// flag. It derives which outputs pay back to scripts it co-controls; the rest
// must fit the BTC_MAX_UNOWNED_SATS budget. Total input value must fit the
// BTC_MAX_TOTAL_SATS cap, and the fee must pass the fee policy. A production build
// requires the cap. It signs only vanilla BIP-86 inputs, never a colored
// (RGB-allocated) one. Response is a SignedPsbtResponse.
message SignBtcRequest {
  bytes psbt_bytes = 1; // Raw PSBT to sign (plain BTC; no consignment).
}

// BFA mint wallet rights refill (data_type RGB_RIGHTS_REFILL): one mintRight in,
// MIN_REFILL_RIGHTS to MAX_REFILL_RIGHTS mintRights out to the enclave's own revealed
// outputs, no tokens. It has no source and no EVM deposit, so only the mint signer
// handles it, by shape alone, from its fascia. Response is a SignedPsbtResponse.
message SignRightsRefillRequest {
  reserved 2, 3;
  reserved "consignment", "consignment_hash";
  bytes psbt_bytes = 1;
  string asset_id = 4;
  // 5 is reserved. Do not use it.
  reserved 5;
  reserved "parent_psbt";
  // Strict-encoded rgb-lib fascia of psbt_bytes' tx: its bundles and MPC merkle block with the entropy.
  bytes fascia = 6;
  // Strict-encoded rgb-lib fascia of the tx that created the spent right; it pins that UTXO.
  bytes parent_fascia = 7;
}

message SignRawMessageRequest {
  bytes message = 1; // The enclave refuses this request in every build. It signs no raw message.
}

message RawSignatureResponse {
  bytes signature = 1; // Never sent: the enclave refuses SignRawMessage.
}

message SignRawDigestRequest {
  bytes digest = 1; // Optional; if set must equal keccak256(unsigned_tx), the hash the enclave signs. Only the burn signer answers this request.
  bytes unsigned_tx = 2; // Unsigned gas-tx preimage (EIP-1559 / legacy EIP-155). Required: the enclave checks its shape against the gas-tx allowlist.
}

message RawDigestSignatureResponse {
  bytes signature = 1; // 65-byte signature produced by the gas transaction key.
}

message InitiateCloningRequest {
  string cloning_secret = 1; // Pre-shared operator secret, never sent to the donor. A KMS build refuses cloning.
  bytes cluster_public_key = 2; // 20-byte EVM address of the intended donor.
}

message InitiateCloningResponse {
  bytes requester_attestation = 1; // NSM document binding the encryption key and digest.
  bytes encryption_pubkey = 2; // 32-byte requester X25519 public key.
  bytes cloning_digest = 3; // 32-byte HMAC-SHA256 over the encryption public key.
}

message GetCloneRequest {
  bytes cluster_public_key = 1; // 20-byte EVM address that must match the donor.
  bytes cloning_digest = 2; // 32-byte digest verified with the cloning secret.
  bytes encryption_pubkey = 3; // 32-byte requester X25519 public key.
  bytes requester_attestation = 4; // NSM document binding requester key and digest.
}

message GetCloneResponse {
  bytes encrypted_seed = 1; // Seed encrypted using X25519, HKDF, and ChaCha20Poly1305.
  bytes donor_pubkey = 2; // 32-byte donor ephemeral X25519 public key.
  bytes donor_attestation = 3; // NSM document binding the donor public key.
}

message SetCloneRequest {
  bytes encrypted_seed = 1; // Encrypted 64-byte seed returned by the donor.
  bytes donor_pubkey = 2; // 32-byte donor ephemeral X25519 public key.
  bytes donor_attestation = 3; // NSM document binding the donor public key.
}

message SetCloneResponse {}

// Bitcoin header synchronization for in-enclave SPV validation. A build without SPV refuses it.

message SubmitHeadersRequest {
  // Raw 80-byte Bitcoin headers, contiguous, in ascending height order. All or nothing.
  // The parent's header sync sends them. Limits: max_headers_per_submit, max_headers_per_minute.
  repeated bytes headers = 1;
  // Block height of headers[0]: above the checkpoint and at most the tip + 1. The
  // tip + 1 extends the chain. A lower start replaces at most MAX_REORG_DEPTH
  // headers, and only with more work. An empty batch changes nothing.
  uint32 start_height = 2;
}

message SubmitHeadersResponse {
  uint32 last_block_height = 1; // Height of the enclave's tip after this batch.
  bytes last_block_hash = 2; // 32-byte hash of that tip, in internal byte order.
  uint32 headers_accepted = 3; // The batch length: a batch is all or nothing.
}

message GetLastSavedBlockRequest {}

message GetLastSavedBlockResponse {
  uint32 block_height = 1; // Height of the latest accepted header, or the checkpoint before any.
  bytes block_hash = 2; // 32-byte hash of that header or checkpoint, in internal byte order.
}

// Readiness probe: answers whether the enclave is ready to sign. Deploy
// orchestration polls it. Internal only: never expose outside the host.

message HealthRequest {}

message HealthResponse {
  // endpoints_set && key_loaded, and on the burn signer also spv_synced. The
  // only field a caller needs; the rest are diagnostics for logs.
  bool ready = 1;
  // Signing key present, i.e. the phase state machine reached "active".
  bool key_loaded = 2;
  // The header chain passes the checks signing applies: a fresh tip and enough
  // blocks above the checkpoint. A build without SPV reports true.
  bool spv_synced = 3;
  // Phase name: "initial", "cloning" or "active". A KMS build has "initializing" in place of "cloning".
  string phase = 4;
  // Height of the latest accepted header, or the compiled-in checkpoint height
  // before any. A build without SPV reports 0 in this and the other spv_ numbers.
  uint32 spv_tip_height = 5;
  // Block timestamp of that header.
  uint32 spv_tip_time = 6;
  // Enclave wall clock minus spv_tip_time, clamped at 0. Shows how far behind
  // the chain still is.
  uint32 spv_tip_age_secs = 7;
  // Max age spv_tip_age_secs is compared against.
  uint32 spv_max_tip_age_secs = 8;
  // The endpoints from SetEndpoints are in force.
  bool endpoints_set = 9;
}

// The time, memory and size limits. The operator can change them at run time,
// and a change needs no new image. Each limit only sets when the enclave refuses
// a request or how long it waits. The attestation does not cover these values.
// enclave-signer docs/runtime-limits.md has the rules.
message Limits {
  // 26 and 27 are reserved. Do not use them.
  reserved 26, 27;
  reserved "mint_reply_ttl_secs", "mint_reply_max_entries";

  uint64 total_request_timeout_secs = 1;
  uint64 io_idle_timeout_secs = 2;
  uint64 first_bytes_timeout_secs = 3;
  uint64 electrum_timeout_secs = 4;
  uint64 esplora_timeout_secs = 5;
  uint64 max_rgb_lib_ms = 6;
  uint64 max_witness_check_cost = 7;
  uint64 max_bundle_id_cost = 8;
  uint64 max_reject_walk_cost = 9;
  uint64 max_message_bytes = 10;
  uint64 max_wire_elements = 11;
  uint64 max_consignment_bytes = 12;
  uint64 max_merkle_proofs = 13;
  uint64 max_total_proof_bytes = 14;
  uint64 max_psbt_bytes = 15;
  uint64 max_gas_tx_bytes = 16;
  uint64 max_rlp_items = 17;
  uint64 max_funds_out_call_data_bytes = 18;
  uint64 max_headers_per_submit = 19;
  uint64 max_headers_per_minute = 20;
  uint64 evm_rpc_timeout_secs = 21;
  uint64 max_reject_list_entries = 22;
  uint64 reject_list_page_entries = 23;
  uint64 mint_replay_ttl_secs = 24;
  uint64 mint_replay_max_entries = 25;
  uint64 mint_max_inputs = 28;
  uint64 mint_max_outputs = 29;
}

// Changes limits. The enclave checks all the values first, so a refused request
// changes nothing. The values stay until the enclave restarts.
message SetLimitsRequest {
  // The new values. 0 keeps the value of that limit.
  Limits values = 1;
  // Go back to the image values first, then apply `values`.
  bool reset = 2;
}

message GetLimitsRequest {}

message LimitsResponse {
  Limits current = 1; // The values in force.
  Limits image = 2; // The values of the image, which a reset restores.
}

// The chain endpoints the enclave reads from. The operator sets them once,
// after launch. The enclave refuses a second set. Until the set, the enclave
// signs nothing and opens no chain connection. A build that does not use a
// value requires it empty.
message SetEndpointsRequest {
  string electrum_url = 1; // ssl://host:port (Electrum) or https://host[:port] (Esplora). A release image refuses tcp:// and http://.
  string evm_rpc_host = 2; // TLS name of the EVM RPC. No scheme, path or port.
  bytes evm_rpc_ca_der = 3; // DER of the only CA the EVM RPC TLS trusts.
  uint32 evm_rpc_tls_port = 4; // TLS port of the EVM RPC, 1-65535.
  string kms_key_arn = 5; // Full ARN of the KMS key that wraps the seed.
  string kms_region = 6; // AWS region of the KMS key.
  string kms_seed_id = 7; // Name of the seed object the parent stores.
  string kms_expected_evm_address = 8; // 20-byte hex EVM address the seed must give. Empty: create a seed; a saved one is refused.
  // Absolute ASCII path, e.g. /v3/<API_KEY>. Empty means /. Only letters, digits and /-._~: no authority,
  // query, fragment, escape or dot segment. May contain credentials: it is not logged or attested.
  string evm_rpc_path = 9;
}

message SetEndpointsResponse {}

message ErrorResponse {
  uint32 code = 1; // Stable enclave error category.
  string message = 2; // Human-readable error description.
}
