name: Set up the Rust build
description: Install Rust 1.96.1, the system packages, the private dependency access and the cargo cache.

inputs:
  components:
    description: Extra toolchain components, comma separated.
    default: ""
  cache-name:
    description: Name part of the cargo cache key.
    default: ci
  federated-signer-proto-deploy-key:
    description: Deploy key of the private proto repo. Empty skips the SSH alias.
    default: ""

runs:
  using: composite
  steps:
    - name: Install Rust 1.96.1
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: "1.96.1"
        components: ${{ inputs.components }}

    - name: Install system dependencies
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

    # The parent's private proto dep uses the SSH Host alias
    # github-federated-signer. The alias maps to github.com with IdentityFile
    # + IdentitiesOnly yes, so SSH offers exactly ONE key per connection.
    - name: Set up SSH for private deps
      if: inputs.federated-signer-proto-deploy-key != ''
      shell: bash
      env:
        FEDERATED_SIGNER_PROTO_DEPLOY_KEY: ${{ inputs.federated-signer-proto-deploy-key }}
      run: |
        mkdir -p ~/.ssh && chmod 700 ~/.ssh
        ssh-keyscan -H github.com >> ~/.ssh/known_hosts
        printf '%s\n' "$FEDERATED_SIGNER_PROTO_DEPLOY_KEY" > ~/.ssh/key_federated
        chmod 600 ~/.ssh/key_*
        cat >> ~/.ssh/config << 'SSHCONF'
        Host github-federated-signer
          HostName github.com
          User git
          IdentityFile ~/.ssh/key_federated
          IdentitiesOnly yes
        SSHCONF
        chmod 600 ~/.ssh/config

    # Fork PRs can restore this public repo's caches. Per-repo paths, since tar
    # would pack an excluded subdirectory of a listed one. No target dirs: the
    # parent's holds the compiled private proto crate.
    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git/*/*
        key: ${{ runner.os }}-cargo-${{ inputs.cache-name }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: ${{ runner.os }}-cargo-${{ inputs.cache-name }}-
