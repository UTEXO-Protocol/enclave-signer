# Manual cold deployment: preflight all hosts, then apply only when requested.
# Burn keys are volatile. Mint recovery requires KMS/S3 and an approved address pin.
# Host configuration must already be installed under DEPLOY_CONFIG_DIR.
name: "Release EIF (deploy)"

on:
  workflow_dispatch:
    inputs:
      git_sha:
        description: "40-hex reviewed commit already built and published to S3"
        type: string
        required: true
      instances:
        description: "EC2 IDs for preflight; apply requires exactly one (blank = secrets.STAGE_INSTANCE_IDS)"
        type: string
        required: false
        default: ""
      apply:
        description: "Cold restart after preflight; destroys volatile Burn identities"
        type: boolean
        required: true
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: stage-tee-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: stage
    steps:
      - name: Validate release SHA
        env:
          GIT_SHA: ${{ inputs.git_sha }}
        run: |
          [[ "$GIT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid release SHA'; exit 1; }

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_sha }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Preflight and optional cold deployment
        env:
          GIT_SHA: ${{ inputs.git_sha }}
          BUCKET: ${{ vars.EIF_S3_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          CLUSTER_DIR: ${{ vars.CLUSTER_DIR }}
          DEPLOY_CONFIG_DIR: ${{ vars.DEPLOY_CONFIG_DIR || '/etc/utexo/deploy-config' }}
          INSTANCES_INPUT: ${{ inputs.instances }}
          INSTANCES_SECRET: ${{ secrets.STAGE_INSTANCE_IDS }}
          APPLY: ${{ inputs.apply }}
        run: python3 deploy/release_ssm.py

      - name: Summary
        if: always()
        env:
          GIT_SHA: ${{ inputs.git_sha }}
          APPLY: ${{ inputs.apply }}
        run: |
          {
            echo '### TEE release'
            printf -- '- Commit: `%s`\n- Apply requested: `%s`\n' "$GIT_SHA" "$APPLY"
            echo '- Review the job result. Process startup does not approve signing identities.'
            echo '- After apply: initialize/recover, verify readiness and the complete approved identity map before routing.'
          } >> "$GITHUB_STEP_SUMMARY"
