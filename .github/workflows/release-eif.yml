# Release (deploy) a published EIF to the stage hosts — self-contained, no external repo.
#
# Pairs with build-eif.yml:
#   build-eif   -> builds the release EIF + parent/cli, publishes to s3://<bucket>/eif/<git_sha>/
#   release-eif -> runs deploy/deploy-host.sh on the target hosts via SSM for that <git_sha>
#
# Artifact-only: hosts pull the matching set from S3, verify sha256 + PCR0, and bring the
# cluster up under systemd (reboot-safe). The deploy script is the executable core; this
# workflow only selects the git_sha + hosts and ships the script over SSM.
#
# !!! IMPORTANT — this RESTARTS the enclaves, which WIPES in-memory identity. A redeployed
# burn enclave comes up EMPTY ("key not initialized"); re-run init/clone afterwards. A mint
# enclave recovers its seed from KMS only with the KMS values and the expected address pin at
# launch. For mint, deployment_config selects the approved per-CID host JSON (KMS + S3);
# mint_mode defaults to recovery. Provision prerequisites in docs/mint-release.md first.
# Do NOT point this at a cluster holding live
# keys without planning the re-bootstrap. That's why it is manual (workflow_dispatch) + environment-gated,
# never auto-triggered on every build.
#
# Required repo config:
#   vars:    AWS_REGION, EIF_S3_BUCKET, CLUSTER_DIR
#   secrets: AWS_DEPLOY_OIDC_ROLE_ARN  (role with ssm:SendCommand + ssm:GetCommandInvocation
#                                       on the target instances; SEPARATE from the build role)
#            STAGE_INSTANCE_IDS        (space-separated EC2 instance ids; kept out of the public repo)

name: "Release EIF (deploy)"

on:
  workflow_dispatch:
    inputs:
      deployment_environment:
        description: "GitHub environment supplying the deploy role, region and artifact bucket"
        type: choice
        options: [stage, release-test]
        default: stage
        required: true
      git_sha:
        description: "40-hex commit to deploy (must already be published to S3 by build-eif)"
        type: string
        required: true
      signer_role:
        description: "Signer role to deploy"
        type: choice
        options: [mint, burn]
        required: true
      enclave_cid:
        description: "Enclave instance to deploy on each host"
        type: choice
        options: ["16", "18", "20", "24"]
        default: "16"
        required: true
      deployment_config:
        description: "Absolute root-owned per-CID JSON path on each host (required for mint)"
        type: string
        required: false
        default: ""
      mint_mode:
        description: "Mint only: recovery requires an approved address; bootstrap requires an absent seed object"
        type: choice
        options: [recovery, bootstrap]
        default: recovery
      instances:
        description: "Space-separated EC2 instance ids (blank = secrets.STAGE_INSTANCE_IDS)"
        type: string
        required: false
        default: ""

permissions:
  id-token: write   # OIDC -> AWS
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.deployment_environment }} # configure required reviewers for both environments
    steps:
      - uses: actions/checkout@v4

      # Inputs go through env only, never into the script text.
      - name: Validate git_sha
        env:
          GIT_SHA: ${{ inputs.git_sha }}
        run: |
          [[ "$GIT_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::git_sha must be a 40-hex commit"; exit 1; }

      - name: Configure Stage AWS credentials (OIDC)
        if: inputs.deployment_environment == 'stage'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Separate names prevent repository-level Stage defaults being used when
      # an operator has not provisioned the release-test environment yet.
      - name: Configure isolated test AWS credentials (OIDC)
        if: inputs.deployment_environment == 'release-test'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.RELEASE_TEST_DEPLOY_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.RELEASE_TEST_AWS_REGION }}

      - name: Deploy to hosts via SSM
        env:
          GIT_SHA: ${{ inputs.git_sha }}
          SIGNER_ROLE: ${{ inputs.signer_role }}
          ENCLAVE_CID: ${{ inputs.enclave_cid }}
          BUCKET: ${{ vars.EIF_S3_BUCKET }}
          REGION: ${{ vars.AWS_REGION }}
          CLUSTER_DIR: ${{ vars.CLUSTER_DIR }}
          DEPLOY_CONFIG_FILE: ${{ inputs.deployment_config }}
          MINT_MODE: ${{ inputs.mint_mode }}
          DEPLOY_ENVIRONMENT: ${{ inputs.deployment_environment }}
          TEST_REGION: ${{ vars.RELEASE_TEST_AWS_REGION }}
          TEST_BUCKET: ${{ vars.RELEASE_TEST_EIF_S3_BUCKET }}
          TEST_CLUSTER_DIR: ${{ vars.RELEASE_TEST_CLUSTER_DIR }}
          INSTANCES_INPUT: ${{ inputs.instances }}
          INSTANCES_SECRET: ${{ secrets.STAGE_INSTANCE_IDS }}
        run: |
          set -euo pipefail
          if [ "$DEPLOY_ENVIRONMENT" = release-test ]; then
            REGION="${TEST_REGION:?set RELEASE_TEST_AWS_REGION}"
            BUCKET="${TEST_BUCKET:?set RELEASE_TEST_EIF_S3_BUCKET}"
            CLUSTER_DIR="${TEST_CLUSTER_DIR:?set RELEASE_TEST_CLUSTER_DIR}"
          fi
          : "${BUCKET:?set repo var EIF_S3_BUCKET}"
          : "${REGION:?set repo var AWS_REGION}"
          : "${CLUSTER_DIR:?set repo var CLUSTER_DIR}"
          if [ "$SIGNER_ROLE" = mint ] && [ -z "$DEPLOY_CONFIG_FILE" ]; then
            echo "::error::mint requires deployment_config; see docs/mint-release.md"
            exit 1
          fi
          if [ "$DEPLOY_ENVIRONMENT" = release-test ] && [ -z "$INSTANCES_INPUT" ]; then
            echo "::error::release-test requires explicit isolated instance IDs; no Stage fallback"
            exit 1
          fi
          INSTANCES="${INSTANCES_INPUT:-}"; [ -n "$INSTANCES" ] || INSTANCES="$INSTANCES_SECRET"
          [ -n "$INSTANCES" ] || { echo "::error::no instances (input or STAGE_INSTANCE_IDS)"; exit 1; }

          # Self-contained deploy script: env exports + the executable core (units embedded).
          {
            echo '#!/usr/bin/env bash'
            printf 'export GIT_SHA=%q\n' "$GIT_SHA"
            printf 'export SIGNER_ROLE=%q\n' "$SIGNER_ROLE"
            printf 'export ENCLAVE_CID=%q\n' "$ENCLAVE_CID"
            printf 'export DEPLOY_CONFIG_FILE=%q\n' "$DEPLOY_CONFIG_FILE"
            printf 'export MINT_MODE=%q\n' "$MINT_MODE"
            printf 'export BUCKET=%q\n' "$BUCKET"
            printf 'export AWS_REGION=%q\n' "$REGION"
            printf 'export CLUSTER_DIR=%q\n' "$CLUSTER_DIR"
            cat deploy/deploy-host.sh
          } > /tmp/deploy-run.sh
          B64="$(base64 -w0 /tmp/deploy-run.sh)"

          rc=0
          for INSTANCE in $INSTANCES; do
            echo "::group::deploy $INSTANCE (git_sha $GIT_SHA)"
            CMD_ID="$(aws ssm send-command \
              --instance-ids "$INSTANCE" \
              --document-name AWS-RunShellScript \
              --timeout-seconds 900 \
              --parameters "commands=[\"echo $B64 | base64 -d > /tmp/_dh.sh\",\"bash /tmp/_dh.sh\"]" \
              --query Command.CommandId --output text)"
            echo "CommandId=$CMD_ID"
            STATUS=Pending
            while true; do
              STATUS="$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE" \
                --query Status --output text 2>/dev/null || echo Pending)"
              case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
              sleep 5
            done
            echo "Status=$STATUS"
            aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE" \
              --query StandardOutputContent --output text || true
            ERR="$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE" \
              --query StandardErrorContent --output text || true)"
            [ -n "$ERR" ] && echo "STDERR: $ERR"
            echo "::endgroup::"
            [ "$STATUS" = "Success" ] || rc=1
          done
          [ "$rc" -eq 0 ] || { echo "::error::one or more hosts failed"; exit 1; }

      - name: Summary
        if: always()
        env:
          GIT_SHA: ${{ inputs.git_sha }}
          DEPLOY_ENVIRONMENT: ${{ inputs.deployment_environment }}
          BUCKET: ${{ vars.EIF_S3_BUCKET }}
          TEST_BUCKET: ${{ vars.RELEASE_TEST_EIF_S3_BUCKET }}
          SIGNER_ROLE: ${{ inputs.signer_role }}
          ENCLAVE_CID: ${{ inputs.enclave_cid }}
        run: |
          if [ "$DEPLOY_ENVIRONMENT" = release-test ]; then
            BUCKET="$TEST_BUCKET"
          fi
          echo "### Release EIF" >> "$GITHUB_STEP_SUMMARY"
          echo "- environment: \`$DEPLOY_ENVIRONMENT\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- signer: \`$SIGNER_ROLE\`, CID \`$ENCLAVE_CID\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- git_sha: \`$GIT_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- bucket: \`${BUCKET:-not configured}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- NOTE: enclaves restarted -> identity wiped; run init/clone to bootstrap, then deploy/verify-identity.sh with a complete approved EXPECTED_EVM map to verify identities and write the attestation bundles." >> "$GITHUB_STEP_SUMMARY"
