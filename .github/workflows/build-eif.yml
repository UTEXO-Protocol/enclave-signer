name: "Build EIF"

# Temporary branch only. Seeds are never supplied to this workflow.
# Select stage-bfa-seed-import-temp in the existing Run workflow menu.
# Public mode/asset settings live in stage-temp/bfa/config.json.

on:
  workflow_dispatch:
    inputs:
      debug_features:
        description: "Temporary BFA always uses allow-debug-pcrs. Leave empty or use that value."
        required: false
        default: ""

permissions:
  contents: read
  id-token: write   # for AWS OIDC

env:
  NITRO_CLI_VERSION: "1.4.5"
  AWS_REGION: ${{ vars.AWS_REGION }}
  # Hoisted to env because secrets can't be referenced directly in `if:`.
  AWS_ROLE: ${{ secrets.AWS_OIDC_ROLE_ARN }}

jobs:
  build-eif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check temporary branch and public configuration
        env:
          REQUESTED_FEATURES: ${{ inputs.debug_features }}
        run: |
          test "$GITHUB_REF" = refs/heads/stage-bfa-seed-import-temp
          test -z "$REQUESTED_FEATURES" || test "$REQUESTED_FEATURES" = allow-debug-pcrs
          python3 stage-temp/bfa/scripts/config.py stage-temp/bfa/config.json
          python3 -m unittest discover -s stage-temp/bfa/tests -p 'test_*.py'

      - name: Prepare private dependency keys
        env:
          PRIVATE_DEPS_DIR: ${{ runner.temp }}/private-deps
          FEDERATED_SIGNER_PROTO_DEPLOY_KEY: ${{ secrets.FEDERATED_SIGNER_PROTO_DEPLOY_KEY }}
          RGB_CONSIGNMENT_PARSER_DEPLOY_KEY: ${{ secrets.RGB_CONSIGNMENT_PARSER_DEPLOY_KEY }}
          RGB_CONSENSUS_BFA_DEPLOY_KEY: ${{ secrets.RGB_CONSENSUS_BFA_DEPLOY_KEY }}
          RGB_OPS_BFA_DEPLOY_KEY: ${{ secrets.RGB_OPS_BFA_DEPLOY_KEY }}
          RGB_SCHEMAS_BFA_DEPLOY_KEY: ${{ secrets.RGB_SCHEMAS_BFA_DEPLOY_KEY }}
        run: sh build/prepare-private-deps.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Rust (for nitro-cli build)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.1"
          targets: x86_64-unknown-linux-musl

      - name: System deps
        run: sudo apt-get update && sudo apt-get install -y musl-tools jq llvm-dev libclang-dev clang

      # Build + cache nitro-cli pinned to the host version. The repo's
      # blobs/x86_64 (kernel/init) determine PCR0/PCR1, so pinning the tag pins
      # the PCRs. Cache keyed on the version so we only build once per bump.
      - name: Cache nitro-cli
        id: nitro-cache
        uses: actions/cache@v4
        with:
          path: ~/nitro-cli-dist
          key: nitro-cli-${{ env.NITRO_CLI_VERSION }}

      - name: Build nitro-cli ${{ env.NITRO_CLI_VERSION }}
        if: steps.nitro-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch "v${NITRO_CLI_VERSION}" \
            https://github.com/aws/aws-nitro-enclaves-cli.git /tmp/nitro-src
          cd /tmp/nitro-src
          make nitro-cli
          mkdir -p ~/nitro-cli-dist/bin ~/nitro-cli-dist/blobs
          # The CLI binary lands under build/nitro_cli/.../release/nitro-cli
          cp "$(find . -type f -name nitro-cli -path '*release*' | head -n1)" ~/nitro-cli-dist/bin/nitro-cli
          cp -r blobs/x86_64/. ~/nitro-cli-dist/blobs/

      - name: Install nitro-cli on PATH
        run: |
          set -euxo pipefail
          sudo install -m 0755 ~/nitro-cli-dist/bin/nitro-cli /usr/local/bin/nitro-cli
          # nitro-cli writes to these dirs; the package/systemd normally creates
          # them, but on a source install we make them ourselves (else E19 on
          # opening /var/log/nitro_enclaves/nitro_enclaves.log).
          sudo mkdir -p /var/log/nitro_enclaves /run/nitro_enclaves
          sudo chmod 0777 /var/log/nitro_enclaves /run/nitro_enclaves
          nitro-cli --version

      - name: Test temporary enclave and seed-file CLI
        env:
          PRIVATE_DEPS_DIR: ${{ runner.temp }}/private-deps
        run: |
          sh build/with-private-deps.sh enclave bash stage-temp/bfa/scripts/check_enclave.sh
          sh build/with-private-deps.sh parent cargo test --locked --manifest-path parent/Cargo.toml \
            --features vsock,stage-bfa-temp --bin utexo-bridge-parent-cli stage_seed::tests

      - name: Build EIF + measurements
        env:
          PRIVATE_DEPS_DIR: ${{ runner.temp }}/private-deps
          OUT_DIR: ${{ github.workspace }}/artifacts
          NITRO_CLI_BLOBS: /home/runner/nitro-cli-dist/blobs
        run: |
          set -euxo pipefail
          mkdir -p "$OUT_DIR"
          bash stage-temp/bfa/scripts/build.sh

      # Host-side binaries that run ON the EC2 host (not inside the enclave):
      # the parent gRPC server and the operator CLI. Built static (musl) so they
      # do not depend on the host glibc version. Published next to the EIF under
      # the same git_sha so a host pulls a matching {EIF, parent, cli} set.
      - name: Build host binaries (parent + cli, static musl)
        env:
          PRIVATE_DEPS_DIR: ${{ runner.temp }}/private-deps
        run: |
          set -euxo pipefail
          # `parent/` is its own workspace (see the root Cargo.toml comment),
          # so build from inside it rather than with `-p` from the repo root.
          sh build/with-private-deps.sh parent cargo build --release --locked --manifest-path parent/Cargo.toml \
            --features vsock,stage-bfa-temp --target x86_64-unknown-linux-musl
          BIN=parent/target/x86_64-unknown-linux-musl/release
          cp "$BIN/utexo-bridge-parent" "$BIN/utexo-bridge-parent-cli" artifacts/
          ( cd artifacts && sha256sum utexo-bridge-parent utexo-bridge-parent-cli > HOST-SHA256SUMS )
          cat artifacts/HOST-SHA256SUMS

      - name: Write build metadata
        run: python3 stage-temp/bfa/scripts/metadata.py artifacts

      - name: Upload run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stage-bfa-temp-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/

      # --- S3 publish (only when an OIDC role is configured) -----------------
      - name: Configure AWS credentials
        id: aws
        if: ${{ env.AWS_ROLE != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish to S3 (immutable git_sha path)
        if: ${{ steps.aws.outcome == 'success' }}
        env:
          BUCKET: ${{ vars.EIF_S3_BUCKET }}
        run: |
          set -euxo pipefail
          [ -n "$BUCKET" ] || { echo "vars.EIF_S3_BUCKET is not set"; exit 1; }
          MODE=$(python3 -c 'import json; print(json.load(open("artifacts/metadata.json"))["mode"])')
          DEST="s3://${BUCKET}/stage-temp/bfa/${GITHUB_SHA}/${MODE}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/"
          aws s3 cp artifacts/ "$DEST" --recursive
          echo "Published to $DEST"

      - name: Remove private dependency keys
        if: always()
        run: rm -rf "${{ runner.temp }}/private-deps"
