name: "Build EIF"

# Produces the PRODUCTION enclave EIFs, captures their PCR measurements, and
# publishes everything to S3 under an immutable git-SHA path. Runtime hosts then
# pull the EIF by SHA instead of anyone building on a side machine.
#
# Builds three variants (matrix): the combined rgb+ccd image (historical name +
# S3 path, unchanged), an RGB-only image (eif/<sha>/rgb/), and a Concordium-only
# image (eif/<sha>/ccd/). Deploy whichever the target host needs.
#
# Reproducible PCRs: PCR0/PCR1 are a measurement of the EIF, which bakes in the
# nitro-cli kernel/init blobs — NOT just our code. We therefore pin nitro-cli to
# the SAME version the runtime hosts run (stage hosts: 1.4.5). Bump NITRO_CLI_VERSION
# here in lockstep with the hosts, or attestation (KMS PCR policy + clone) breaks.
# The image side is pinned too: base images are pinned by digest in
# Dockerfile.enclave and layer timestamps are normalised via SOURCE_DATE_EPOCH +
# BuildKit rewrite-timestamp (build/build-enclave.sh). OS package versions
# (apt/dnf) still float — pinning them is the next determinism step.
#
# Required repo config (Settings -> Secrets and variables -> Actions):
#   secrets.RGB_CONSIGNMENT_PARSER_DEPLOY_KEY  read-only deploy key (already used by ci.yml)
#   secrets.AWS_OIDC_ROLE_ARN                  IAM role to assume via OIDC for S3 upload
#                                              (if unset, the S3 step is skipped and
#                                               artifacts are only attached to the run)
#   vars.AWS_REGION                            AWS region for OIDC + S3 (e.g. eu-central-1)
#   vars.EIF_S3_BUCKET                         target S3 bucket for the artifacts
# No infra identifiers (account id, bucket, region) are hardcoded here — this is
# a public repo; everything environment-specific comes from repo vars/secrets.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write   # for AWS OIDC

env:
  NITRO_CLI_VERSION: "1.4.5"
  AWS_REGION: ${{ vars.AWS_REGION }}
  # Hoisted to env because secrets can't be referenced directly in `if:`.
  AWS_ROLE: ${{ secrets.AWS_OIDC_ROLE_ARN }}

jobs:
  build-eif:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Combined (rgb+ccd) — the historical artifact. Keeps the original
          # eif name and S3 path so existing consumers are unaffected.
          - variant: combined
            dockerfile: Dockerfile.enclave
            eif_name: utexo-bridge-enclave.eif
            s3_subpath: ""
            artifact_suffix: ""
          # RGB-only single-network EIF.
          - variant: rgb
            dockerfile: Dockerfile.enclave.rgb
            eif_name: utexo-bridge-enclave-rgb.eif
            s3_subpath: "rgb/"
            artifact_suffix: "-rgb"
          # Concordium-only single-network EIF.
          - variant: ccd
            dockerfile: Dockerfile.enclave.ccd
            eif_name: utexo-bridge-enclave-ccd.eif
            s3_subpath: "ccd/"
            artifact_suffix: "-ccd"
    steps:
      - uses: actions/checkout@v4

      # Deploy key for the private `rgb-consignment` dep (rgb-validation/spv).
      # Same secret the CI/CD workflows already use; `--ssh default` forwards it
      # into the BuildKit build for the cargo fetch only.
      - name: Set up SSH for private RGB deps
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: |
            ${{ secrets.RGB_CONSIGNMENT_PARSER_DEPLOY_KEY }}
            ${{ secrets.FEDERATED_SIGNER_PROTO_DEPLOY_KEY }}

      # Two private repos (federated-signer-proto + rgb-consignment-parser) live on
      # github.com; a single ssh-agent with two repo-scoped deploy keys offers the
      # wrong one first ("Repository not found"). Hand both keys to BuildKit as
      # secret files so Dockerfile.enclave can pin a per-repo key via SSH aliases.
      - name: Prepare BuildKit key files
        run: |
          umask 077
          printf '%s\n' '${{ secrets.FEDERATED_SIGNER_PROTO_DEPLOY_KEY }}' > /tmp/federated_key
          printf '%s\n' '${{ secrets.RGB_CONSIGNMENT_PARSER_DEPLOY_KEY }}' > /tmp/consignment_key

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Rust (for nitro-cli build)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96"
          targets: x86_64-unknown-linux-musl

      - name: System deps
        run: sudo apt-get update && sudo apt-get install -y musl-tools jq llvm-dev libclang-dev clang protobuf-compiler

      # Build + cache nitro-cli pinned to the host version. The repo's
      # blobs/x86_64 (kernel/init) determine PCR0/PCR1, so pinning the tag pins
      # the PCRs. Cache keyed on the version so we only build once per bump.
      - name: Cache nitro-cli
        id: nitro-cache
        uses: actions/cache@v4
        with:
          path: ~/nitro-cli-dist
          key: nitro-cli-${{ env.NITRO_CLI_VERSION }}

      - name: Build nitro-cli ${{ env.NITRO_CLI_VERSION }}
        if: steps.nitro-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch "v${NITRO_CLI_VERSION}" \
            https://github.com/aws/aws-nitro-enclaves-cli.git /tmp/nitro-src
          cd /tmp/nitro-src
          make nitro-cli
          mkdir -p ~/nitro-cli-dist/bin ~/nitro-cli-dist/blobs
          # The CLI binary lands under build/nitro_cli/.../release/nitro-cli
          cp "$(find . -type f -name nitro-cli -path '*release*' | head -n1)" ~/nitro-cli-dist/bin/nitro-cli
          cp -r blobs/x86_64/. ~/nitro-cli-dist/blobs/

      - name: Install nitro-cli on PATH
        run: |
          set -euxo pipefail
          sudo install -m 0755 ~/nitro-cli-dist/bin/nitro-cli /usr/local/bin/nitro-cli
          # nitro-cli writes to these dirs; the package/systemd normally creates
          # them, but on a source install we make them ourselves (else E19 on
          # opening /var/log/nitro_enclaves/nitro_enclaves.log).
          sudo mkdir -p /var/log/nitro_enclaves /run/nitro_enclaves
          sudo chmod 0777 /var/log/nitro_enclaves /run/nitro_enclaves
          nitro-cli --version

      - name: Build EIF + measurements
        env:
          OUT_DIR: ${{ github.workspace }}/artifacts
          NITRO_CLI_BLOBS: /home/runner/nitro-cli-dist/blobs
          DOCKERFILE: ${{ matrix.dockerfile }}
          EIF_NAME: ${{ matrix.eif_name }}
          IMAGE_TAG: utexo-bridge-enclave-${{ matrix.variant }}:latest
        run: |
          set -euxo pipefail
          mkdir -p "$OUT_DIR"
          ./build/build-enclave.sh

      # Host-side binaries that run ON the EC2 host (not inside the enclave):
      # the parent gRPC server and the operator CLI. Built static (musl) so they
      # do not depend on the host glibc version. Published next to the EIF under
      # the same git_sha so a host pulls a matching {EIF, parent, cli} set.
      - name: Build host binaries (parent + cli, static musl)
        run: |
          set -euxo pipefail
          cargo build --release --locked -p utexo-bridge-parent --features vsock \
            --target x86_64-unknown-linux-musl
          BIN=target/x86_64-unknown-linux-musl/release
          cp "$BIN/utexo-bridge-parent" "$BIN/utexo-bridge-parent-cli" artifacts/
          ( cd artifacts && sha256sum utexo-bridge-parent utexo-bridge-parent-cli > HOST-SHA256SUMS )
          cat artifacts/HOST-SHA256SUMS

      - name: Write build metadata
        run: |
          set -euxo pipefail
          cat > artifacts/metadata.json <<EOF
          {
            "git_sha": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "variant": "${{ matrix.variant }}",
            "eif_name": "${{ matrix.eif_name }}",
            "nitro_cli_version": "${NITRO_CLI_VERSION}",
            "run_id": "${{ github.run_id }}",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat artifacts/metadata.json

      - name: Upload run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eif-${{ github.sha }}${{ matrix.artifact_suffix }}
          path: |
            artifacts/${{ matrix.eif_name }}
            artifacts/PCR.json
            artifacts/SHA256SUMS
            artifacts/metadata.json
            artifacts/utexo-bridge-parent
            artifacts/utexo-bridge-parent-cli
            artifacts/HOST-SHA256SUMS

      # --- S3 publish (only when an OIDC role is configured) -----------------
      - name: Configure AWS credentials
        id: aws
        if: ${{ env.AWS_ROLE != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish to S3 (immutable git_sha path)
        if: ${{ steps.aws.outcome == 'success' }}
        env:
          BUCKET: ${{ vars.EIF_S3_BUCKET }}
        run: |
          set -euxo pipefail
          [ -n "$BUCKET" ] || { echo "vars.EIF_S3_BUCKET is not set"; exit 1; }
          DEST="s3://${BUCKET}/eif/${{ github.sha }}/${{ matrix.s3_subpath }}"
          aws s3 cp artifacts/ "$DEST" --recursive
          echo "Published to $DEST"
