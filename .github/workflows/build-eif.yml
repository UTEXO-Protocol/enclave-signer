name: "Build EIF"

# Produces the release enclave EIFs, captures their PCR measurements, and
# publishes everything to S3 under an immutable git-SHA path. Runtime hosts then
# pull the EIF by SHA instead of anyone building on a side machine.
#
# Builds two variants (matrix): rgb-mint and rgb-burn, each under its own S3
# subpath.
# Deploy whichever the target host needs.
#
# The builder profile is committed in build/toolchain.json. CI installs and
# validates those tools before building; the profile and observed measurements
# travel with each role's artifacts. Publication does not rebuild them.
#
# Stage/default repo config (Settings -> Secrets and variables -> Actions):
#   secrets.FEDERATED_SIGNER_PROTO_DEPLOY_KEY  parent proto access
#   secrets.AWS_OIDC_ROLE_ARN                  IAM role to assume via OIDC for S3 upload
#                                              (if unset, the S3 step is skipped and
#                                               artifacts are only attached to the run)
#   vars.AWS_REGION                            AWS region for OIDC + S3 (e.g. eu-central-1)
#   vars.EIF_S3_BUCKET                         target S3 bucket for the artifacts
# No infra identifiers (account id, bucket, region) are hardcoded here — this is
# a public repo; everything environment-specific comes from repo vars/secrets.

# Production uses the protected environment and PROD_* settings documented in
# docs/production-eif.md. Missing production upload configuration is an error.

on:
  workflow_dispatch:
    inputs:
      build_profile:
        description: 'Measured image profile'
        type: choice
        options: [default, stage-signet, stage-mainnet, prod-mainnet]
        default: default
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write   # for AWS OIDC

jobs:
  build-eif:
    runs-on: ubuntu-22.04
    environment: ${{ inputs.build_profile == 'prod-mainnet' && 'production' || '' }}
    env:
      BUILD_PROFILE: ${{ inputs.build_profile || 'default' }}
      STAGE_RGB_ASSET_ID: ${{ vars.STAGE_RGB_ASSET_ID }}
      STAGE_TOKEN_CONTRACT: ${{ vars.STAGE_TOKEN_CONTRACT }}
      STAGE_GAS_TX_ALLOWED_SELECTORS: ${{ vars.STAGE_GAS_TX_ALLOWED_SELECTORS }}
      STAGE_MAINNET_RGB_ASSET_ID: ${{ vars.STAGE_MAINNET_RGB_ASSET_ID }}
      STAGE_MAINNET_TOKEN_CONTRACT: ${{ vars.STAGE_MAINNET_TOKEN_CONTRACT }}
      STAGE_MAINNET_GAS_TX_ALLOWED_SELECTORS: ${{ vars.STAGE_MAINNET_GAS_TX_ALLOWED_SELECTORS }}
      PROD_MAINNET_RGB_ASSET_ID: ${{ vars.PROD_MAINNET_RGB_ASSET_ID }}
      PROD_MAINNET_MULTISIG_CONTRACT: ${{ vars.PROD_MAINNET_MULTISIG_CONTRACT }}
      PROD_MAINNET_BRIDGE_CONTRACT: ${{ vars.PROD_MAINNET_BRIDGE_CONTRACT }}
      PROD_MAINNET_TOKEN_CONTRACT: ${{ vars.PROD_MAINNET_TOKEN_CONTRACT }}
      PROD_MAINNET_GAS_TX_ALLOWED_SELECTORS: ${{ vars.PROD_MAINNET_GAS_TX_ALLOWED_SELECTORS }}
      PROD_KMS_ALLOWED_ACCOUNT_IDS: ${{ vars.PROD_KMS_ALLOWED_ACCOUNT_IDS }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # RGB single-network EIFs. Two signer roles,
          # each its own enclave with its own PCR0 and seed: the mint signer
          # (EVM -> RGB) and the burn signer (RGB -> EVM).
          - variant: rgb-mint
            dockerfile: Dockerfile.enclave.mint
            eif_name: utexo-bridge-enclave-mint.eif
            s3_subpath: "rgb-mint/"
            artifact_suffix: "-mint"
          - variant: rgb-burn
            dockerfile: Dockerfile.enclave.burn
            eif_name: utexo-bridge-enclave-burn.eif
            s3_subpath: "rgb-burn/"
            artifact_suffix: "-burn"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      - name: Select AWS artifact account
        env:
          AWS_OIDC_ROLE_ARN: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          EIF_S3_BUCKET: ${{ vars.EIF_S3_BUCKET }}
          PROD_AWS_OIDC_ROLE_ARN: ${{ secrets.PROD_AWS_OIDC_ROLE_ARN }}
          PROD_AWS_ACCOUNT_ID: ${{ vars.PROD_AWS_ACCOUNT_ID }}
          PROD_AWS_REGION: ${{ vars.PROD_AWS_REGION }}
          PROD_EIF_S3_BUCKET: ${{ vars.PROD_EIF_S3_BUCKET }}
        run: python3 build/eif-aws-settings.py build

      - name: Validate release inputs
        if: env.BUILD_PROFILE != 'default'
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          set -euo pipefail
          case "$BUILD_PROFILE" in
            stage-signet|stage-mainnet|prod-mainnet) source "build/profiles/$BUILD_PROFILE.sh" ;;
            *) echo 'Unknown build profile' >&2; exit 1 ;;
          esac

      - name: Prepare private dependency keys
        env:
          PRIVATE_DEPS_DIR: ${{ runner.temp }}/private-deps
          FEDERATED_SIGNER_PROTO_DEPLOY_KEY: ${{ secrets.FEDERATED_SIGNER_PROTO_DEPLOY_KEY }}
        run: sh build/prepare-private-deps.sh

      - name: Install pinned builder
        run: python3 build/prepare-ci-builder.py build/toolchain.json

      - name: Verify and record builder tools
        run: python3 build/toolchain.py record build/toolchain.json artifacts

      - name: Build EIF + measurements
        env:
          OUT_DIR: ${{ github.workspace }}/artifacts
          DOCKERFILE: ${{ matrix.dockerfile }}
          EIF_NAME: ${{ matrix.eif_name }}
          IMAGE_TAG: utexo-bridge-enclave-${{ matrix.variant }}:latest
          RGB_ASSET_ID: ${{ vars.BFA_RGB_ASSET_ID }}
          KMS_ALLOWED_ACCOUNT_IDS: ${{ vars.KMS_ALLOWED_ACCOUNT_IDS }}
        run: |
          set -euxo pipefail
          mkdir -p "$OUT_DIR"
          ./build/build-enclave.sh

      # Host-side binaries that run ON the EC2 host (not inside the enclave):
      # the parent gRPC server and the operator CLI. Built static (musl) so they
      # do not depend on the host glibc version. Published next to the EIF under
      # the same git_sha so a host pulls a matching {EIF, parent, cli} set.
      - name: Build host binaries (parent + cli, static musl)
        env:
          PRIVATE_DEPS_DIR: ${{ runner.temp }}/private-deps
        run: |
          set -euxo pipefail
          # `parent/` is its own workspace (see the root Cargo.toml comment),
          # so build from inside it rather than with `-p` from the repo root.
          sh build/with-private-deps.sh parent cargo build --release --locked --manifest-path parent/Cargo.toml \
            --features vsock --target x86_64-unknown-linux-musl
          BIN=parent/target/x86_64-unknown-linux-musl/release
          cp "$BIN/utexo-bridge-parent" "$BIN/utexo-bridge-parent-cli" artifacts/
          ( cd artifacts && sha256sum utexo-bridge-parent utexo-bridge-parent-cli > HOST-SHA256SUMS )
          cat artifacts/HOST-SHA256SUMS

      - name: Write build metadata
        env:
          VARIANT: ${{ matrix.variant }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          EIF_NAME: ${{ matrix.eif_name }}
          IMAGE_TAG: utexo-bridge-enclave-${{ matrix.variant }}:latest
        run: |
          set -euxo pipefail
          # Read the asset pin from the image used for the EIF.
          docker image inspect "$IMAGE_TAG" | jq \
            --arg git_sha "$GITHUB_SHA" \
            --arg ref "$GITHUB_REF" \
            --arg variant "$VARIANT" \
            --arg build_profile "$BUILD_PROFILE" \
            --arg dockerfile "$DOCKERFILE" \
            --arg eif_name "$EIF_NAME" \
            --arg nitro_cli_version "$NITRO_CLI_VERSION" \
            --arg toolchain_sha256 "$(sha256sum artifacts/toolchain.json | cut -d ' ' -f1)" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg built_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '.[0].Config.Env
            | map(select(startswith("RGB_ASSET_ID=")) | ltrimstr("RGB_ASSET_ID="))
            | {
                git_sha: $git_sha,
                ref: $ref,
                variant: $variant,
                build_profile: $build_profile,
                dockerfile: $dockerfile,
                eif_name: $eif_name,
                rgb_asset_id: (.[0] // null),
                nitro_cli_version: $nitro_cli_version,
                toolchain_sha256: $toolchain_sha256,
                run_id: $run_id,
                built_at: $built_at
              }' > artifacts/metadata.json
          cat artifacts/metadata.json

      - name: Upload run artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eif-${{ github.sha }}${{ matrix.artifact_suffix }}${{ env.BUILD_PROFILE != 'default' && format('-{0}', env.BUILD_PROFILE) || '' }}
          path: |
            artifacts/${{ matrix.eif_name }}
            artifacts/PCR.json
            artifacts/IMAGE-ENV.json
            artifacts/SHA256SUMS
            artifacts/metadata.json
            artifacts/utexo-bridge-parent
            artifacts/utexo-bridge-parent-cli
            artifacts/HOST-SHA256SUMS
            artifacts/toolchain.json
            artifacts/builder-info.json
            artifacts/host-packages.txt
            artifacts/TOOLCHAIN-SHA256SUMS

      # --- S3 publish (only when an OIDC role is configured) -----------------
      - name: Configure AWS credentials
        id: aws
        if: ${{ env.AWS_ROLE != '' }}
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Publish to S3 (immutable git_sha path)
        if: ${{ steps.aws.outcome == 'success' }}
        env:
          BUCKET: ${{ env.EIF_S3_BUCKET }}
        run: |
          set -euxo pipefail
          [ -n "$BUCKET" ] || { echo "vars.EIF_S3_BUCKET is not set"; exit 1; }
          DEST="s3://${BUCKET}/eif/${{ github.sha }}/${{ env.BUILD_PROFILE != 'default' && format('{0}/', env.BUILD_PROFILE) || '' }}${{ matrix.s3_subpath }}"
          aws s3 cp artifacts/ "$DEST" --recursive
          echo "Published to $DEST"

      - name: Remove private dependency keys
        if: always()
        run: rm -rf "${{ runner.temp }}/private-deps"
