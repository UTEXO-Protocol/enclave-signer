name: AI Review - Kimi

on:
  pull_request:
    types: [labeled, synchronize]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to review (for manual reruns)"
        required: true
        type: string

jobs:
  kimi-review:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' &&
       github.event.label.name == 'ai-review/kimi') ||
      (github.event_name == 'pull_request' && github.event.action == 'synchronize' &&
       contains(github.event.pull_request.labels.*.name, 'ai-review/kimi')) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null &&
       github.event.issue.state == 'open' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
       contains(github.event.comment.body, '@kimi'))
    runs-on: ubuntu-latest
    concurrency:
      group: ai-review-kimi-pr-${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event_name == 'issue_comment' && github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      # The action loads skills from the PR head and runs in yolo mode. A
      # comment must never run it on a fork's code.
      - name: Refuse closed or fork PRs on comment trigger
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number }}
        run: |
          read -r state head < <(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" \
            --jq '"\(.state) \(.head.repo.full_name)"')
          if [ "$state" != open ] || [ "$head" != "$GITHUB_REPOSITORY" ]; then
            echo "refused: PR #$PR is $state, head repo $head"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run Kimi Code Review
        uses: UTEXO-Protocol/kimi-actions@beccb0a9a5705ea74c3c331af92fd3e76a19d40d # main @ 2026-08-17
        with:
          kimi_api_key: ${{ secrets.KIMI_API_KEY }}
          kimi_base_url: https://api.moonshot.ai/v1
          github_token: ${{ secrets.GITHUB_TOKEN }}
          model: kimi-k3
          language: en-US
          review_level: normal
          pr_number: ${{ inputs.pr_number }}
