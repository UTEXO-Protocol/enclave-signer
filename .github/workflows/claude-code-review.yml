name: AI Review - Claude

on:
  pull_request:
    types: [labeled, synchronize]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to review (for manual reruns)"
        required: true
        type: string

jobs:
  claude-review:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' &&
       (github.event.label.name == 'ai-review/claude' || github.event.label.name == 'claude-review')) ||
      (github.event_name == 'pull_request' && github.event.action == 'synchronize' &&
       (contains(github.event.pull_request.labels.*.name, 'ai-review/claude') || contains(github.event.pull_request.labels.*.name, 'claude-review'))) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null &&
       github.event.issue.state == 'open' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
       contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    concurrency:
      group: ai-review-claude-pr-${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event_name == 'issue_comment' && github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      # A comment or manual run must never act on a fork's PR.
      - name: Refuse closed or fork PRs on comment or manual trigger
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr_number || github.event.issue.number }}
        run: |
          read -r state head < <(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" \
            --jq '"\(.state) \(.head.repo.full_name)"')
          if [ "$state" != open ] || [ "$head" != "$GITHUB_REPOSITORY" ]; then
            echo "refused: PR #$PR is $state, head repo $head"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: false
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event_name == 'issue_comment' && github.event.issue.number || github.event.pull_request.number }}

            Please review this pull request and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            Use the repository's CLAUDE.md for guidance on style and conventions.
            Be constructive and helpful in your feedback.

            Use `gh pr comment` to publish your final review on the PR.
          claude_args: '--allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'
