name: Block External PRs

on:
  pull_request_target:
    types: [opened, reopened]

jobs:
  close-external-pr:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Close PR from non-org member
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const author = context.payload.pull_request.user.login;
            let isMember = false;
            try {
              const resp = await github.rest.orgs.checkMembershipForUser({
                org: 'UTEXO-Protocol',
                username: author,
              });
              isMember = resp.status === 204;
            } catch {
              isMember = false;
            }
            if (!isMember) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: 'Thank you for your interest. This repository only accepts pull requests from members of the UTEXO-Protocol organization.',
              });
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                state: 'closed',
              });
            }
