name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
    inputs:
      run_stress:
        description: Run ignored RGB history and capacity checks in release mode
        type: boolean
        default: false

permissions:
  contents: read

# A new push to a pull request cancels the older run of that pull request.
# Runs on main and dev, and manual runs, always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # parent/Cargo.toml uses an ssh:// URL for its private dep; force Cargo to use
  # the system git so it honours the SSH setup step and the rgb-lib credential.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:

  # One job per build family. A job compiles its dependencies once and runs
  # every step that can reuse them: target dirs are not cached (see the setup
  # action), so each extra job compiles everything again.
  #
  # Each test runs in one step. A test runs in a second build only when that
  # build changes the code it tests; the step says why. The last job, `ci`,
  # keeps the check name for branch protection and passes only when every job
  # passed.

  # Python script tests, format, the attestation verifier, the proto crate,
  # the build without a signer role, and the release guards of the enclave.
  # None of it compiles an RGB dependency.
  light:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up the Rust build
        uses: ./.github/actions/setup
        with:
          components: rustfmt, clippy
          cache-name: light
          rgb-lib-bfa-deploy-key: ${{ secrets.RGB_LIB_BFA_DEPLOY_KEY }}
          rgb-private-deps-token: ${{ secrets.RGB_PRIVATE_DEPS_TOKEN }}
          federated-signer-proto-deploy-key: ${{ secrets.FEDERATED_SIGNER_PROTO_DEPLOY_KEY }}

      - name: Test build and deployment scripts
        run: |
          python3 -m unittest discover -s build/tests -v
          python3 -m unittest discover -s deploy/lambda/sns-to-slack -v

      # A [patch.crates-io] entry that does not match its requirement is dropped
      # with only a warning; one off rgb-lib's revs builds against other RGB crates.
      - name: Every RGB crate patch is used and copies rgb-lib's
        run: |
          for manifest in Cargo.toml parent/Cargo.toml; do
            cargo metadata --locked --format-version 1 --manifest-path "$manifest" > /dev/null 2> metadata.log || { cat metadata.log; exit 1; }
            if grep -q "was not used in the crate graph" metadata.log; then
              echo "::error::$manifest has an unused [patch.crates-io] entry"
              cat metadata.log
              exit 1
            fi
          done
          # The default set has no RGB, so ask for rgb-lib's crate explicitly.
          cargo metadata --locked --format-version 1 --features utexo-bridge-enclave/rgb-validation > metadata.json
          python3 - <<'EOF'
          import json, tomllib
          lib = next(p for p in json.load(open('metadata.json'))['packages'] if p['name'] == 'rgb-lib')
          theirs = tomllib.load(open(lib['manifest_path'], 'rb'))['patch']['crates-io']
          ours = tomllib.load(open('Cargo.toml', 'rb'))['patch']['crates-io']
          stale = [name for name in sorted(ours.keys() | theirs.keys())
                   if name not in ours or name not in theirs
                   or ours[name]['git'] != theirs[name]['git']
                   or not ours[name]['rev'].startswith(theirs[name]['rev'])]
          if stale:
              raise SystemExit(f"::error::Cargo.toml [patch.crates-io] differs from rgb-lib's: {stale}")
          EOF

      # `parent/` is a separate cargo workspace (see the root Cargo.toml).
      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --all --manifest-path parent/Cargo.toml -- --check

      # `--all-targets` so clippy also lints test code under `tests/`. The
      # default feature set is empty: this is the build without a signer role.
      - name: Clippy (no features)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The verifier's tests without `mock` are a subset of these.
      - name: Test (attestation verifier with mock documents, proto)
        run: |
          cargo test --locked -p attestation-verify --features mock
          cargo test --locked -p enclave-proto

      # The signer jobs run every other enclave test. These four compile only
      # without `rgb-validation` or without `allow-seed-import`, which every
      # signer test build has.
      - name: Test (enclave tests that need a build without a signer role)
        run: |
          set -o pipefail
          cargo test -p utexo-bridge-enclave --lib --test test_keygen --test test_signing -- --exact \
            config::tests::unsupported_rpc_paths_are_refused_without_echoing_them \
            production_build_rejects_caller_supplied_seed_and_mnemonic \
            a_build_without_rgb_validation_refuses_rgb_sources \
            test_no_rgb_validation_build_refuses_bridge_psbt 2>&1 | tee test.log
          awk '/^test result:/ { n += $4 } END { if (n != 4) { print "::error::expected 4 tests, ran " n; exit 1 } }' test.log

      # Each dev-only feature must hit its `compile_error!` in a release build.
      # The check must fail, and fail on the guard, not on an unrelated error.
      - name: Assert release builds reject the dev features
        run: |
          for feature in allow-seed-import mock-attestation allow-debug-pcrs; do
            if cargo check -p utexo-bridge-enclave --release --features "$feature" 2>build.log; then
              echo "::error::release build unexpectedly SUCCEEDED with '$feature'"
              exit 1
            fi
            if ! grep -q "must not be enabled in a release build" build.log; then
              echo "::error::release build failed, but not on the guard for '$feature'"
              cat build.log
              exit 1
            fi
          done

  # The parent workspace has its own lockfile and target dir.
  parent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up the Rust build
        uses: ./.github/actions/setup
        with:
          components: clippy
          cache-name: parent
          rgb-lib-bfa-deploy-key: ${{ secrets.RGB_LIB_BFA_DEPLOY_KEY }}
          rgb-private-deps-token: ${{ secrets.RGB_PRIVATE_DEPS_TOKEN }}
          federated-signer-proto-deploy-key: ${{ secrets.FEDERATED_SIGNER_PROTO_DEPLOY_KEY }}

      - name: Clippy (parent)
        run: cargo clippy --manifest-path parent/Cargo.toml --all-targets -- -D warnings

      # Builds the library and both binaries too.
      - name: Test (parent)
        run: cargo test --manifest-path parent/Cargo.toml

      # The local VSOCK transport needs no Nitro enclave. Fail if the runner
      # cannot provide it: a missing device must not become a passing test.
      - name: Test (parent CLI, silent VSOCK peer)
        run: |
          sudo modprobe vsock_loopback
          cargo test --locked --manifest-path parent/Cargo.toml --features vsock --test test_cli_vsock_timeout

      - name: Clippy (parent, insecure-dev)
        run: cargo clippy --manifest-path parent/Cargo.toml --features insecure-dev --lib --bins --test test_insecure_dev -- -D warnings

      - name: Test (parent, insecure-dev)
        run: cargo test --manifest-path parent/Cargo.toml --features insecure-dev --test test_insecure_dev

      - name: Assert a release build rejects insecure-dev
        run: |
          if cargo check --manifest-path parent/Cargo.toml --release --features insecure-dev 2>build.log; then
            echo "::error::release build unexpectedly SUCCEEDED with 'insecure-dev'"
            exit 1
          fi
          if ! grep -q "must not be enabled in a release build" build.log; then
            echo "::error::release build failed, but not on the insecure-dev guard"
            cat build.log
            exit 1
          fi

  # The mint signer (EVM -> RGB, Dockerfile.enclave.mint). The test build adds
  # mock attestation and seed import, which only a debug build allows.
  mint-signer:
    runs-on: ubuntu-latest
    env:
      ENCLAVE: -p utexo-bridge-enclave --no-default-features
    steps:
      - uses: actions/checkout@v4
      - name: Set up the Rust build
        uses: ./.github/actions/setup
        with:
          components: clippy
          cache-name: mint-signer
          rgb-lib-bfa-deploy-key: ${{ secrets.RGB_LIB_BFA_DEPLOY_KEY }}
          rgb-private-deps-token: ${{ secrets.RGB_PRIVATE_DEPS_TOKEN }}

      # The features of the shipped image. `cargo test` below builds the code.
      - name: Clippy (mint image)
        run: cargo clippy $ENCLAVE --features vsock,spv,mint-signer --all-targets -- -D warnings

      # Every test of the mint build, including the role-independent modules
      # that the burn-signer job skips (build/ci-mint-only-tests.txt). Each of
      # those must run a test here, or the skip would drop it.
      - name: Test (mint signer)
        run: |
          set -o pipefail
          cargo test $ENCLAVE --features spv,mint-signer,mock-attestation,allow-seed-import 2>&1 | tee test.log
          sed 's/\x1b\[[0-9;]*m//g' test.log > test.txt
          for module in $(sed -e 's/#.*//' -e '/^[[:space:]]*$/d' build/ci-mint-only-tests.txt); do
            grep -q "^test $module.* \.\.\. ok$" test.txt || { echo "::error::$module ran no test in the mint build"; exit 1; }
          done

      # These compile only with `vsock` on Linux. They need no VSOCK device:
      # the forwarder tests use TCP socket pairs.
      - name: Test (VSOCK forwarder and custody deadline)
        run: |
          set -o pipefail
          cargo test --locked $ENCLAVE --features vsock,spv,mint-signer --lib -- \
            vsock_forwarder:: vsock_connect_rejects_expired_deadline_before_opening_a_socket 2>&1 | tee test.log
          awk '/^test result:/ { n += $4 } END { if (n < 4) { print "::error::expected at least 4 VSOCK tests, ran " n; exit 1 } }' test.log

      # The public-signet mint image without SPV. It boots on the indexer
      # policy, so the server differs: run the indexer-only tests and the mint
      # requests over the wire again.
      - name: Clippy (mint without SPV)
        run: cargo clippy $ENCLAVE --features vsock,mint-signer --lib --bins --test test_indexer_only --test test_evm_rpc_tls --test test_rpc_path -- -D warnings

      - name: Test (mint without SPV)
        run: |
          cargo test $ENCLAVE --features mint-signer --test test_indexer_only --test test_bfa_mint_over_the_wire
          cargo test $ENCLAVE --features mint-signer --test test_signing test_sign_btc

  # The burn signer (RGB -> EVM, Dockerfile.enclave.burn), its build without
  # SPV, and the feature guards, which reuse its compiled dependencies.
  burn-signer:
    runs-on: ubuntu-latest
    env:
      ENCLAVE: -p utexo-bridge-enclave --no-default-features
      TEST_FEATURES: spv,burn-signer,mock-attestation,allow-seed-import
    steps:
      - uses: actions/checkout@v4
      - name: Set up the Rust build
        uses: ./.github/actions/setup
        with:
          components: clippy
          cache-name: burn-signer
          rgb-lib-bfa-deploy-key: ${{ secrets.RGB_LIB_BFA_DEPLOY_KEY }}
          rgb-private-deps-token: ${{ secrets.RGB_PRIVATE_DEPS_TOKEN }}

      - name: Clippy (burn image)
        run: cargo clippy $ENCLAVE --features vsock,spv,burn-signer --all-targets -- -D warnings

      # The modules in build/ci-mint-only-tests.txt run the same code in both
      # builds, so they ran in the mint-signer job.
      - name: Test (burn signer)
        run: |
          skip=$(sed -e 's/#.*//' -e '/^[[:space:]]*$/d' -e 's/^/--skip /' build/ci-mint-only-tests.txt)
          cargo test $ENCLAVE --features $TEST_FEATURES -- $skip

      # Ignored by default because they build large histories; this reuses the
      # test build above. Three use 10 000 transfers: the consignment memory
      # test, a whole burn through dispatch, and the default request limits.
      # Two refuse forged histories at the caps (6 MB and 10 MB).
      - name: Test (burn signer, large-history tests)
        run: |
          set -o pipefail
          cargo test $ENCLAVE --features $TEST_FEATURES --lib -- --ignored 10_000 \
            a_listed_merge_within_every_cap_is_refused_by_its_walk_time \
            a_chain_of_propagates_at_the_size_cap_is_refused_before_rgb_lib 2>&1 | tee test.log
          awk '/^test result:/ { n += $4 } END { if (n != 5) { print "::error::expected 5 large-history tests, ran " n; exit 1 } }' test.log

      - name: Test (RGB release stress, on request)
        if: github.event_name == 'workflow_dispatch' && inputs.run_stress
        timeout-minutes: 30
        run: cargo test --locked --release $ENCLAVE --features spv,burn-signer --lib networks::rgb::validation::tests -- --ignored --nocapture --test-threads=1

      # The public-signet burn image trusts the indexer for witness status and
      # depth. These tests compile only without SPV.
      - name: Clippy (burn without SPV)
        run: cargo clippy $ENCLAVE --features vsock,burn-signer --lib --bins --test test_indexer_only --test test_evm_rpc_tls --test test_rpc_path -- -D warnings

      - name: Test (burn without SPV)
        run: |
          cargo test $ENCLAVE --features burn-signer --lib indexer_only
          cargo test $ENCLAVE --features burn-signer --test test_indexer_only

      # Both roles here, so the release-mode dependencies compile once.
      - name: Check release (without SPV, mint and burn)
        run: |
          for role in mint-signer burn-signer; do
            cargo check --release $ENCLAVE --features vsock,$role
          done

      # Unsupported feature sets must fail on their own `compile_error!`, not on
      # an unrelated error. `cargo check` reuses the dependencies clippy built.
      - name: Assert unsupported feature sets are rejected
        run: |
          expect_guard() {
            local features=$1 message=$2
            if cargo check --locked $ENCLAVE --features "$features" 2>build.log; then
              echo "::error::build unexpectedly compiled with '$features'"
              exit 1
            fi
            if ! grep -q "$message" build.log; then
              echo "::error::build with '$features' failed, but not on the guard: $message"
              cat build.log
              exit 1
            fi
          }
          for role in mint-signer burn-signer; do
            for forbidden in allow-seed-import mock-attestation allow-debug-pcrs; do
              expect_guard "$role,$forbidden" "rgb-validation without spv requires real attestation"
            done
          done
          expect_guard rgb-validation "rgb-validation without spv requires mint-signer or burn-signer"
          expect_guard spv,mint-signer,burn-signer "mint-signer and burn-signer are mutually exclusive"
          expect_guard spv "an RGB build requires a signer role"
          for features in kms-persistence burn-signer,kms-persistence spv,kms-persistence; do
            expect_guard "$features" "kms-persistence requires mint-signer"
          done

  # The one check name that branch protection watches. It passes only when
  # every job above passed, and it fails when one was skipped or cancelled.
  ci:
    if: always()
    needs:
      - light
      - parent
      - mint-signer
      - burn-signer
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || { echo "::error::a CI job did not succeed: $result"; exit 1; }
          done
