name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Cargo.toml uses ssh:// URLs for private deps; force Cargo to use the
  # system git so it honours SSH_AUTH_SOCK set by the SSH setup step.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  native-kms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build official KMS helper
        run: |
          docker buildx build --platform linux/amd64 --load \
            --target kms-tool-builder -t kms-native-ci \
            -f build/Dockerfile.enclave.rgb .

  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Test private dependency build wiring
        run: python3 -m unittest discover -s build/tests -v

      - name: Install Rust 1.96.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.1"
          components: rustfmt, clippy

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      # Each private dep uses a per-repo SSH Host alias (e.g. github-rgb-consensus).
      # The alias maps to github.com with IdentityFile + IdentitiesOnly yes, so
      # SSH offers exactly ONE key per connection. Without this, the agent offers
      # all keys in order; GitHub authenticates with the first accepted key and
      # then refuses access to any repo that key is not authorised for.
      - name: Set up SSH for private deps
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts
          printf '%s\n' "${{ secrets.FEDERATED_SIGNER_PROTO_DEPLOY_KEY }}" > ~/.ssh/key_federated
          printf '%s\n' "${{ secrets.RGB_CONSIGNMENT_PARSER_DEPLOY_KEY }}"  > ~/.ssh/key_consignment
          printf '%s\n' "${{ secrets.RGB_CONSENSUS_BFA_DEPLOY_KEY }}"       > ~/.ssh/key_consensus
          printf '%s\n' "${{ secrets.RGB_OPS_BFA_DEPLOY_KEY }}"             > ~/.ssh/key_ops
          printf '%s\n' "${{ secrets.RGB_SCHEMAS_BFA_DEPLOY_KEY }}"         > ~/.ssh/key_schemas
          chmod 600 ~/.ssh/key_*
          cat >> ~/.ssh/config << 'SSHCONF'
          Host github-federated-signer
            HostName github.com
            User git
            IdentityFile ~/.ssh/key_federated
            IdentitiesOnly yes
          Host github-rgb-consignment
            HostName github.com
            User git
            IdentityFile ~/.ssh/key_consignment
            IdentitiesOnly yes
          Host github-rgb-consensus
            HostName github.com
            User git
            IdentityFile ~/.ssh/key_consensus
            IdentitiesOnly yes
          Host github-rgb-ops
            HostName github.com
            User git
            IdentityFile ~/.ssh/key_ops
            IdentitiesOnly yes
          Host github-rgb-schemas
            HostName github.com
            User git
            IdentityFile ~/.ssh/key_schemas
            IdentitiesOnly yes
          SSHCONF
          chmod 600 ~/.ssh/config

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            parent/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # NOTE: `parent/` is a SEPARATE cargo workspace (see the root Cargo.toml
      # comment), so `--workspace` here covers only enclave / enclave-proto /
      # attestation-verify. Parent gets its own steps below; keep them in sync
      # when adding checks.
      - name: Check formatting
        run: cargo fmt --all -- --check

      # Defaults are rgb + rgb-swap + ccd, so the steps below exercise the
      # signing path shipped in the combined EIF (minus vsock / evm-rpc).
      - name: Build (default features)
        run: cargo build --workspace

      # `--all-targets` so clippy lints test code too — otherwise lints on
      # files under `tests/` slip through, as happened on the attestation PR.
      - name: Clippy (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test (default features)
        run: cargo test --workspace

      # --- parent workspace (separate lockfile, separate target dir) ---------
      - name: Check formatting (parent)
        run: cargo fmt --all --manifest-path parent/Cargo.toml -- --check

      - name: Build (parent)
        run: cargo build --manifest-path parent/Cargo.toml

      - name: Clippy (parent)
        run: cargo clippy --manifest-path parent/Cargo.toml --all-targets -- -D warnings

      - name: Test (parent)
        run: cargo test --manifest-path parent/Cargo.toml

      # Production build profile: the exact feature set shipped in the EIF
      # (build/Dockerfile.enclave). `helios` is not shipped.
      - name: Build (production combo)
        run: cargo build -p utexo-bridge-enclave --features vsock,rgb,rgb-swap,ccd,bfa-validation

      - name: Clippy (production combo)
        run: cargo clippy -p utexo-bridge-enclave --features vsock,rgb,rgb-swap,ccd,bfa-validation --all-targets -- -D warnings

      # SPV path coverage. Cannot use vsock here (Linux runner without
      # vsock support); spv pulls in rgb-validation transitively, which is
      # what the SPV unit + integration tests exercise.
      - name: Test (--features spv,rgb-swap)
        run: cargo test -p utexo-bridge-enclave --features spv,rgb-swap

      # RGB-only EIF profile, `ccd` dropped. Mirrors Dockerfile.enclave.rgb.
      # CCD requests (SignCcd / CcdSource) must be refused here.
      - name: Build (rgb-only)
        run: cargo build -p utexo-bridge-enclave --no-default-features --features vsock,rgb,rgb-swap,bfa-validation
      - name: Clippy (rgb-only)
        run: cargo clippy -p utexo-bridge-enclave --no-default-features --features vsock,rgb,rgb-swap,bfa-validation --all-targets -- -D warnings
      - name: Test (rgb-only)
        run: cargo test -p utexo-bridge-enclave --no-default-features --features rgb,rgb-swap,bfa-validation,mock-attestation,allow-seed-import

      # BFA mint/burn EIF profile - the shipped production image, and the
      # second enclave instance. Same stack as the rgb-only lane above with the
      # other flow selected, so the mint and burn rules in
      # networks/rgb/flow/mint_burn.rs are compiled and exercised. Mirrors
      # Dockerfile.enclave.mint-burn. `bfa-mint` pulls in rgb-mint-burn and
      # bfa-validation, and bfa-validation pulls in evm-rpc, so naming
      # evm-rpc here would add nothing.
      - name: Build (rgb mint/burn)
        run: cargo build -p utexo-bridge-enclave --no-default-features --features vsock,rgb,bfa-mint
      - name: Clippy (rgb mint/burn)
        run: cargo clippy -p utexo-bridge-enclave --no-default-features --features vsock,rgb,bfa-mint --all-targets -- -D warnings
      - name: Test (rgb mint/burn)
        run: cargo test -p utexo-bridge-enclave --no-default-features --features rgb,bfa-mint,mock-attestation,allow-seed-import

      # CCD-only single-network EIF profile: ccd + shared EVM signing, no RGB
      # stack (no rgb-ops/rgb-consignment/rgb-schemas/spv). Mirrors
      # Dockerfile.enclave.ccd; RGB requests must be refused. The SignCcd
      # integration suite (test_sign_ccd.rs) is gated on ccd+allow-seed-import.
      - name: Build (ccd-only)
        run: cargo build -p utexo-bridge-enclave --no-default-features --features vsock,ccd
      - name: Clippy (ccd-only)
        run: cargo clippy -p utexo-bridge-enclave --no-default-features --features vsock,ccd,mock-attestation,allow-seed-import --all-targets -- -D warnings
      - name: Test (ccd-only)
        run: cargo test -p utexo-bridge-enclave --no-default-features --features ccd,mock-attestation,allow-seed-import

      # Minimal build: no features at all (`--no-default-features` drops the
      # default rgb/rgb-swap/ccd set). Keeps the no-SPV path compiling and exercises the
      # Guard that a no-spv build refuses to sign `fundsOut`
      # (test_no_spv_build_refuses_funds_out_even_without_merkle_proofs).
      # Skips the rgb-consignment dep entirely. Like every enclave build here it
      # still resolves the workspace's private RGB git sources using the keys above.
      - name: Build (minimal — no default features)
        run: cargo build -p utexo-bridge-enclave --no-default-features

      - name: Clippy (minimal — no default features)
        run: cargo clippy -p utexo-bridge-enclave --no-default-features --all-targets -- -D warnings

      - name: Test (minimal — no default features)
        run: cargo test -p utexo-bridge-enclave --no-default-features

      # In-enclave EVM FundsIn verification. The predicate + decoding
      # tests use a FakeProvider, so no real RPC is needed in CI.
      - name: Test (--features evm-rpc)
        run: cargo test -p utexo-bridge-enclave --features evm-rpc

      # Swap persistence and attestation coverage. Legacy cloning excludes
      # rgb-swap and runs in the CCD lane above.
      - name: Test (mock-attestation integration — swaps + attestation)
        run: cargo test -p utexo-bridge-enclave --features mock-attestation,allow-seed-import

  # Assert the dev-only features `compile_error!` in a release build, so a
  # misconfigured Dockerfile / CI matrix can never ship one. Each feature is
  # built individually with `--release`; the build MUST fail, and fail via
  # our guard rather than some unrelated error. Runs separately from `ci`
  # because these builds are expected to fail.
  release-guards:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature: [allow-seed-import, mock-attestation, dev-mode]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.96.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.1"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Set up SSH for private BFA deps
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts
          printf '%s\n' "${{ secrets.RGB_CONSIGNMENT_PARSER_DEPLOY_KEY }}"  > ~/.ssh/key_consignment
          printf '%s\n' "${{ secrets.RGB_CONSENSUS_BFA_DEPLOY_KEY }}"       > ~/.ssh/key_consensus
          printf '%s\n' "${{ secrets.RGB_OPS_BFA_DEPLOY_KEY }}"             > ~/.ssh/key_ops
          printf '%s\n' "${{ secrets.RGB_SCHEMAS_BFA_DEPLOY_KEY }}"         > ~/.ssh/key_schemas
          chmod 600 ~/.ssh/key_*
          cat >> ~/.ssh/config << 'SSHCONF'
          Host github-rgb-consignment
            HostName github.com
            User git
            IdentityFile ~/.ssh/key_consignment
            IdentitiesOnly yes
          Host github-rgb-consensus
            HostName github.com
            User git
            IdentityFile ~/.ssh/key_consensus
            IdentitiesOnly yes
          Host github-rgb-ops
            HostName github.com
            User git
            IdentityFile ~/.ssh/key_ops
            IdentitiesOnly yes
          Host github-rgb-schemas
            HostName github.com
            User git
            IdentityFile ~/.ssh/key_schemas
            IdentitiesOnly yes
          SSHCONF
          chmod 600 ~/.ssh/config

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            parent/target
          key: ${{ runner.os }}-cargo-release-guards-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-guards-

      - name: Assert release build is rejected with ${{ matrix.feature }}
        run: |
          if cargo build -p utexo-bridge-enclave --release --features ${{ matrix.feature }} 2>build.log; then
            echo "::error::release build unexpectedly SUCCEEDED with '${{ matrix.feature }}' — the compile_error release guard is missing or not firing"
            exit 1
          fi
          if ! grep -q "must not be enabled in a release build" build.log; then
            echo "::error::release build failed, but not via the expected compile_error guard for '${{ matrix.feature }}'"
            cat build.log
            exit 1
          fi
          echo "OK: release build correctly rejected '${{ matrix.feature }}' via the compile_error guard"

  # Assert that enabling `rgb-validation` without `spv` fails to compile via the
  # `compile_error!` in lib.rs. Without SPV, a consignment's
  # witness txs are anchored only through the host-controlled Esplora resolver,
  # so the enclave must never be built that way. Runs separately from `ci`
  # because the build is expected to fail. Unlike `release-guards` this is not
  # release-specific — the combination is unsafe in every profile.
  feature-guards:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.96.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.1"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Set up SSH for private BFA deps
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts
          printf '%s\n' "${{ secrets.RGB_CONSIGNMENT_PARSER_DEPLOY_KEY }}"  > ~/.ssh/key_consignment
          printf '%s\n' "${{ secrets.RGB_CONSENSUS_BFA_DEPLOY_KEY }}"       > ~/.ssh/key_consensus
          printf '%s\n' "${{ secrets.RGB_OPS_BFA_DEPLOY_KEY }}"             > ~/.ssh/key_ops
          printf '%s\n' "${{ secrets.RGB_SCHEMAS_BFA_DEPLOY_KEY }}"         > ~/.ssh/key_schemas
          chmod 600 ~/.ssh/key_*
          cat >> ~/.ssh/config << 'SSHCONF'
          Host github-rgb-consignment
            HostName github.com
            User git
            IdentityFile ~/.ssh/key_consignment
            IdentitiesOnly yes
          Host github-rgb-consensus
            HostName github.com
            User git
            IdentityFile ~/.ssh/key_consensus
            IdentitiesOnly yes
          Host github-rgb-ops
            HostName github.com
            User git
            IdentityFile ~/.ssh/key_ops
            IdentitiesOnly yes
          Host github-rgb-schemas
            HostName github.com
            User git
            IdentityFile ~/.ssh/key_schemas
            IdentitiesOnly yes
          SSHCONF
          chmod 600 ~/.ssh/config

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            parent/target
          key: ${{ runner.os }}-cargo-feature-guards-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-feature-guards-

      - name: Assert rgb-validation without spv is rejected
        run: |
          if cargo build -p utexo-bridge-enclave --no-default-features --features rgb-validation 2>build.log; then
            echo "::error::build unexpectedly SUCCEEDED with rgb-validation but no spv — the compile_error guard is missing or not firing"
            exit 1
          fi
          if ! grep -q "rgb-validation requires spv" build.log; then
            echo "::error::build failed, but not via the expected compile_error guard (rgb-validation requires spv)"
            cat build.log
            exit 1
          fi
          echo "OK: rgb-validation-without-spv correctly rejected via the compile_error guard"

      # The two RGB flows ship as two enclave instances. Enabling both would put
      # two sets of value-moving rules in one binary; enabling neither would
      # leave the build with no rule at all. Both must fail to compile.
      - name: Assert both RGB flows at once is rejected
        run: |
          if cargo build -p utexo-bridge-enclave --no-default-features --features spv,rgb-swap,rgb-mint-burn 2>build.log; then
            echo "::error::build unexpectedly SUCCEEDED with both rgb-swap and rgb-mint-burn — the compile_error guard is missing or not firing"
            exit 1
          fi
          if ! grep -q "mutually exclusive" build.log; then
            echo "::error::build failed, but not via the expected compile_error guard (rgb-swap / rgb-mint-burn are mutually exclusive)"
            cat build.log
            exit 1
          fi
          echo "OK: both-flows build correctly rejected via the compile_error guard"

      - name: Assert rgb-validation with no flow is rejected
        run: |
          if cargo build -p utexo-bridge-enclave --no-default-features --features spv 2>build.log; then
            echo "::error::build unexpectedly SUCCEEDED with rgb-validation but no flow — the compile_error guard is missing or not firing"
            exit 1
          fi
          if ! grep -q "rgb-validation requires a flow" build.log; then
            echo "::error::build failed, but not via the expected compile_error guard (rgb-validation requires a flow)"
            cat build.log
            exit 1
          fi
          echo "OK: no-flow build correctly rejected via the compile_error guard"

      - name: Assert KMS persistence without a supported flow is rejected
        run: |
          for features in kms-persistence rgb-mint-burn,kms-persistence; do
            if cargo check --locked -p utexo-bridge-enclave --no-default-features --features "$features" 2>build.log; then
              echo "::error::KMS persistence unexpectedly compiled with '$features'"
              exit 1
            fi
            if ! grep -q "kms-persistence is currently supported only by rgb-swap" build.log; then
              echo "::error::build failed without the expected KMS flow guard for '$features'"
              cat build.log
              exit 1
            fi
          done
