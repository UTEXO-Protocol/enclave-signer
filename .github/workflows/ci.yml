name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96"
          components: rustfmt, clippy

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev protobuf-compiler

      # The `rgb-consignment` dep (used by the rgb-validation / spv
      # feature combos) and the `federated-signer-proto` dep are hosted
      # in private repos and fetched over SSH. Load read-only deploy
      # keys registered on UTEXO-Protocol/rgb-consignment-parser and
      # UTEXO-Protocol/federated-signer-proto into the agent so cargo's
      # `git fetch` can authenticate. The default feature set now
      # includes `spv` (which pulls `rgb-validation`), so every build
      # below needs these keys — including the minimal
      # `--no-default-features` build, which still fetches the private
      # proto crate.
      - name: Set up SSH for private RGB deps
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: |
            ${{ secrets.RGB_CONSIGNMENT_PARSER_DEPLOY_KEY }}
            ${{ secrets.FEDERATED_SIGNER_PROTO_DEPLOY_KEY }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      # The default feature set is now `spv` (which pulls `rgb-validation`), so
      # the default build/clippy/test below exercise the production signing
      # path — the SPV-anchored fundsOut flow shipped in the EIF.
      - name: Build (default features)
        run: cargo build --workspace

      # `--all-targets` so clippy lints test code too — otherwise lints on
      # files under `tests/` slip through, as happened on the attestation PR.
      - name: Clippy (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test (default features)
        run: cargo test --workspace

      # Production build profile: the exact feature set shipped in the EIF
      # (build/Dockerfile.enclave). `helios` is required in production (#77) and
      # makes this a heavy build (2nd alloy major, revm, BLS, vendored OpenSSL).
      - name: Build (production combo)
        run: cargo build -p utexo-bridge-enclave --features vsock,rgb,ccd,evm-rpc,helios

      - name: Clippy (production combo)
        run: cargo clippy -p utexo-bridge-enclave --features vsock,rgb,ccd,evm-rpc,helios --all-targets -- -D warnings

      # SPV path coverage. Cannot use vsock here (Linux runner without
      # vsock support); spv pulls in rgb-validation transitively, which is
      # what the SPV unit + integration tests exercise.
      - name: Test (--features spv)
        run: cargo test -p utexo-bridge-enclave --features spv

      # RGB-only single-network EIF profile: rgb (=spv+rgb-validation) + evm-rpc,
      # `ccd` dropped via --no-default-features. Mirrors Dockerfile.enclave.rgb
      # minus `helios` — the shipped RGB image adds it (the release boot gate
      # requires the Helios source, #77), but it is already compile-covered by
      # the production combo above and doubling that heavy build here buys
      # nothing. CCD requests (SignCcd / CcdSource) must be refused here.
      - name: Build (rgb-only)
        run: cargo build -p utexo-bridge-enclave --no-default-features --features vsock,rgb,evm-rpc
      - name: Clippy (rgb-only)
        run: cargo clippy -p utexo-bridge-enclave --no-default-features --features vsock,rgb,evm-rpc --all-targets -- -D warnings
      - name: Test (rgb-only)
        run: cargo test -p utexo-bridge-enclave --no-default-features --features rgb,evm-rpc,mock-attestation,allow-seed-import

      # CCD-only single-network EIF profile: ccd + shared EVM signing, no RGB
      # stack (no rgb-ops/rgb-consignment/rgb-schemas/spv). Mirrors
      # Dockerfile.enclave.ccd; RGB requests must be refused. The SignCcd
      # integration suite (test_sign_ccd.rs) is gated on ccd+allow-seed-import.
      - name: Build (ccd-only)
        run: cargo build -p utexo-bridge-enclave --no-default-features --features vsock,ccd
      - name: Clippy (ccd-only)
        run: cargo clippy -p utexo-bridge-enclave --no-default-features --features vsock,ccd,mock-attestation,allow-seed-import --all-targets -- -D warnings
      - name: Test (ccd-only)
        run: cargo test -p utexo-bridge-enclave --no-default-features --features ccd,mock-attestation,allow-seed-import

      # Minimal build: no features at all (`--no-default-features` drops the
      # now-default `spv`). Keeps the no-SPV path compiling and exercises the
      # M-01 / #61 guard that a no-spv build refuses to sign `fundsOut`
      # (test_no_spv_build_refuses_funds_out_even_without_merkle_proofs).
      # Skips the private `rgb-consignment` dep, but still fetches the private
      # `federated-signer-proto` crate — the SSH agent set up above covers it.
      - name: Build (minimal — no default features)
        run: cargo build -p utexo-bridge-enclave --no-default-features

      - name: Clippy (minimal — no default features)
        run: cargo clippy -p utexo-bridge-enclave --no-default-features --all-targets -- -D warnings

      - name: Test (minimal — no default features)
        run: cargo test -p utexo-bridge-enclave --no-default-features

      # In-enclave EVM FundsIn verification (#60). The predicate + decoding
      # tests use a FakeProvider, so no real RPC is needed in CI.
      - name: Test (--features evm-rpc)
        run: cargo test -p utexo-bridge-enclave --features evm-rpc

      # Mock-attestation integration suite. The cloning handshake and attested
      # public-key tests (enclave/tests/test_clone.rs, test_attested_pubkey.rs)
      # are file-gated on `mock-attestation` + `allow-seed-import` — the mock
      # path skips NSM/COSE/cert-chain but still enforces the pubkey, digest,
      # nonce, and PCR bindings those tests assert. Without this step those
      # suites (donor PCR-mismatch / wire-pubkey binding, attested-bundle
      # parity) compile to nothing and never run. Debug profile only: the
      # release compile_error guard for these dev features is asserted
      # separately by the `release-guards` job.
      - name: Test (mock-attestation integration — cloning + attestation)
        run: cargo test -p utexo-bridge-enclave --features mock-attestation,allow-seed-import

  # Assert the dev-only features `compile_error!` in a release build, so a
  # misconfigured Dockerfile / CI matrix can never ship one. Each feature is
  # built individually with `--release`; the build MUST fail, and fail via
  # our guard rather than some unrelated error. Runs separately from `ci`
  # because these builds are expected to fail.
  release-guards:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature: [allow-seed-import, mock-attestation, dev-mode]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev protobuf-compiler

      # `rgb-consignment` is an optional git dep, but cargo still resolves
      # (and fetches) it from its pinned lockfile revision even when the
      # feature is off — so the build needs the deploy key to reach the
      # `compile_error!`, just like the `ci` job above.
      - name: Set up SSH for private RGB deps
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: |
            ${{ secrets.RGB_CONSIGNMENT_PARSER_DEPLOY_KEY }}
            ${{ secrets.FEDERATED_SIGNER_PROTO_DEPLOY_KEY }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-guards-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-guards-

      - name: Assert release build is rejected with ${{ matrix.feature }}
        run: |
          if cargo build -p utexo-bridge-enclave --release --features ${{ matrix.feature }} 2>build.log; then
            echo "::error::release build unexpectedly SUCCEEDED with '${{ matrix.feature }}' — the compile_error release guard is missing or not firing"
            exit 1
          fi
          if ! grep -q "must not be enabled in a release build" build.log; then
            echo "::error::release build failed, but not via the expected compile_error guard for '${{ matrix.feature }}'"
            cat build.log
            exit 1
          fi
          echo "OK: release build correctly rejected '${{ matrix.feature }}' via the compile_error guard"

  # Assert that enabling `rgb-validation` without `spv` fails to compile via the
  # `compile_error!` in lib.rs (audit M-01 / #61). Without SPV, a consignment's
  # witness txs are anchored only through the host-controlled Esplora resolver,
  # so the enclave must never be built that way. Runs separately from `ci`
  # because the build is expected to fail. Unlike `release-guards` this is not
  # release-specific — the combination is unsafe in every profile.
  feature-guards:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev protobuf-compiler

      # `--features rgb-validation` pulls the private `rgb-consignment` dep, and
      # cargo also resolves the private `federated-signer-proto` git dep from the
      # lockfile, both fetched before it reaches our crate's `compile_error!`, so
      # both deploy keys are required here just like the `ci` job above.
      - name: Set up SSH for private RGB deps
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: |
            ${{ secrets.RGB_CONSIGNMENT_PARSER_DEPLOY_KEY }}
            ${{ secrets.FEDERATED_SIGNER_PROTO_DEPLOY_KEY }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-feature-guards-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-feature-guards-

      - name: Assert rgb-validation without spv is rejected
        run: |
          if cargo build -p utexo-bridge-enclave --no-default-features --features rgb-validation 2>build.log; then
            echo "::error::build unexpectedly SUCCEEDED with rgb-validation but no spv — the compile_error guard is missing or not firing"
            exit 1
          fi
          if ! grep -q "rgb-validation requires spv" build.log; then
            echo "::error::build failed, but not via the expected compile_error guard (rgb-validation requires spv)"
            cat build.log
            exit 1
          fi
          echo "OK: rgb-validation-without-spv correctly rejected via the compile_error guard"
