name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
    inputs:
      run_stress:
        description: Run ignored RGB history and capacity checks in release mode
        type: boolean
        default: false

permissions:
  contents: read

# A new push to a pull request cancels the older run of that pull request.
# Runs on main and dev, and manual runs, always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # parent/Cargo.toml uses an ssh:// URL for its private dep; force Cargo to use
  # the system git so it honours the SSH setup step and the rgb-lib credential.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:

  # The jobs below run side by side. Together they hold the checks that one
  # long job held before. The last job, `ci`, keeps the old check name for
  # branch protection and passes only when every job passed.

  # Python script tests, format, the default workspace and the minimal builds.
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up the Rust build
        uses: ./.github/actions/setup
        with:
          components: rustfmt, clippy
          cache-name: workspace
          rgb-lib-bfa-deploy-key: ${{ secrets.RGB_LIB_BFA_DEPLOY_KEY }}
          rgb-private-deps-token: ${{ secrets.RGB_PRIVATE_DEPS_TOKEN }}
          federated-signer-proto-deploy-key: ${{ secrets.FEDERATED_SIGNER_PROTO_DEPLOY_KEY }}

      - name: Test build and deployment scripts
        run: |
          python3 -m unittest discover -s build/tests -v
          python3 -m unittest discover -s deploy/lambda/sns-to-slack -v

      # A [patch.crates-io] entry that does not match its requirement is dropped
      # with only a warning; one off rgb-lib's revs builds against other RGB crates.
      - name: Every RGB crate patch is used and copies rgb-lib's
        run: |
          for manifest in Cargo.toml parent/Cargo.toml; do
            cargo metadata --locked --format-version 1 --manifest-path "$manifest" > /dev/null 2> metadata.log || { cat metadata.log; exit 1; }
            if grep -q "was not used in the crate graph" metadata.log; then
              echo "::error::$manifest has an unused [patch.crates-io] entry"
              cat metadata.log
              exit 1
            fi
          done
          # The default set has no RGB, so ask for rgb-lib's crate explicitly.
          cargo metadata --locked --format-version 1 --features utexo-bridge-enclave/rgb-validation > metadata.json
          python3 - <<'EOF'
          import json, tomllib
          lib = next(p for p in json.load(open('metadata.json'))['packages'] if p['name'] == 'rgb-lib')
          theirs = tomllib.load(open(lib['manifest_path'], 'rb'))['patch']['crates-io']
          ours = tomllib.load(open('Cargo.toml', 'rb'))['patch']['crates-io']
          stale = [name for name in sorted(ours.keys() | theirs.keys())
                   if name not in ours or name not in theirs
                   or ours[name]['git'] != theirs[name]['git']
                   or not ours[name]['rev'].startswith(theirs[name]['rev'])]
          if stale:
              raise SystemExit(f"::error::Cargo.toml [patch.crates-io] differs from rgb-lib's: {stale}")
          EOF

      # NOTE: `parent/` is a SEPARATE cargo workspace (see the root Cargo.toml
      # comment), so `--workspace` here covers only enclave / enclave-proto /
      # attestation-verify. The `parent` job has the parent checks.
      - name: Check formatting
        run: cargo fmt --all -- --check

      # Defaults have no features. RGB builds need a signer role (jobs below).
      - name: Build (default features)
        run: cargo build --workspace

      # `--all-targets` so clippy also lints test code under `tests/`.
      - name: Clippy (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test (default features)
        run: cargo test --workspace

      # A dependency's tests do not run in the enclave/parent -p invocations.
      - name: Test (attestation verifier, mock documents)
        run: cargo test --locked -p attestation-verify --features mock

      # Minimal build: no features at all (`--no-default-features`). Exercises the guard that a build without
      # `rgb-validation` refuses an RGB source
      # (a_build_without_rgb_validation_refuses_rgb_sources).
      # Compiles no RGB dep. The no-SPV steps in the `no-spv` job compile the no-SPV path.
      - name: Build (minimal — no default features)
        run: cargo build -p utexo-bridge-enclave --no-default-features

      - name: Clippy (minimal — no default features)
        run: cargo clippy -p utexo-bridge-enclave --no-default-features --all-targets -- -D warnings

      - name: Test (minimal — no default features)
        run: cargo test -p utexo-bridge-enclave --no-default-features

      # Mock-attestation integration suite. The cloning handshake and attested
      # public-key tests (enclave/tests/test_clone.rs, test_attested_pubkey.rs)
      # are file-gated on `mock-attestation` + `allow-seed-import` — the mock
      # path skips NSM/COSE/cert-chain but still enforces the pubkey, digest,
      # nonce, and PCR bindings those tests assert. Without this step those
      # suites (donor PCR-mismatch / wire-pubkey binding, attested-bundle
      # parity) compile to nothing and never run. Debug profile only: the
      # release compile_error guard for these dev features is asserted
      # separately by the `release-guards` job.
      - name: Test (mock-attestation integration — cloning + attestation)
        run: cargo test -p utexo-bridge-enclave --features mock-attestation,allow-seed-import

  # The parent workspace has its own lockfile and target dir.
  parent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up the Rust build
        uses: ./.github/actions/setup
        with:
          components: rustfmt, clippy
          cache-name: parent
          rgb-lib-bfa-deploy-key: ${{ secrets.RGB_LIB_BFA_DEPLOY_KEY }}
          rgb-private-deps-token: ${{ secrets.RGB_PRIVATE_DEPS_TOKEN }}
          federated-signer-proto-deploy-key: ${{ secrets.FEDERATED_SIGNER_PROTO_DEPLOY_KEY }}

      - name: Check formatting (parent)
        run: cargo fmt --all --manifest-path parent/Cargo.toml -- --check

      - name: Build (parent)
        run: cargo build --manifest-path parent/Cargo.toml

      - name: Clippy (parent)
        run: cargo clippy --manifest-path parent/Cargo.toml --all-targets -- -D warnings

      - name: Test (parent)
        run: cargo test --manifest-path parent/Cargo.toml

      # The local VSOCK transport needs no Nitro enclave. Fail if the runner
      # cannot provide it: a missing device must not become a passing test.
      - name: Test (parent CLI, silent VSOCK peer)
        run: |
          sudo modprobe vsock_loopback
          cargo test --locked --manifest-path parent/Cargo.toml --features vsock --test test_cli_vsock_timeout

      - name: Clippy (parent, insecure-dev)
        run: cargo clippy --manifest-path parent/Cargo.toml --features insecure-dev --lib --bins --test test_insecure_dev -- -D warnings

      - name: Test (parent, insecure-dev)
        run: cargo test --manifest-path parent/Cargo.toml --features insecure-dev --test test_insecure_dev

  # BFA mint/burn EIF profiles - the shipped production images. The flow
  # ships as two signer roles, two enclaves: the mint signer (EVM -> RGB,
  # Dockerfile.enclave.mint) and the burn signer (RGB -> EVM,
  # Dockerfile.enclave.burn). Each role implies `rgb-validation`. Each job
  # compiles and tests only its own direction, and checks it refuses the other one
  # (tests/test_signer_role.rs). Mint also exercises KMS persistence; burn
  # uses the entropy/cloning lifecycle.
  mint-signer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up the Rust build
        uses: ./.github/actions/setup
        with:
          components: clippy
          cache-name: mint-signer
          rgb-lib-bfa-deploy-key: ${{ secrets.RGB_LIB_BFA_DEPLOY_KEY }}
          rgb-private-deps-token: ${{ secrets.RGB_PRIVATE_DEPS_TOKEN }}

      - name: Build (rgb mint signer)
        run: cargo build -p utexo-bridge-enclave --no-default-features --features vsock,spv,mint-signer
      - name: Clippy (rgb mint signer)
        run: cargo clippy -p utexo-bridge-enclave --no-default-features --features vsock,spv,mint-signer --all-targets -- -D warnings
      - name: Test (rgb mint signer)
        run: cargo test -p utexo-bridge-enclave --no-default-features --features spv,mint-signer,mock-attestation,allow-seed-import

      - name: Test (mint custody VSOCK deadline)
        run: cargo test --locked -p utexo-bridge-enclave --no-default-features --features vsock,spv,mint-signer --lib seed_persistence::tests::vsock_connect_rejects_expired_deadline_before_opening_a_socket -- --exact

  burn-signer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up the Rust build
        uses: ./.github/actions/setup
        with:
          components: clippy
          cache-name: burn-signer
          rgb-lib-bfa-deploy-key: ${{ secrets.RGB_LIB_BFA_DEPLOY_KEY }}
          rgb-private-deps-token: ${{ secrets.RGB_PRIVATE_DEPS_TOKEN }}

      - name: Build (rgb burn signer)
        run: cargo build -p utexo-bridge-enclave --no-default-features --features vsock,spv,burn-signer
      - name: Clippy (rgb burn signer)
        run: cargo clippy -p utexo-bridge-enclave --no-default-features --features vsock,spv,burn-signer --all-targets -- -D warnings
      - name: Test (rgb burn signer)
        run: cargo test -p utexo-bridge-enclave --no-default-features --features spv,burn-signer,mock-attestation,allow-seed-import

      # Keep expensive correctness regressions and timing measurements out
      # of ordinary PR counts, but give every ignored RGB test an explicit job.
      - name: Test (RGB release stress, on request)
        if: github.event_name == 'workflow_dispatch' && inputs.run_stress
        timeout-minutes: 30
        run: cargo test --locked --release -p utexo-bridge-enclave --no-default-features --features spv,burn-signer --lib networks::rgb::validation::tests -- --ignored --nocapture --test-threads=1

  # Three tests use a history of 10 000 transfers: the consignment memory
  # test, the whole burn request through dispatch, and the default request
  # limits. They are slow in a debug build and ignored by default. The
  # name filter runs only them. A separate job keeps them off the critical path.
  burn-signer-10000-transfers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up the Rust build
        uses: ./.github/actions/setup
        with:
          components: 
          cache-name: burn-signer
          rgb-lib-bfa-deploy-key: ${{ secrets.RGB_LIB_BFA_DEPLOY_KEY }}
          rgb-private-deps-token: ${{ secrets.RGB_PRIVATE_DEPS_TOKEN }}

      - name: Test (rgb burn signer, 10 000-transfer tests)
        run: cargo test -p utexo-bridge-enclave --no-default-features --features spv,burn-signer,mock-attestation,allow-seed-import --lib -- --ignored 10_000

  # Builds without SPV: the public-signet indexer profile.
  no-spv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up the Rust build
        uses: ./.github/actions/setup
        with:
          components: clippy
          cache-name: no-spv
          rgb-lib-bfa-deploy-key: ${{ secrets.RGB_LIB_BFA_DEPLOY_KEY }}
          rgb-private-deps-token: ${{ secrets.RGB_PRIVATE_DEPS_TOKEN }}

      - name: Check release (without SPV, mint and burn)
        run: |
          for role in mint-signer burn-signer; do
            cargo check --release -p utexo-bridge-enclave --no-default-features --features vsock,$role
          done
      - name: Test (without SPV, mint and burn)
        run: |
          for role in mint-signer burn-signer; do
            cargo test -p utexo-bridge-enclave --no-default-features --features $role --lib config::tests::
            cargo test -p utexo-bridge-enclave --no-default-features --features $role --test test_indexer_only --test test_evm_rpc_tls --test test_rpc_path
          done
          # Indexer consensus and release-binding guards belong to the burn role.
          cargo test -p utexo-bridge-enclave --no-default-features --features burn-signer --lib indexer_only
          cargo test -p utexo-bridge-enclave --no-default-features --features mint-signer --test test_bfa_mint_over_the_wire
          cargo test -p utexo-bridge-enclave --no-default-features --features mint-signer --test test_signing test_sign_btc
      - name: Clippy (without SPV, mint and burn)
        run: |
          for role in mint-signer burn-signer; do
            cargo clippy -p utexo-bridge-enclave --no-default-features --features vsock,$role --lib --bins --test test_indexer_only --test test_evm_rpc_tls --test test_rpc_path -- -D warnings
          done

  # The one check name that branch protection watches. It passes only when
  # every job above passed, and it fails when one was skipped or cancelled.
  ci:
    if: always()
    needs:
      - workspace
      - parent
      - mint-signer
      - burn-signer
      - burn-signer-10000-transfers
      - no-spv
      - release-guards
      - feature-guards
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || { echo "::error::a CI job did not succeed: $result"; exit 1; }
          done

  # Assert the dev-only features `compile_error!` in a release build, so a
  # misconfigured Dockerfile / CI matrix can never ship one. Each feature is
  # checked individually with `--release`; the check MUST fail, and fail via
  # our guard rather than some unrelated error. Runs separately from `ci`
  # because these builds are expected to fail.
  release-guards:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - feature: allow-seed-import
            target: -p utexo-bridge-enclave
          - feature: mock-attestation
            target: -p utexo-bridge-enclave
          - feature: allow-debug-pcrs
            target: -p utexo-bridge-enclave
          - feature: insecure-dev
            target: --manifest-path parent/Cargo.toml

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.96.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.1"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      # rgb-lib comes from a private mirror and the RGB crates it pins from public
      # repos. Cargo loads every git source of the lock, so every build here fetches them.
      - name: Set up access to the rgb-lib mirror
        env:
          RGB_LIB_BFA_DEPLOY_KEY: ${{ secrets.RGB_LIB_BFA_DEPLOY_KEY }}
          RGB_PRIVATE_DEPS_TOKEN: ${{ secrets.RGB_PRIVATE_DEPS_TOKEN }}
        run: sh build/ci-rgb-lib-access.sh

      - name: Set up SSH for private deps
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts
          printf '%s\n' "${{ secrets.FEDERATED_SIGNER_PROTO_DEPLOY_KEY }}" > ~/.ssh/key_federated
          chmod 600 ~/.ssh/key_*
          cat >> ~/.ssh/config << 'SSHCONF'
          Host github-federated-signer
            HostName github.com
            User git
            IdentityFile ~/.ssh/key_federated
            IdentitiesOnly yes
          SSHCONF
          chmod 600 ~/.ssh/config

      # Fork PRs can restore this public repo's caches. Per-repo paths, since tar
      # would pack an excluded subdirectory of a listed one. No target dirs: they
      # hold the compiled private RGB crates.
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/*/*
            !~/.cargo/git/*/rgb-lib-bfa-*
            !~/.cargo/git/*/rgb-consensus-*
            !~/.cargo/git/*/rgb-ops-*
            !~/.cargo/git/*/rgb-api-*
            !~/.cargo/git/*/rgb-schemas-*
          key: ${{ runner.os }}-cargo-release-guards-${{ matrix.feature }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-guards-

      - name: Assert release build is rejected with ${{ matrix.feature }}
        run: |
          if cargo check ${{ matrix.target }} --release --features ${{ matrix.feature }} 2>build.log; then
            echo "::error::release build unexpectedly SUCCEEDED with '${{ matrix.feature }}' — the compile_error release guard is missing or not firing"
            exit 1
          fi
          if ! grep -q "must not be enabled in a release build" build.log; then
            echo "::error::release build failed, but not via the expected compile_error guard for '${{ matrix.feature }}'"
            cat build.log
            exit 1
          fi
          echo "OK: release build correctly rejected '${{ matrix.feature }}' via the compile_error guard"

  # Reject unsupported feature combinations at compile time.
  feature-guards:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.96.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.1"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      # rgb-lib comes from a private mirror and the RGB crates it pins from public
      # repos. Cargo loads every git source of the lock, so every build here fetches them.
      - name: Set up access to the rgb-lib mirror
        env:
          RGB_LIB_BFA_DEPLOY_KEY: ${{ secrets.RGB_LIB_BFA_DEPLOY_KEY }}
          RGB_PRIVATE_DEPS_TOKEN: ${{ secrets.RGB_PRIVATE_DEPS_TOKEN }}
        run: sh build/ci-rgb-lib-access.sh

      # Fork PRs can restore this public repo's caches. Per-repo paths, since tar
      # would pack an excluded subdirectory of a listed one. No target dirs: they
      # hold the compiled private RGB crates.
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/*/*
            !~/.cargo/git/*/rgb-lib-bfa-*
            !~/.cargo/git/*/rgb-consensus-*
            !~/.cargo/git/*/rgb-ops-*
            !~/.cargo/git/*/rgb-api-*
            !~/.cargo/git/*/rgb-schemas-*
          key: ${{ runner.os }}-cargo-feature-guards-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-feature-guards-

      - name: Assert indexer-only builds cannot import seeds or mock attestation
        run: |
          for role in mint-signer burn-signer; do
            for forbidden in allow-seed-import mock-attestation allow-debug-pcrs; do
              if cargo check --locked -p utexo-bridge-enclave --no-default-features --features "$role,$forbidden" 2>build.log; then
                echo "::error::build unexpectedly compiled with $role,$forbidden"
                exit 1
              fi
              if ! grep -q "rgb-validation without spv requires real attestation" build.log; then
                cat build.log
                exit 1
              fi
            done
          done

      - name: Assert bare rgb-validation without a signer role is rejected
        run: |
          if cargo build -p utexo-bridge-enclave --no-default-features --features rgb-validation 2>build.log; then
            echo "::error::build unexpectedly SUCCEEDED with rgb-validation but no spv — the compile_error guard is missing or not firing"
            exit 1
          fi
          if ! grep -q "rgb-validation without spv requires mint-signer or burn-signer" build.log; then
            echo "::error::build failed, but not via the expected compile_error guard (rgb-validation without spv requires mint-signer or burn-signer)"
            cat build.log
            exit 1
          fi
          echo "OK: rgb-validation-without-spv correctly rejected via the compile_error guard"

      # The mint and burn signers are two enclaves with two seeds. An RGB build
      # must name exactly one role: both would put the mint and release rules
      # in one binary, neither would leave the role unstated.
      - name: Assert both signer roles at once is rejected
        run: |
          if cargo build -p utexo-bridge-enclave --no-default-features --features spv,mint-signer,burn-signer 2>build.log; then
            echo "::error::build unexpectedly SUCCEEDED with both mint-signer and burn-signer - the compile_error guard is missing or not firing"
            exit 1
          fi
          if ! grep -q "mint-signer and burn-signer are mutually exclusive" build.log; then
            echo "::error::build failed, but not via the expected compile_error guard (mint-signer / burn-signer are mutually exclusive)"
            cat build.log
            exit 1
          fi
          echo "OK: both-roles build correctly rejected via the compile_error guard"

      - name: Assert mint/burn with no signer role is rejected
        run: |
          if cargo build -p utexo-bridge-enclave --no-default-features --features spv 2>build.log; then
            echo "::error::build unexpectedly SUCCEEDED with spv but no signer role - the compile_error guard is missing or not firing"
            exit 1
          fi
          if ! grep -q "an RGB build requires a signer role" build.log; then
            echo "::error::build failed, but not via the expected compile_error guard (an RGB build requires a signer role)"
            cat build.log
            exit 1
          fi
          echo "OK: no-role build correctly rejected via the compile_error guard"

      - name: Assert KMS persistence outside the mint signer is rejected
        run: |
          for features in kms-persistence burn-signer,kms-persistence spv,kms-persistence; do
            if cargo check --locked -p utexo-bridge-enclave --no-default-features --features "$features" 2>build.log; then
              echo "::error::KMS persistence unexpectedly compiled with '$features'"
              exit 1
            fi
            if ! grep -q "kms-persistence requires mint-signer" build.log; then
              echo "::error::build failed without the expected KMS signer guard for '$features'"
              cat build.log
              exit 1
            fi
          done
