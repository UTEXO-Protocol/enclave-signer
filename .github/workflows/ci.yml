name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Cargo.toml uses ssh:// URLs for private deps; force Cargo to use the
  # system git so it honours SSH_AUTH_SOCK set by the SSH setup step.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  native-kms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # This stage uses public pinned AWS sources only. Building it on every
      # PR catches C/SDK/toolchain failures without private repository secrets.
      - name: Build official KMS helper
        run: |
          docker buildx build --platform linux/amd64 --load \
            --target kms-tool-builder -t swap-kms-native-ci \
            -f build/Dockerfile.enclave.rgb .

      - name: Verify native helper rejects malformed IPC
        run: |
          set +e
          printf '{}\n' | docker run --rm -i \
            --env LD_LIBRARY_PATH=/opt/swap-kms/lib \
            --entrypoint /opt/swap-kms/bin/swap-kms-tool \
            swap-kms-native-ci > helper-output.txt
          status=$?
          set -e
          test "$status" -eq 64
          test ! -s helper-output.txt

  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Test private dependency build wiring
        run: python3 -m unittest discover -s build/tests -v

      - name: Test RGB swap ciphertext broker
        run: |
          python3 -m venv /tmp/swap-kms-test-venv
          /tmp/swap-kms-test-venv/bin/pip install -r deploy/requirements-swap-kms.txt
          /tmp/swap-kms-test-venv/bin/python -m unittest discover -s deploy/tests -v

      - name: Install Rust 1.96.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.1"
          components: rustfmt, clippy

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      # Each private dep uses a per-repo SSH Host alias (e.g. github-rgb-consensus).
      # The alias maps to github.com with IdentityFile + IdentitiesOnly yes, so
      # SSH offers exactly ONE key per connection. Without this, the agent offers
      # all keys in order; GitHub authenticates with the first accepted key and
      # then refuses access to any repo that key is not authorised for.
      - name: Set up SSH for private deps
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts
          printf '%s\n' "${{ secrets.FEDERATED_SIGNER_PROTO_DEPLOY_KEY }}" > ~/.ssh/key_federated
          printf '%s\n' "${{ secrets.RGB_CONSIGNMENT_PARSER_DEPLOY_KEY }}"  > ~/.ssh/key_consignment
          printf '%s\n' "${{ secrets.RGB_CONSENSUS_BFA_DEPLOY_KEY }}"       > ~/.ssh/key_consensus
          printf '%s\n' "${{ secrets.RGB_OPS_BFA_DEPLOY_KEY }}"             > ~/.ssh/key_ops
          printf '%s\n' "${{ secrets.RGB_SCHEMAS_BFA_DEPLOY_KEY }}"         > ~/.ssh/key_schemas
          chmod 600 ~/.ssh/key_*
          cat >> ~/.ssh/config << 'SSHCONF'
          Host github-federated-signer
            HostName github.com
            User git
            IdentityFile ~/.ssh/key_federated
            IdentitiesOnly yes
          Host github-rgb-consignment
            HostName github.com
            User git
            IdentityFile ~/.ssh/key_consignment
            IdentitiesOnly yes
          Host github-rgb-consensus
            HostName github.com
            User git
            IdentityFile ~/.ssh/key_consensus
            IdentitiesOnly yes
          Host github-rgb-ops
            HostName github.com
            User git
            IdentityFile ~/.ssh/key_ops
            IdentitiesOnly yes
          Host github-rgb-schemas
            HostName github.com
            User git
            IdentityFile ~/.ssh/key_schemas
            IdentitiesOnly yes
          SSHCONF
          chmod 600 ~/.ssh/config

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            parent/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # NOTE: `parent/` is a SEPARATE cargo workspace (see the root Cargo.toml
      # comment), so `--workspace` here covers only enclave / enclave-proto /
      # attestation-verify. Parent gets its own steps below; keep them in sync
      # when adding checks.
      - name: Check formatting
        run: cargo fmt --all -- --check

      # Defaults are rgb + rgb-swap + ccd, so the steps below exercise the
      # signing path shipped in the combined EIF (minus vsock / evm-rpc).
      - name: Build (default features)
        run: cargo build --locked --workspace

      # `--all-targets` so clippy lints test code too — otherwise lints on
      # files under `tests/` slip through, as happened on the attestation PR.
      - name: Clippy (default features)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test (default features)
        run: cargo test --locked --workspace

      # --- parent workspace (separate lockfile, separate target dir) ---------
      - name: Check formatting (parent)
        run: cargo fmt --all --manifest-path parent/Cargo.toml -- --check

      - name: Build (parent)
        run: cargo build --locked --manifest-path parent/Cargo.toml

      - name: Clippy (parent)
        run: cargo clippy --locked --manifest-path parent/Cargo.toml --all-targets -- -D warnings

      - name: Test (parent)
        run: cargo test --locked --manifest-path parent/Cargo.toml

      # Production build profile: the exact feature set shipped in the EIF
      # (build/Dockerfile.enclave). `helios` is not shipped.
      - name: Build (production combo)
        run: cargo build --locked -p utexo-bridge-enclave --features vsock,rgb,rgb-swap,ccd,evm-rpc

      - name: Clippy (production combo)
        run: cargo clippy --locked -p utexo-bridge-enclave --features vsock,rgb,rgb-swap,ccd,evm-rpc --all-targets -- -D warnings

      # SPV path coverage. Cannot use vsock here (Linux runner without
      # vsock support); spv pulls in rgb-validation transitively, which is
      # what the SPV unit + integration tests exercise.
      - name: Test (--features spv,rgb-swap)
        run: cargo test --locked -p utexo-bridge-enclave --features spv,rgb-swap

      # RGB-only EIF profile, `ccd` dropped. Mirrors Dockerfile.enclave.rgb.
      # CCD requests (SignCcd / CcdSource) must be refused here.
      - name: Build (rgb-only)
        run: cargo build --locked -p utexo-bridge-enclave --no-default-features --features vsock,rgb,rgb-swap,evm-rpc
      - name: Clippy (rgb-only)
        run: cargo clippy --locked -p utexo-bridge-enclave --no-default-features --features vsock,rgb,rgb-swap,evm-rpc --all-targets -- -D warnings
      - name: Test (rgb-only)
        run: cargo test --locked -p utexo-bridge-enclave --no-default-features --features rgb,rgb-swap,evm-rpc,mock-attestation,allow-seed-import

      # Mint/burn RGB EIF profile - the second enclave instance. Same stack as
      # the rgb-only lane above with the other flow selected, so the mint and
      # burn rules in networks/rgb/flow/mint_burn.rs are actually compiled and
      # exercised. Mirrors Dockerfile.enclave.mint-burn.
      - name: Build (rgb mint/burn)
        run: cargo build --locked -p utexo-bridge-enclave --no-default-features --features vsock,rgb,rgb-mint-burn,evm-rpc
      - name: Clippy (rgb mint/burn)
        run: cargo clippy --locked -p utexo-bridge-enclave --no-default-features --features vsock,rgb,rgb-mint-burn,evm-rpc --all-targets -- -D warnings
      - name: Test (rgb mint/burn)
        run: cargo test --locked -p utexo-bridge-enclave --no-default-features --features rgb,rgb-mint-burn,evm-rpc,mock-attestation,allow-seed-import

      # BFA mint/burn EIF profile - the shipped production image. Mirrors
      # Dockerfile.enclave.bfa: the mint/burn flow plus the bridged-asset mint
      # path (chained-mint ancestry, settlementData bind). `bfa-mint` implies
      # rgb-mint-burn + evm-rpc.
      - name: Build (bfa-mint)
        run: cargo build --locked -p utexo-bridge-enclave --no-default-features --features vsock,rgb,evm-rpc,bfa-mint
      - name: Clippy (bfa-mint)
        run: cargo clippy --locked -p utexo-bridge-enclave --no-default-features --features vsock,rgb,evm-rpc,bfa-mint --all-targets -- -D warnings
      - name: Test (bfa-mint)
        run: cargo test --locked -p utexo-bridge-enclave --no-default-features --features rgb,bfa-mint,mock-attestation,allow-seed-import

      # CCD-only single-network EIF profile: ccd + shared EVM signing, no RGB
      # stack (no rgb-ops/rgb-consignment/rgb-schemas/spv). Mirrors
      # Dockerfile.enclave.ccd; RGB requests must be refused. The SignCcd
      # integration suite (test_sign_ccd.rs) is gated on ccd+allow-seed-import.
      - name: Build (ccd-only)
        run: cargo build --locked -p utexo-bridge-enclave --no-default-features --features vsock,ccd
      - name: Clippy (ccd-only)
        run: cargo clippy --locked -p utexo-bridge-enclave --no-default-features --features vsock,ccd,mock-attestation,allow-seed-import --all-targets -- -D warnings
      - name: Test (ccd-only)
        run: cargo test --locked -p utexo-bridge-enclave --no-default-features --features ccd,mock-attestation,allow-seed-import

      # Minimal build: no features at all (`--no-default-features` drops the
      # default rgb/rgb-swap/ccd set). Keeps the no-SPV path compiling and exercises the
      # Guard that a no-spv build refuses to sign `fundsOut`
      # (test_no_spv_build_refuses_funds_out_even_without_merkle_proofs).
      # Skips the rgb-consignment dep entirely. Like every enclave build here it
      # still resolves the workspace's private RGB git sources using the keys above.
      - name: Build (minimal — no default features)
        run: cargo build --locked -p utexo-bridge-enclave --no-default-features

      - name: Clippy (minimal — no default features)
        run: cargo clippy --locked -p utexo-bridge-enclave --no-default-features --all-targets -- -D warnings

      - name: Test (minimal — no default features)
        run: cargo test --locked -p utexo-bridge-enclave --no-default-features

      # In-enclave EVM FundsIn verification. The predicate + decoding
      # tests use a FakeProvider, so no real RPC is needed in CI.
      - name: Test (--features evm-rpc)
        run: cargo test --locked -p utexo-bridge-enclave --features evm-rpc

      # Default swap mock-attestation and public-key coverage. Cloning tests
      # explicitly exclude rgb-swap and run in the non-swap CCD lane above.
      # Mock features skip NSM/COSE/cert-chain verification; their release
      # compile_error guards are asserted separately by `release-guards`.
      - name: Test (mock-attestation integration — swaps + attestation)
        run: cargo test --locked -p utexo-bridge-enclave --features mock-attestation,allow-seed-import

  # Assert the dev-only features `compile_error!` in a release build, so a
  # misconfigured Dockerfile / CI matrix can never ship one. Each feature is
  # built individually with `--release`; the build MUST fail, and fail via
  # our guard rather than some unrelated error. Runs separately from `ci`
  # because these builds are expected to fail.
  release-guards:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature: [allow-seed-import, mock-attestation, dev-mode]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.96.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.1"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Set up SSH for private BFA deps
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts
          printf '%s\n' "${{ secrets.RGB_CONSIGNMENT_PARSER_DEPLOY_KEY }}"  > ~/.ssh/key_consignment
          printf '%s\n' "${{ secrets.RGB_CONSENSUS_BFA_DEPLOY_KEY }}"       > ~/.ssh/key_consensus
          printf '%s\n' "${{ secrets.RGB_OPS_BFA_DEPLOY_KEY }}"             > ~/.ssh/key_ops
          printf '%s\n' "${{ secrets.RGB_SCHEMAS_BFA_DEPLOY_KEY }}"         > ~/.ssh/key_schemas
          chmod 600 ~/.ssh/key_*
          cat >> ~/.ssh/config << 'SSHCONF'
          Host github-rgb-consignment
            HostName github.com
            User git
            IdentityFile ~/.ssh/key_consignment
            IdentitiesOnly yes
          Host github-rgb-consensus
            HostName github.com
            User git
            IdentityFile ~/.ssh/key_consensus
            IdentitiesOnly yes
          Host github-rgb-ops
            HostName github.com
            User git
            IdentityFile ~/.ssh/key_ops
            IdentitiesOnly yes
          Host github-rgb-schemas
            HostName github.com
            User git
            IdentityFile ~/.ssh/key_schemas
            IdentitiesOnly yes
          SSHCONF
          chmod 600 ~/.ssh/config

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            parent/target
          key: ${{ runner.os }}-cargo-release-guards-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-guards-

      - name: Assert release build is rejected with ${{ matrix.feature }}
        run: |
          if cargo build --locked -p utexo-bridge-enclave --release --features ${{ matrix.feature }} 2>build.log; then
            echo "::error::release build unexpectedly SUCCEEDED with '${{ matrix.feature }}' — the compile_error release guard is missing or not firing"
            exit 1
          fi
          if ! grep -q "must not be enabled in a release build" build.log; then
            echo "::error::release build failed, but not via the expected compile_error guard for '${{ matrix.feature }}'"
            cat build.log
            exit 1
          fi
          echo "OK: release build correctly rejected '${{ matrix.feature }}' via the compile_error guard"

  # Assert that enabling `rgb-validation` without `spv` fails to compile via the
  # `compile_error!` in lib.rs. Without SPV, a consignment's
  # witness txs are anchored only through the host-controlled Esplora resolver,
  # so the enclave must never be built that way. Runs separately from `ci`
  # because the build is expected to fail. Unlike `release-guards` this is not
  # release-specific — the combination is unsafe in every profile.
  feature-guards:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.96.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.1"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Set up SSH for private BFA deps
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts
          printf '%s\n' "${{ secrets.RGB_CONSIGNMENT_PARSER_DEPLOY_KEY }}"  > ~/.ssh/key_consignment
          printf '%s\n' "${{ secrets.RGB_CONSENSUS_BFA_DEPLOY_KEY }}"       > ~/.ssh/key_consensus
          printf '%s\n' "${{ secrets.RGB_OPS_BFA_DEPLOY_KEY }}"             > ~/.ssh/key_ops
          printf '%s\n' "${{ secrets.RGB_SCHEMAS_BFA_DEPLOY_KEY }}"         > ~/.ssh/key_schemas
          chmod 600 ~/.ssh/key_*
          cat >> ~/.ssh/config << 'SSHCONF'
          Host github-rgb-consignment
            HostName github.com
            User git
            IdentityFile ~/.ssh/key_consignment
            IdentitiesOnly yes
          Host github-rgb-consensus
            HostName github.com
            User git
            IdentityFile ~/.ssh/key_consensus
            IdentitiesOnly yes
          Host github-rgb-ops
            HostName github.com
            User git
            IdentityFile ~/.ssh/key_ops
            IdentitiesOnly yes
          Host github-rgb-schemas
            HostName github.com
            User git
            IdentityFile ~/.ssh/key_schemas
            IdentitiesOnly yes
          SSHCONF
          chmod 600 ~/.ssh/config

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            parent/target
          key: ${{ runner.os }}-cargo-feature-guards-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-feature-guards-

      - name: Assert rgb-validation without spv is rejected
        run: |
          if cargo build --locked -p utexo-bridge-enclave --no-default-features --features rgb-validation 2>build.log; then
            echo "::error::build unexpectedly SUCCEEDED with rgb-validation but no spv — the compile_error guard is missing or not firing"
            exit 1
          fi
          if ! grep -q "rgb-validation requires spv" build.log; then
            echo "::error::build failed, but not via the expected compile_error guard (rgb-validation requires spv)"
            cat build.log
            exit 1
          fi
          echo "OK: rgb-validation-without-spv correctly rejected via the compile_error guard"

      # The two RGB flows ship as two enclave instances. Enabling both would put
      # two sets of value-moving rules in one binary; enabling neither would
      # leave the build with no rule at all. Both must fail to compile.
      - name: Assert both RGB flows at once is rejected
        run: |
          if cargo build --locked -p utexo-bridge-enclave --no-default-features --features spv,rgb-swap,rgb-mint-burn 2>build.log; then
            echo "::error::build unexpectedly SUCCEEDED with both rgb-swap and rgb-mint-burn — the compile_error guard is missing or not firing"
            exit 1
          fi
          if ! grep -q "mutually exclusive" build.log; then
            echo "::error::build failed, but not via the expected compile_error guard (rgb-swap / rgb-mint-burn are mutually exclusive)"
            cat build.log
            exit 1
          fi
          echo "OK: both-flows build correctly rejected via the compile_error guard"

      - name: Assert rgb-validation with no flow is rejected
        run: |
          if cargo build --locked -p utexo-bridge-enclave --no-default-features --features spv 2>build.log; then
            echo "::error::build unexpectedly SUCCEEDED with rgb-validation but no flow — the compile_error guard is missing or not firing"
            exit 1
          fi
          if ! grep -q "rgb-validation requires a flow" build.log; then
            echo "::error::build failed, but not via the expected compile_error guard (rgb-validation requires a flow)"
            cat build.log
            exit 1
          fi
          echo "OK: no-flow build correctly rejected via the compile_error guard"
