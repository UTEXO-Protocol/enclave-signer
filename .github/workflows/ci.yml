name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
          components: rustfmt, clippy

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev protobuf-compiler

      # The `rgb-consignment` dep (used by the rgb-validation / spv
      # feature combos) is hosted in a private repo. Wire a PAT into
      # git's credential layer so cargo can fetch it. The token only
      # needs `repo:read` on UTEXO-Protocol; default features build
      # without this, but every job below that enables `rgb-validation`
      # or `spv` will fail without it.
      - name: Configure git for private RGB deps
        env:
          GH_PAT: ${{ secrets.UTEXO_GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "::warning::secret UTEXO_GH_PAT not set; jobs that build --features rgb-validation/spv will fail to fetch rgb-consignment"
          else
            git config --global url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "https://github.com/"
          fi

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build (default features)
        run: cargo build --workspace

      # `--all-targets` so clippy lints test code too — otherwise lints on
      # files under `tests/` slip through, as happened on the attestation PR.
      - name: Clippy (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test (default features)
        run: cargo test --workspace

      # Production build profile: vsock + rgb-validation + spv. Catches any
      # regression on the actual feature combination shipped in the EIF.
      - name: Build (production combo)
        run: cargo build -p utexo-bridge-enclave --features vsock,rgb-validation,spv

      - name: Clippy (production combo)
        run: cargo clippy -p utexo-bridge-enclave --features vsock,rgb-validation,spv --all-targets -- -D warnings

      # SPV path coverage. Cannot use vsock here (Linux runner without
      # vsock support); spv pulls in rgb-validation transitively, which is
      # what the SPV unit + integration tests exercise.
      - name: Test (--features spv)
        run: cargo test -p utexo-bridge-enclave --features spv
