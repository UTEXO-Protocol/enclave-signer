# Use the system `git` binary (with its credential helper / SSH agent) to fetch
# git dependencies, rather than cargo's bundled libgit2, which does not pick up
# an SSH agent reliably across platforms.
#
# The enclave workspace no longer needs this for auth -- all of its git deps are
# public HTTPS. It is kept for `parent/`, whose `federated-signer-proto` dep is
# still fetched over SSH, and because system git honours any `insteadOf` URL
# rewrites a developer has configured.
[net]
git-fetch-with-cli = true
