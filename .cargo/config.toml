# Use the system `git` binary (with its credential helper / SSH agent) to fetch
# git dependencies, rather than cargo's bundled libgit2, which does not pick up
# an SSH agent reliably across platforms.
#
# The private git deps need that git's SSH and credential setup:
# build/with-private-deps.sh in Docker, build/ci-rgb-lib-access.sh in CI.
[net]
git-fetch-with-cli = true
