# Use the system `git` binary (with its credential helper / SSH agent) to fetch
# git dependencies, rather than cargo's bundled libgit2, which does not pick up
# an SSH agent reliably across platforms.
#
# Both workspaces resolve private dependencies through per-repository SSH
# aliases. Docker builds configure them in build/with-private-deps.sh; CI sets
# up the matching deploy keys. System Git also honors the token URL rewrites.
[net]
git-fetch-with-cli = true
