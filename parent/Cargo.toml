# Its OWN workspace, deliberately separate from the enclave workspace at the
# repo root — see the comment there. In short: the parent needs the private
# `federated-signer-proto` crate, and a shared workspace would force that
# credential onto every enclave build, breaking public PCR0 reproducibility.
#
# Consequence: build the parent from THIS directory (`cd parent && cargo build`),
# not with `-p utexo-bridge-parent` from the repo root. It also carries its own
# Cargo.lock, and the `[patch.crates-io]` / `[profile.release]` blocks below
# duplicate the root ones — keep them in sync.
[workspace]

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1

# Must mirror the root workspace EXACTLY: the dev-dependency on
# `utexo-bridge-enclave` pulls its default features (`spv` -> `rgb-validation`),
# so the RGB crates land in this graph too. Pinned by rev rather than branch —
# with `branch = "master"` this workspace resolved to a newer commit than the
# root and the two compiled against different rgb-ops. Bump both together.
[patch.crates-io]
# Mirrors the root block verbatim, including rgb-consensus: the `s/bfa` rgb-ops
# references the ether extension, so it does not build against a crates.io
# rgb-consensus of the same version.
rgb-consensus = { git = "https://github.com/UTEXO-Protocol/rgb-consensus-s-bfa", rev = "68a1470e22ae4bb6a38205404e484b264b4139ee" }
rgb-ops = { git = "https://github.com/UTEXO-Protocol/rgb-ops-s-bfa", rev = "3bcc7d98d759a8b71bf94ad4a36371dcb7bf392b" }
rgb-invoicing = { git = "https://github.com/UTEXO-Protocol/rgb-ops-s-bfa", rev = "3bcc7d98d759a8b71bf94ad4a36371dcb7bf392b" }
rgb-schemas = { git = "https://github.com/UTEXO-Protocol/rgb-schemas-s-bfa", rev = "af4f91e6807a9680ab195c28719197b7811ac5d6" }
rgb-strict-encoding = { git = "https://github.com/rgb-protocol/rgb-strict-encoding", rev = "7698a5e96a2a27d5bfa4cd3560da0e8af8e4a18a" }

[package]
name = "utexo-bridge-parent"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "utexo-bridge-parent"
path = "src/main.rs"

[[bin]]
name = "utexo-bridge-parent-cli"
path = "src/bin/cli.rs"

[[bin]]
name = "attest-verify"
path = "src/bin/attest_verify.rs"

[dependencies]
prost = "0.14"
tonic = "0.14"
tokio = { version = "1", features = ["full"] }
# Full schema from the shared upstream repo (bridge / node / orchestrator /
# parent / signer packages). The parent runs on the untrusted host, so needing a
# credential to build it costs nothing. Keep this rev in lockstep with the
# vendored slice in `enclave-proto/` — see its README.
federated-signer-proto = { git = "ssh://git@github.com/UTEXO-Protocol/federated-signer-proto.git", rev = "0614fbf6c35f8daf638e3e52fd72ea7ce728b20c", package = "federated-signer-proto" }
clap = { version = "4", features = ["derive"] }

thiserror = "2"
anyhow = "1"

hex = "0.4"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# attest-verify CLI dependencies. `mock` feature is enabled so the CLI can
# verify documents from an enclave built with `mock-attestation` for dev/CI;
# production verification (no --mock flag) goes through the real path.
attestation-verify = { path = "../attestation-verify", features = ["mock"] }
sha2 = "0.10"
# keccak256 for the CLI's consignment_hash integrity field (send-RGB PSBT path)
sha3 = "0.10"
rand = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
vsock = "0.5"

[features]
default = []
vsock = []

[dev-dependencies]
# Real enclave (with mock-attestation + seed-import) for end-to-end tests
# that drive the full CLI verifier against a live enclave + gRPC stack.
utexo-bridge-enclave = { path = "../enclave", features = ["mock-attestation", "allow-seed-import"] }
bitcoin = "0.32"
