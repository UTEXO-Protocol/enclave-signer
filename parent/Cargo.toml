# Separate workspace from the enclave workspace at the repo root. The parent
# needs the private `federated-signer-proto` crate. A shared workspace makes
# every enclave build need that credential and breaks public PCR0 reproduction.
#
# Build the parent from this directory (`cd parent && cargo build`).
# This workspace has its own Cargo.lock. The `[profile.release]` block copies
# the root block. Keep them in sync.
[workspace]

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1

# The root workspace's [patch.crates-io], for the enclave dev-dependency. Keep it equal, minus
# rgb-psbt-utils: only bfa-mint uses it, so here cargo would warn it unused.
[patch.crates-io]
rgb-consensus = { git = "ssh://git@github.com/rgb-tools-devs/rgb-consensus.git", rev = "4a614b72cf9d5fdca4f293ab529a7e342717021a" }
rgb-ops = { git = "ssh://git@github.com/rgb-tools-devs/rgb-ops.git", rev = "9d831d2f75b076a0f9574678341f3b262a4a7e16" }
rgb-invoicing = { git = "ssh://git@github.com/rgb-tools-devs/rgb-ops.git", rev = "9d831d2f75b076a0f9574678341f3b262a4a7e16" }
rgb-schemas = { git = "ssh://git@github.com/rgb-tools-devs/rgb-schemas.git", rev = "aa1e7fd20b33237a020bc37daa71f631e4657fca" }
rgb-strict-encoding = { git = "https://github.com/rgb-protocol/rgb-strict-encoding", rev = "e12b9944b30171950de03778d6666b24bc33d994" }
rgb-strict-encoding-derive = { git = "https://github.com/rgb-protocol/rgb-strict-encoding", rev = "e12b9944b30171950de03778d6666b24bc33d994" }
rgb-strict-types = { git = "https://github.com/rgb-protocol/rgb-strict-types", rev = "8714cdcc8af25333c27214cdf9f42a6388d484ff" }

[package]
name = "utexo-bridge-parent"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "utexo-bridge-parent"
path = "src/main.rs"

[[bin]]
name = "utexo-bridge-parent-cli"
path = "src/bin/cli.rs"

[[bin]]
name = "attest-verify"
path = "src/bin/attest_verify.rs"

[dependencies]
prost = "0.14"
tonic = { version = "0.14", features = ["tls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
http = "1"
# GlobalConcurrencyLimitLayer limits requests across connections. (F03-AF-13)
tower = { version = "0.5", features = ["limit"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
# Enclave connect with a timeout on TCP and vsock. Tokio already builds it.
socket2 = { version = "0.6", features = ["all"] }
# The optional seed storage bridge uses the AWS role provider and S3 client.
# The EC2 parent does not need SSO, credential subprocesses or SigV4a.
aws-config = { version = "=1.12.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-s3 = { version = "=1.146.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-credential-types = "=1.3.0"
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
zeroize = "1"
# Full schema from the shared upstream repo. The parent runs on the untrusted
# host, so a private build credential is acceptable here. Keep this rev equal
# to the vendored slice in `enclave-proto/` (see its README).
federated-signer-proto = { git = "ssh://git@github-federated-signer/UTEXO-Protocol/federated-signer-proto.git", rev = "e402c2aed0c2b097bd1f86392d12e8a6ac415e36", package = "federated-signer-proto" }
clap = { version = "4", features = ["derive", "env"] }
# `GET /health` readiness probe. Keep the axum version equal to tonic's axum.
axum = "0.8"
serde_json = "1"


thiserror = "2"
anyhow = "1"

hex = "0.4"
# Header sync: `bitcoin` parses and hashes headers. The source is the raw
# Electrum client (no default features). TLS trusts the WebPKI root bundle.
bitcoin = "0.32"
electrum-client = { version = "=0.24.1", default-features = false }
webpki-roots = "1.0"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# attest-verify CLI. The `mock` feature lets the CLI verify documents from a
# `mock-attestation` enclave in dev and CI. Without `--mock`, the CLI uses the
# real verification path.
attestation-verify = { path = "../attestation-verify", features = ["mock"] }
sha2 = "0.11"
# keccak256 for the CLI `consignment_hash` field (send-RGB PSBT path).
sha3 = "0.12"
rand = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
vsock = "0.5"
tokio-vsock = "=0.7.2"

[features]
default = []
vsock = []
# DANGER: dev only. The parent serves plaintext gRPC with no client auth on
# any bind address. A release build with it fails to compile.
insecure-dev = []

[dev-dependencies]
tonic-prost = "0.14"
# Edits a mock attestation document in the launch check tests.
ciborium = "0.2"
# Real enclave (mock-attestation, seed-import) for end-to-end tests of the
# CLI verifier against a live enclave and gRPC stack.
utexo-bridge-enclave = { path = "../enclave", features = ["mock-attestation", "allow-seed-import"] }
# Self-signed certificate for the header-sync TLS test, made in-process.
# The mTLS tests use openssl (tests/fixtures/parent-pki.sh).
rcgen = "0.14"
# Real-format documents under a test root, for the offline bundle tests.
attestation-verify = { path = "../attestation-verify", features = ["mock", "test-util"] }
