# Invariant 3 of the BFA port: a BFA consignment is validated only through
# rgb-lib's validate_consignment_with_resolver, which confirms a mint anchor
# only through our resolver of bound locks.
disallowed-methods = [
    { path = "rgbstd::containers::Consignment::validate", reason = "invariant 3: validate through rgb-lib validate_consignment_with_resolver with our resolvers" },
    { path = "rgbstd::validation::PendingValidation::resolve_anchor", reason = "invariant 3: anchors are confirmed only inside rgb-lib, through the bound-lock resolver" },
]
