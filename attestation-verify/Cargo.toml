[package]
name = "attestation-verify"
version = "0.1.0"
edition = "2021"
description = "AWS Nitro Enclave attestation document verification (COSE_Sign1 + AWS Nitro cert chain)"

[lib]
name = "attestation_verify"
path = "src/lib.rs"

[dependencies]
ciborium = "0.2"
p384 = { version = "0.13", features = ["ecdsa", "pem"] }
x509-cert = { version = "0.2", features = ["pem"] }
der = { version = "0.7", features = ["alloc"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
hex = "0.4"
thiserror = "2"

[features]
default = []
# Enables the mock document path: build raw-CBOR docs without COSE wrapping
# and verify them without cert-chain checks. PCR/nonce/pubkey binding still
# enforced. Tests-only.
mock = []
# UNSAFE, debug builds ONLY. When OFF (production/release default), the real
# verifier rejects attestation documents whose PCR0/1/2 are all zero, i.e.
# enclaves booted in debug mode with no measurement (F03-AF-12 / F02-AF-08):
# otherwise ANY debug EIF, sharing all-zero PCRs, could impersonate the trusted
# enclave. When ON, all-zero PCRs are accepted so debug/stage clone drills (which
# run enclaves in ENCLAVE_DEBUG_MODE) can verify each other. NEVER enable in a
# production EIF.
allow-debug-pcrs = []
