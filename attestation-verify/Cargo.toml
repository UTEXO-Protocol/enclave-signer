[package]
name = "attestation-verify"
version = "0.1.0"
edition = "2021"
description = "AWS Nitro Enclave attestation document verification (COSE_Sign1 + AWS Nitro cert chain)"

[lib]
name = "attestation_verify"
path = "src/lib.rs"

[dependencies]
ciborium = "0.2"
p384 = { version = "0.14", features = ["ecdsa", "pem"] }
x509-cert = { version = "0.3", features = ["pem"] }
der = { version = "0.8", features = ["alloc"] }
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
hex = "0.4"
sha2 = "0.11"
thiserror = "2"
# Signs real-format test documents (`test-util`).
rcgen = { version = "0.14", optional = true }

[dev-dependencies]
# Signed test chain for the COSE signature test.
rcgen = "0.14"

[features]
default = []
# Mock document path for tests only. Docs are raw CBOR without COSE and skip
# cert-chain checks. PCR, nonce and public key binding stay enforced.
mock = []
# Accept all-zero PCR0/1/2 in debug tests. (F03-AF-12 / F02-AF-08)
# Debug PCRs do not identify the peer image. Do not enable in production.
allow-debug-pcrs = []
# `test_util`: real-format documents signed under a test root. Tests only.
test-util = ["dep:rcgen"]
